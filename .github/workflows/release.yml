name: Firmware-Release

# Baut die Firmware ausschliesslich bei getaggten Versionen (v*.*.*) und
# haengt firmware.factory.bin als Release-Asset an - passend zur Regel aus
# der README ("Updates" / OTA per Git-Tag). Kompiliert wird mit
# secrets.public.yaml, NICHT mit echten Zugangsdaten: dieser Build ist fuer
# den anonymen Browser-Flash auf docs/index.html gedacht, nicht fuer den
# eigenen Betrieb. Siehe secrets.public.yaml fuer die Begruendung.
#
# Zusaetzlich zum Release-Asset wird dieselbe Datei nach docs/ committet:
# GitHub-Release-Assets senden kein Access-Control-Allow-Origin, ein
# fetch() von der Pages-Seite darauf scheitert im Browser immer mit
# "Failed to fetch" (CORS), unabhaengig vom Tag-Stand. manifest.json
# referenziert deshalb einen relativen, same-origin Pfad statt der
# Release-URL. Der ?v=-Parameter am manifest-Attribut in docs/index.html
# wird dabei auf den Tag-Namen gesetzt, damit GitHub Pages' eigener
# Cache (Cache-Control: max-age=600) nach einem Release nie eine
# veraltete manifest.json/firmware.factory.bin ausliefert.
#
# Manuelles Anstossen (workflow_dispatch) dient nur dem Testen des Builds
# ohne einen Tag zu setzen - dabei wird kein Release veroeffentlicht und
# auch nichts nach docs/ committet.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ESPHome installieren
        run: pip install esphome

      - name: Platzhalter-Secrets einsetzen
        run: cp secrets.public.yaml secrets.yaml

      - name: Firmware kompilieren
        run: esphome compile assist-satellit.yaml

      - name: Firmware-Datei einsammeln
        run: cp .esphome/build/assist-satellit/build/firmware.factory.bin firmware.factory.bin

      - name: Release veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: firmware.factory.bin
          generate_release_notes: true

      - name: Firmware same-origin nach docs/ committen (Browser-Flash)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp firmware.factory.bin docs/firmware.factory.bin
          sed -i -E 's/manifest="manifest\.json(\?v=[^"]*)?"/manifest="manifest.json?v=${{ github.ref_name }}"/' docs/index.html
          git add -f docs/firmware.factory.bin docs/index.html
          if git diff --cached --quiet; then
            echo "docs/ unveraendert, kein Commit noetig"
          else
            git commit -m "docs: Firmware und Cache-Busting auf ${{ github.ref_name }} aktualisieren"
            git push origin main
          fi
