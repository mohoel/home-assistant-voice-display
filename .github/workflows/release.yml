name: Firmware-Release

# Baut die Firmware ausschliesslich bei getaggten Versionen (v*.*.*) und
# haengt firmware.factory.bin als Release-Asset an - passend zur Regel aus
# der README ("Updates" / OTA per Git-Tag). Kompiliert wird mit
# secrets.public.yaml, NICHT mit echten Zugangsdaten: dieser Build ist fuer
# den anonymen Browser-Flash auf docs/index.html gedacht, nicht fuer den
# eigenen Betrieb. Siehe secrets.public.yaml fuer die Begruendung.
#
# Manuelles Anstossen (workflow_dispatch) dient nur dem Testen des Builds
# ohne einen Tag zu setzen - dabei wird kein Release veroeffentlicht.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ESPHome installieren
        run: pip install esphome

      - name: Platzhalter-Secrets einsetzen
        run: cp secrets.public.yaml secrets.yaml

      - name: Firmware kompilieren
        run: esphome compile assist-satellit.yaml

      - name: Firmware-Datei einsammeln
        run: cp .esphome/build/assist-satellit/build/firmware.factory.bin firmware.factory.bin

      - name: Release veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: firmware.factory.bin
          generate_release_notes: true
