# Bedienseite ueber die IP des Geraets (http://assist-satellit.local/).
#
# Die Seite ist **eigener Code** (web/app.js und web/app.css), nicht das
# ESPHome-Standard-Frontend. Der Haken dafuer sind css_include und js_include:
# ESPHome baut die Index-Seite selbst und legt sie als
#
#     <link rel=stylesheet href=/0.css><script type=module src=/0.js></script>
#     <esp-app></esp-app>
#
# ab (build_index_html in components/web_server/__init__.py). Laedt man das
# Standard-Bundle nicht, bleibt <esp-app> ein undefiniertes, leeres Element und
# unser Modul baut die Seite an seiner Stelle auf.
#
# Warum ueberhaupt eigener Code: Die Stile des Standard-Frontends stecken im
# Shadow DOM seiner lit-Komponenten und sind von aussen nur ueber eine einzige
# Variable (--primary-color) erreichbar; Radien, Kopfzeile und Zeilenraster sind
# hart verdrahtet. Ein Fork des 232-kB-Bundles waere die Alternative gewesen -
# minifiziert, nicht pflegbar und bei jedem ESPHome-Update neu zu bauen. Diese
# Seite haengt stattdessen nur an der REST-Schnittstelle des Geraets.
# Herkunft des Entwurfs und Pflegehinweise: web/README.md.
#
# sorting_groups bleibt die Quelle der Gruppierung - app.js zeigt genau die
# Entities, die einer Gruppe zugeordnet sind. sorting_groups setzt version: 3
# voraus.
#
# Der Webserver teilt sich den HTTP-Server mit dem captive_portal aus
# core.yaml - beides zusammen ist auf ESP-IDF vorgesehen und braucht keine
# Sonderbehandlung.
#
# Keine auth: Die Seite ist im LAN offen erreichbar. Wenn das stoeren sollte:
# hier einen auth-Block mit username/password aus secrets.yaml ergaenzen.

web_server:
  version: 3
  # Kein local: true! Damit liefert das Geraet fuer "/" das eingebaute
  # Standard-Frontend aus (web_server.cpp:431) und ignoriert die generierte
  # Index-Seite - /0.js wuerde nie geladen.
  #
  # js_url leert die Voreinstellung https://oi.esphome.io/v3/www.js, sonst
  # laedt das Standard-Bundle zusaetzlich nach. css_url ist ab version 2 schon
  # von Haus aus leer.
  js_url: ""
  # Pfade relativ zu assist-satellit.yaml, nicht zu dieser Datei:
  # CORE.relative_config_path loest immer gegen das Konfigurationsverzeichnis
  # auf - dieselbe Regel wie bei den Klaengen am Media Player.
  css_include: web/app.css
  js_include: web/app.js
  sorting_groups:
    - id: grp_display
      name: "Anzeige"
      sorting_weight: 10
    - id: grp_colors
      name: "Farben"
      sorting_weight: 20

globals:
  # Merker, dass on_boot durch ist. Ein Template-Select veroeffentlicht seinen
  # restore_value beim Setup - das feuert on_value, bevor LVGL steht.
  # apply_rotation steigt deshalb aus, solange dieser Merker false ist; gesetzt
  # wird er in core.yaml im on_boot mit priority -100, direkt gefolgt vom
  # ersten bewussten apply_rotation.
  #
  # Nicht mit init_in_progress aus voice.yaml verwechseln: das haengt an der
  # API-Verbindung, die Rotation muss lange davor sitzen.
  - id: boot_done
    type: bool
    restore_value: false
    initial_value: "false"

  # Symbolfarben zur Laufzeit. Bis hierher waren die Farben reine
  # Compile-Substitutions, die auch innerhalb von Lambdas textuell ersetzt
  # wurden - damit war jede Aenderung ein Neubau. Die Substitutions bleiben die
  # Quelle der Wahrheit fuer den Auslieferungszustand: sie stehen weiterhin nur
  # in assist-satellit.yaml und dienen hier als initial_value. Was der Nutzer
  # ueber die Weboberflaeche einstellt, ueberschreibt sie und ueberlebt dank
  # restore_value den Neustart.
  #
  # Typ int, weil lv_color_hex() ohnehin einen 0xRRGGBB-Wert nimmt.
  - id: col_listening
    type: int
    restore_value: true
    initial_value: "${color_listening}"
  - id: col_thinking
    type: int
    restore_value: true
    initial_value: "${color_thinking}"
  - id: col_replying
    type: int
    restore_value: true
    initial_value: "${color_replying}"
  - id: col_error
    type: int
    restore_value: true
    initial_value: "${color_error}"
  - id: col_dim
    type: int
    restore_value: true
    initial_value: "${color_text_dim}"
  # Timer-Ring am Bildschirmrand und Glocke beim Klingeln.
  - id: col_timer
    type: int
    restore_value: true
    initial_value: "${color_timer}"
  # Haken nach einem ausgefuehrten Befehl.
  - id: col_result
    type: int
    restore_value: true
    initial_value: "${color_result}"
  # Akzent der Standby-Seite "Zifferblatt": aktuelle Stunde und Minutenmarke
  # samt ihrem Glow. Der Kranz selbst bleibt weiss und ist nicht einstellbar.
  - id: col_dial
    type: int
    restore_value: true
    initial_value: "${color_dial}"

select:
  # Geraeteausrichtung. 45-Grad-Schritte gibt der Stack nicht her:
  # rotation_degrees ist cv.one_of(0, 90, 180, 270), und
  # LvglComponent::set_rotation(int) verlangt ein Vielfaches von 90.
  # Die Touch-Koordinaten dreht LVGL selbst mit.
  - platform: template
    id: sel_rotation
    name: "Ausrichtung"
    icon: mdi:screen-rotation
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "0°"
      - "90°"
      - "180°"
      - "270°"
    initial_option: "0°"
    web_server:
      sorting_group_id: grp_display
    on_value:
      - script.execute: apply_rotation

  # Standby-Seite. Ausgewertet von show_standby_page in ui.yaml, und zwar
  # ueber den Index: "Uhr" ist 0, "Zifferblatt" ist 1. Wer hier eine Option
  # einschiebt statt anhaengt, verschiebt damit die Zuordnung.
  #
  # Das on_value schaltet sofort um, wenn gerade eine Standby-Seite vorne
  # liegt - sonst saehe man die Auswahl erst nach dem naechsten Standby. Die
  # beiden Guards sind noetig, weil ein Template-Select seinen restaurierten
  # Wert schon beim Setup veroeffentlicht und dabei on_value feuert: boot_done
  # haelt den Aufruf so lange zurueck, bis LVGL steht (gesetzt in core.yaml im
  # on_boot mit priority -100), und erst danach darf die Seitenpruefung
  # ueberhaupt laufen. Deshalb zwei geschachtelte if statt einer and-Bedingung
  # - die Auswertungsreihenfolge ist so nicht nur wahrscheinlich, sondern
  # sichtbar.
  - platform: template
    id: sel_standby_page
    name: "Standby-Seite"
    icon: mdi:monitor-dashboard
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Uhr"
      - "Zifferblatt"
    initial_option: "Uhr"
    web_server:
      sorting_group_id: grp_display
    on_value:
      - if:
          condition:
            lambda: return id(boot_done);
          then:
            - if:
                condition:
                  or:
                    - lvgl.page.is_showing: page_standby
                    - lvgl.page.is_showing: page_dial
                then:
                  - script.execute: show_standby_page

text:
  # Farbeingabe als sechsstelliges Hex ohne Praefix (z. B. 03A9F4). Einen
  # Farbwaehler kennt das ESPHome-Dashboard nicht - Text ist der einzige Weg.
  #
  # Kein restore_value hier: die Globals oben sind die Quelle der Wahrheit und
  # halten den Wert ueber den Neustart. sync_color_texts schreibt sie im on_boot
  # in die Eingabefelder zurueck, damit die Weboberflaeche den echten Stand
  # zeigt. Deshalb optimistic - ohne set_action gaebe es sonst keinen Zustand.
  - platform: template
    id: txt_col_listening
    name: "Farbe Zuhoeren"
    icon: mdi:palette
    entity_category: config
    mode: text
    optimistic: true
    min_length: 6
    max_length: 6
    web_server:
      sorting_group_id: grp_colors
    on_value:
      - lambda: |-
          if (x.length() != 6) return;
          char *end = nullptr;
          unsigned long v = strtoul(x.c_str(), &end, 16);
          if (end == nullptr || *end != '\0') return;
          id(col_listening) = (int) v;
          id(apply_colors).execute();

  - platform: template
    id: txt_col_thinking
    name: "Farbe Verarbeitung"
    icon: mdi:palette
    entity_category: config
    mode: text
    optimistic: true
    min_length: 6
    max_length: 6
    web_server:
      sorting_group_id: grp_colors
    on_value:
      - lambda: |-
          if (x.length() != 6) return;
          char *end = nullptr;
          unsigned long v = strtoul(x.c_str(), &end, 16);
          if (end == nullptr || *end != '\0') return;
          id(col_thinking) = (int) v;
          id(apply_colors).execute();

  - platform: template
    id: txt_col_replying
    name: "Farbe Sprachausgabe"
