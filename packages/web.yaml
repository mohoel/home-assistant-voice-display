# Bedienseite ueber die IP des Geraets (http://assist-satellit.local/).
#
# ESPHome rendert hier ausschliesslich sein Standard-Entity-Dashboard - eigenes
# HTML gibt es nicht. Die "Bedienseite" ist deshalb eine Gruppe von Entities,
# geordnet ueber sorting_groups; die Gruppen und ihre Reihenfolge sind die
# einzige Gestaltungsmoeglichkeit. sorting_groups setzt version: 3 voraus.
#
# Der Webserver teilt sich den HTTP-Server mit dem captive_portal aus
# core.yaml - beides zusammen ist auf ESP-IDF vorgesehen und braucht keine
# Sonderbehandlung.
#
# Keine auth: Die Seite ist im LAN offen erreichbar. Wenn das stoeren sollte:
# hier einen auth-Block mit username/password aus secrets.yaml ergaenzen.

web_server:
  version: 3
  # Legt JS und CSS ins Flash (16 MB, unkritisch). Ohne das laedt das Frontend
  # von GitHub nach und die Seite bleibt ohne Internetzugang leer.
  local: true
  sorting_groups:
    - id: grp_display
      name: "Anzeige"
      sorting_weight: 10

globals:
  # Merker, dass on_boot durch ist. Ein Template-Select veroeffentlicht seinen
  # restore_value beim Setup - das feuert on_value, bevor LVGL steht.
  # apply_rotation steigt deshalb aus, solange dieser Merker false ist; gesetzt
  # wird er in core.yaml im on_boot mit priority -100, direkt gefolgt vom
  # ersten bewussten apply_rotation.
  #
  # Nicht mit init_in_progress aus voice.yaml verwechseln: das haengt an der
  # API-Verbindung, die Rotation muss lange davor sitzen.
  - id: boot_done
    type: bool
    restore_value: false
    initial_value: "false"

select:
  # Geraeteausrichtung. 45-Grad-Schritte gibt der Stack nicht her:
  # rotation_degrees ist cv.one_of(0, 90, 180, 270), und
  # LvglComponent::set_rotation(int) verlangt ein Vielfaches von 90.
  # Die Touch-Koordinaten dreht LVGL selbst mit.
  - platform: template
    id: sel_rotation
    name: "Ausrichtung"
    icon: mdi:screen-rotation
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "0°"
      - "90°"
      - "180°"
      - "270°"
    initial_option: "0°"
    web_server:
      sorting_group_id: grp_display
    on_value:
      - script.execute: apply_rotation

  # Standby-Seite. Ausgewertet von show_standby_page in ui.yaml, und zwar
  # ueber den Index: "Uhr" ist 0, "Zifferblatt" ist 1. Wer hier eine Option
  # einschiebt statt anhaengt, verschiebt damit die Zuordnung.
  #
  # Das on_value schaltet sofort um, wenn gerade eine Standby-Seite vorne
  # liegt - sonst saehe man die Auswahl erst nach dem naechsten Standby. Die
  # beiden Guards sind noetig, weil ein Template-Select seinen restaurierten
  # Wert schon beim Setup veroeffentlicht und dabei on_value feuert: boot_done
  # haelt den Aufruf so lange zurueck, bis LVGL steht (gesetzt in core.yaml im
  # on_boot mit priority -100), und erst danach darf die Seitenpruefung
  # ueberhaupt laufen. Deshalb zwei geschachtelte if statt einer and-Bedingung
  # - die Auswertungsreihenfolge ist so nicht nur wahrscheinlich, sondern
  # sichtbar.
  - platform: template
    id: sel_standby_page
    name: "Standby-Seite"
    icon: mdi:monitor-dashboard
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Uhr"
      - "Zifferblatt"
    initial_option: "Uhr"
    web_server:
      sorting_group_id: grp_display
    on_value:
      - if:
          condition:
            lambda: return id(boot_done);
          then:
            - if:
                condition:
                  or:
                    - lvgl.page.is_showing: page_standby
                    - lvgl.page.is_showing: page_dial
                then:
                  - script.execute: show_standby_page

switch:
  # Blendet page_power (packages/ui.yaml) ein - die einzige Seite, die nicht
  # ueber die Phase oder sel_standby_page gesteuert wird, sondern direkt ueber
  # diesen Schalter. Als ESPHome-Switch statt als importierte HA-Entity, damit
  # er ohne einen in Home Assistant vorab angelegten Helfer funktioniert -
  # genau wie sel_rotation und sel_standby_page oben entsteht die Entity von
  # selbst. Per Sprachbefehl also z. B. "Schalte PV Uebersicht ein".
  #
  # optimistic: true wie bei mute (packages/voice.yaml) - ein Template-Switch
  # hat sonst keinen eigenen Zustand. restore_mode RESTORE_DEFAULT_OFF, damit
  # ein Neustart nicht mitten in der PV-Uebersicht landet, ohne dass jemand
  # sie gerade angefordert hat.
  #
  # on_turn_on aktualisiert page_power vor dem Anzeigen (fuer den Fall, dass
  # seit dem letzten Mal ein Sensorwert verpasst wurde) und unterdrueckt wie
  # wake_display/show_config_page den automatischen Rueckfall - siehe dort.
  # on_turn_off raeumt nur auf, wenn die Seite ueberhaupt noch vorne liegt:
  # ohne die Bedingung wuerde ein Ausschalten aus einem ganz anderen Zustand
  # heraus (z. B. waehrend eines Sprachvorgangs) faelschlich update_ui
  # anstossen. update_ui selbst entscheidet dann zwischen Hauptseite und
  # Standby/aus - siehe dessen Kommentar.
  - platform: template
    id: sw_pv_overview
    name: "PV Übersicht"
    icon: mdi:solar-power-variant
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: grp_display
    on_turn_on:
      - script.execute: update_power_flow
      - script.stop: standby_return
      - lvgl.page.show: page_power
      - light.turn_on:
          id: display_brightness
          brightness: ${active_brightness}
    on_turn_off:
      - if:
          condition:
            lvgl.page.is_showing: page_power
          then:
            - script.execute: update_ui

script:
  # Uebertraegt den Select-Wert an LVGL. lvgl.display.set_rotation nimmt einen
  # Laufzeitwert an: der Parameter geht durch LValidator, der eine Lambda mit
  # Rueckgabetyp int akzeptiert (lv_validation.py:344, defines.py:226).
  # Damit entfaellt ein vierfacher if-Baum - aber auch die YAML-Pruefung auf
  # 0/90/180/270, die das Lambda hier selbst garantiert (default: 0).
  - id: apply_rotation
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(boot_done);
          then:
            - lvgl.display.set_rotation:
                rotation: !lambda |-
                  switch (id(sel_rotation).active_index().value_or(0)) {
                    case 1: return 90;
                    case 2: return 180;
                    case 3: return 270;
                    default: return 0;
                  }
