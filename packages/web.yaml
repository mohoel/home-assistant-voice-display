# Bedienseite ueber die IP des Geraets (http://assist-satellit.local/).
#
# ESPHome rendert hier ausschliesslich sein Standard-Entity-Dashboard - eigenes
# HTML gibt es nicht. Die "Bedienseite" ist deshalb eine Gruppe von Entities,
# geordnet ueber sorting_groups; die Gruppen und ihre Reihenfolge sind die
# einzige Gestaltungsmoeglichkeit. sorting_groups setzt version: 3 voraus.
#
# Der Webserver teilt sich den HTTP-Server mit dem captive_portal aus
# core.yaml - beides zusammen ist auf ESP-IDF vorgesehen und braucht keine
# Sonderbehandlung.
#
# Keine auth: Die Seite ist im LAN offen erreichbar. Wenn das stoeren sollte:
# hier einen auth-Block mit username/password aus secrets.yaml ergaenzen.

web_server:
  version: 3
  # Legt JS und CSS ins Flash (16 MB, unkritisch). Ohne das laedt das Frontend
  # von GitHub nach und die Seite bleibt ohne Internetzugang leer.
  local: true
  sorting_groups:
    - id: grp_display
      name: "Anzeige"
      sorting_weight: 10
    - id: grp_colors
      name: "Farben"
      sorting_weight: 20

globals:
  # Merker, dass on_boot durch ist. Ein Template-Select veroeffentlicht seinen
  # restore_value beim Setup - das feuert on_value, bevor LVGL steht.
  # apply_rotation steigt deshalb aus, solange dieser Merker false ist; gesetzt
  # wird er in core.yaml im on_boot mit priority -100, direkt gefolgt vom
  # ersten bewussten apply_rotation.
  #
  # Nicht mit init_in_progress aus voice.yaml verwechseln: das haengt an der
  # API-Verbindung, die Rotation muss lange davor sitzen.
  - id: boot_done
    type: bool
    restore_value: false
    initial_value: "false"

  # Symbolfarben zur Laufzeit. Bis hierher waren die Farben reine
  # Compile-Substitutions, die auch innerhalb von Lambdas textuell ersetzt
  # wurden - damit war jede Aenderung ein Neubau. Die Substitutions bleiben die
  # Quelle der Wahrheit fuer den Auslieferungszustand: sie stehen weiterhin nur
  # in assist-satellit.yaml und dienen hier als initial_value. Was der Nutzer
  # ueber die Weboberflaeche einstellt, ueberschreibt sie und ueberlebt dank
  # restore_value den Neustart.
  #
  # Typ int, weil lv_color_hex() ohnehin einen 0xRRGGBB-Wert nimmt.
  - id: col_listening
    type: int
    restore_value: true
    initial_value: "${color_listening}"
  - id: col_thinking
    type: int
    restore_value: true
    initial_value: "${color_thinking}"
  - id: col_replying
    type: int
    restore_value: true
    initial_value: "${color_replying}"
  - id: col_error
    type: int
    restore_value: true
    initial_value: "${color_error}"
  - id: col_dim
    type: int
    restore_value: true
    initial_value: "${color_text_dim}"

select:
  # Geraeteausrichtung. 45-Grad-Schritte gibt der Stack nicht her:
  # rotation_degrees ist cv.one_of(0, 90, 180, 270), und
  # LvglComponent::set_rotation(int) verlangt ein Vielfaches von 90.
  # Die Touch-Koordinaten dreht LVGL selbst mit.
  - platform: template
    id: sel_rotation
    name: "Ausrichtung"
    icon: mdi:screen-rotation
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "0°"
      - "90°"
      - "180°"
      - "270°"
    initial_option: "0°"
    web_server:
      sorting_group_id: grp_display
    on_value:
      - script.execute: apply_rotation

  # Standby-Seite. Vorerst gibt es nur die Uhr - der Select existiert schon,
  # damit der Mechanismus steht (show_standby_page in ui.yaml wertet ihn aus)
  # und spaetere Seiten nur noch eine Option und einen Zweig brauchen.
  # Kein Guard noetig: show_standby_page laeuft nur aus sleep_display heraus,
  # also lange nach dem Setup; on_value schaltet deshalb nichts um, sondern
  # traegt sich erst beim naechsten Standby aus.
  - platform: template
    id: sel_standby_page
    name: "Standby-Seite"
    icon: mdi:monitor-dashboard
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Uhr"
    initial_option: "Uhr"
    web_server:
      sorting_group_id: grp_display

text:
  # Farbeingabe als sechsstelliges Hex ohne Praefix (z. B. 03A9F4). Einen
  # Farbwaehler kennt das ESPHome-Dashboard nicht - Text ist der einzige Weg.
  #
  # Kein restore_value hier: die Globals oben sind die Quelle der Wahrheit und
  # halten den Wert ueber den Neustart. sync_color_texts schreibt sie im on_boot
  # in die Eingabefelder zurueck, damit die Weboberflaeche den echten Stand
  # zeigt. Deshalb optimistic - ohne set_action gaebe es sonst keinen Zustand.
  - platform: template
    id: txt_col_listening
    name: "Farbe Zuhoeren"
    icon: mdi:palette
    entity_category: config
    mode: text
    optimistic: true
    min_length: 6
    max_length: 6
    web_server:
      sorting_group_id: grp_colors
    on_value:
      - lambda: |-
          if (x.length() != 6) return;
          char *end = nullptr;
          unsigned long v = strtoul(x.c_str(), &end, 16);
          if (end == nullptr || *end != '\0') return;
          id(col_listening) = (int) v;
          id(apply_colors).execute();

  - platform: template
    id: txt_col_thinking
    name: "Farbe Verarbeitung"
    icon: mdi:palette
    entity_category: config
    mode: text
    optimistic: true
    min_length: 6
    max_length: 6
    web_server:
      sorting_group_id: grp_colors
    on_value:
      - lambda: |-
          if (x.length() != 6) return;
          char *end = nullptr;
          unsigned long v = strtoul(x.c_str(), &end, 16);
          if (end == nullptr || *end != '\0') return;
          id(col_thinking) = (int) v;
          id(apply_colors).execute();

  - platform: template
    id: txt_col_replying
    name: "Farbe Sprachausgabe"
    icon: mdi:palette
    entity_category: config
    mode: text
    optimistic: true
    min_length: 6
    max_length: 6
    web_server:
      sorting_group_id: grp_colors
    on_value:
      - lambda: |-
          if (x.length() != 6) return;
          char *end = nullptr;
          unsigned long v = strtoul(x.c_str(), &end, 16);
          if (end == nullptr || *end != '\0') return;
          id(col_replying) = (int) v;
          id(apply_colors).execute();

  - platform: template
    id: txt_col_error
    name: "Farbe Fehler"
    icon: mdi:palette
    entity_category: config
    mode: text
    optimistic: true
    min_length: 6
    max_length: 6
    web_server:
      sorting_group_id: grp_colors
    on_value:
      - lambda: |-
          if (x.length() != 6) return;
          char *end = nullptr;
          unsigned long v = strtoul(x.c_str(), &end, 16);
          if (end == nullptr || *end != '\0') return;
          id(col_error) = (int) v;
          id(apply_colors).execute();

  - platform: template
    id: txt_col_dim
    name: "Farbe gedimmt"
    icon: mdi:palette
    entity_category: config
    mode: text
    optimistic: true
    min_length: 6
    max_length: 6
    web_server:
      sorting_group_id: grp_colors
    on_value:
      - lambda: |-
          if (x.length() != 6) return;
          char *end = nullptr;
          unsigned long v = strtoul(x.c_str(), &end, 16);
          if (end == nullptr || *end != '\0') return;
          id(col_dim) = (int) v;
          id(apply_colors).execute();

script:
  # Schreibt die aktuellen Farbwerte in die Eingabefelder der Weboberflaeche.
  # Laeuft einmal im on_boot; das dabei ausgeloeste on_value schreibt denselben
  # Wert ins Global zurueck und ruft apply_colors - unschaedlich, aber der Grund,
  # warum apply_colors idempotent sein muss.
  - id: sync_color_texts
    mode: single
    then:
      - lambda: |-
          id(txt_col_listening).publish_state(str_sprintf("%06X", id(col_listening) & 0xFFFFFF));
          id(txt_col_thinking).publish_state(str_sprintf("%06X", id(col_thinking) & 0xFFFFFF));
          id(txt_col_replying).publish_state(str_sprintf("%06X", id(col_replying) & 0xFFFFFF));
          id(txt_col_error).publish_state(str_sprintf("%06X", id(col_error) & 0xFFFFFF));
          id(txt_col_dim).publish_state(str_sprintf("%06X", id(col_dim) & 0xFFFFFF));

  # Uebertraegt den Select-Wert an LVGL. lvgl.display.set_rotation nimmt einen
  # Laufzeitwert an: der Parameter geht durch LValidator, der eine Lambda mit
  # Rueckgabetyp int akzeptiert (lv_validation.py:344, defines.py:226).
  # Damit entfaellt ein vierfacher if-Baum - aber auch die YAML-Pruefung auf
  # 0/90/180/270, die das Lambda hier selbst garantiert (default: 0).
  - id: apply_rotation
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(boot_done);
          then:
            - lvgl.display.set_rotation:
                rotation: !lambda |-
                  switch (id(sel_rotation).active_index().value_or(0)) {
                    case 1: return 90;
                    case 2: return 180;
                    case 3: return 270;
                    default: return 0;
                  }
