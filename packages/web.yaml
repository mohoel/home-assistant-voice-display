script:
  # Schreibt die aktuellen Farbwerte in die Eingabefelder der Weboberflaeche.
  # Laeuft einmal im on_boot; das dabei ausgeloeste on_value schreibt denselben
  # Wert ins Global zurueck und ruft apply_colors - unschaedlich, aber der Grund,
  # warum apply_colors idempotent sein muss.
  - id: sync_color_texts
    mode: single
    then:
      - lambda: |-
          id(txt_col_listening).publish_state(str_sprintf("%06X", id(col_listening) & 0xFFFFFF));
          id(txt_col_thinking).publish_state(str_sprintf("%06X", id(col_thinking) & 0xFFFFFF));
          id(txt_col_replying).publish_state(str_sprintf("%06X", id(col_replying) & 0xFFFFFF));
          id(txt_col_error).publish_state(str_sprintf("%06X", id(col_error) & 0xFFFFFF));
          id(txt_col_dim).publish_state(str_sprintf("%06X", id(col_dim) & 0xFFFFFF));
          id(txt_col_timer).publish_state(str_sprintf("%06X", id(col_timer) & 0xFFFFFF));
          id(txt_col_result).publish_state(str_sprintf("%06X", id(col_result) & 0xFFFFFF));
          id(txt_col_dial).publish_state(str_sprintf("%06X", id(col_dial) & 0xFFFFFF));

  # Uebertraegt den Select-Wert an LVGL. lvgl.display.set_rotation nimmt einen
  # Laufzeitwert an: der Parameter geht durch LValidator, der eine Lambda mit
  # Rueckgabetyp int akzeptiert (lv_validation.py:344, defines.py:226).
  # Damit entfaellt ein vierfacher if-Baum - aber auch die YAML-Pruefung auf
  # 0/90/180/270, die das Lambda hier selbst garantiert (default: 0).
  - id: apply_rotation
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(boot_done);
          then:
            - lvgl.display.set_rotation:
                rotation: !lambda |-
                  switch (id(sel_rotation).active_index().value_or(0)) {
                    case 1: return 90;
                    case 2: return 180;
                    case 3: return 270;
                    default: return 0;
                  }
