# Basis: SoC, Netzwerk, API, OTA, Zeit.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Haengt zur Laufzeit die letzten 6 Hexzeichen der tatsaechlichen
  # Chip-MAC an den Namen an (z.B. lumi-a0d0a8) - nicht beim Compile,
  # sondern beim Booten auf dem jeweiligen Geraet gelesen. Das ist der
  # eingebaute ESPHome-Weg fuer genau unseren Vertriebsweg: eine einzige
  # Browser-Flash-Firmware fuer eine unbekannte Anzahl Geraete im selben
  # Netz. Ohne das kollidieren Hostname und mDNS-Instanzname zweier
  # Geraete (beide "lumi"), mDNS haengt bei der Kollision an eines von
  # ihnen ein "-2" an, und esphome run/logs --device lumi.local landet
  # unvorhersehbar auf dem einen oder anderen Geraet.
  name_add_mac_suffix: true
  # CST9217-Touch-Support (Plattform cst9220) gibt es erst ab 2026.7.0.
  min_version: 2026.7.0
  project:
    name: mohoel.lumi
    version: ${project_version}
  on_boot:
    # Nach dem Aufbau aller Komponenten einmal die Oberflaeche zeichnen. Ohne
    # das haengt page_main bis zur ersten API-Verbindung in einem
    # Zwischenzustand (Vollring sichtbar, aber kein Statusicon), weil update_ui
    # sonst erst in on_client_connected das erste Mal laeuft.
    - priority: -100
      then:
        # Zeit-Fallback per PCF85063-RTC (siehe time:-Block unten): die
        # Komponente liest beim Setup nur die rohen I2C-Register, gleicht sie
        # aber erst hier explizit gegen die Systemuhr ab - sonst wuerde das
        # bis zum ersten periodischen update_interval (Default 15 min) dauern.
        # settimeofday() darunter ist eine echte OS-Uhr: jeder time:-Platform
        # (auch ha_time) liest ueber dieselbe timestamp_now() daraus, ein
        # zweiter, eigener "Zeitgeber" mit eigenem now() entsteht also nicht -
        # id(ha_time).now() ist ab dieser Zeile gueltig, auch ganz ohne
        # API-Verbindung.
        - pcf85063.read_time: rtc_time
        # Erst ab hier steht LVGL. boot_done gibt apply_rotation frei (der
        # restaurierte Wert von sel_rotation hat sein on_value schon lange
        # vorher gefeuert, siehe packages/settings.yaml) und wird dann einmal
        # bewusst angewendet - vor update_ui, damit die Oberflaeche gleich in
        # der richtigen Ausrichtung gezeichnet wird.
        - globals.set:
            id: boot_done
            value: "true"
        - script.execute: apply_rotation
        - script.execute: update_ui
  # Hinweis: platformio_options (flash_mode, f_flash, f_cpu) aus der
  # Community-Config wirken beim nativen ESP-IDF-Toolchain nicht und wurden
  # entfernt. Die CPU-Frequenz steht unten im esp32-Block.

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG
  # INFO im Normalbetrieb. DEBUG loggt jeden Wake-Word-Inferenzschritt und
  # jeden Audio-Chunk - das kostet auf dem Geraet spuerbar CPU und kann
  # waehrend eines Sprachvorgangs zu Aussetzern fuehren.
  level: INFO

  # Zur Fehlersuche an den drei Komponenten, die sich den einzigen
  # I2S-Controller teilen, den folgenden Block einkommentieren und `level`
  # oben auf DEBUG stellen. Er hat die vier Fehler dieses Abends gefunden und
  # steht deshalb hier statt in der Historie:
  #
  #   level: DEBUG
  #   logs:
  #     api: INFO
  #     api.service: INFO
  #     lvgl: INFO
  #     light: INFO
  #     sensor: INFO
  #     text_sensor: INFO
  #     switch: INFO
  #     select: INFO
  #     audio: INFO
  #     speaker: INFO
  #     esp-idf: INFO
  #     component: INFO
  #     scheduler: INFO
  #     display.mipi_spi: INFO
  #     touchscreen: INFO
  #     cst9220: INFO
  #     online_image: INFO
  #     md5: INFO
  #
  # Zwei Dinge, die dabei Zeit gekostet haben:
  #
  # 1. Per-Tag-Level koennen nur *weniger* ausfuehrlich sein als das globale
  #    (logger/__init__.py prueft das). Deshalb global DEBUG und alles Laute
  #    einzeln herunterdrehen, nicht umgekehrt.
  # 2. Der Displaytreiber schreibt auf DEBUG "Setting MADCTL" pro Bild und
  #    flutet damit alles. Sein Tag heisst display.mipi_spi, nicht mipi_spi.
  #
  # Was auf INFO fehlt und den Unterschied macht: "Starting wake word
  # detection" und "Stopping" sind DEBUG (micro_wake_word.cpp:369/379), und
  # die Zustandswechsel der Pipeline ebenso (voice_assistant.cpp:607).

# WLAN/Captive-Portal/Improv stehen NICHT hier, sondern in einem eigenen
# Package (packages/wifi.yaml) - dort steht auch, warum der wifi:-Block ohne
# einkompilierte SSID auskommt.

api:
  encryption:
    key: !secret api_encryption_key

  # Optionaler Haken fuer Home Assistant. Fuer den normalen Betrieb wird er
  # nicht gebraucht - das Geraet kommt ohne eine einzige Automation aus, und
  # ohne diesen Aufruf aendert sich nichts.
  #
  # Er existiert, weil dem Geraet eine Sache grundsaetzlich fehlt: Was ein
  # Befehl bewirkt hat, erfaehrt es nie. on_intent_end hat im Codegen eine
  # leere Parameterliste (voice_assistant/__init__.py:311), also weder Domain
  # noch Entitaet noch Wert. Wer das trotzdem will - ein Gluehbirnen-Symbol
  # beim Schalten, ein Hinweis bei der Tuerklingel - kann von HA aus
  #
  #   action: esphome.assist_satellit_zeige_hinweis
  #   data: {icon: "mdi:door-open", nachricht: "Haustuer offen", sekunden: 10}
  #
  # icon ist entweder einer von sieben alten deutschen Namen (mikrofon, stumm,
  # warnung, offline, frage, haken, glocke) oder ein echter mdi:name wie ihn
  # Home Assistants Icon-Picker verwendet, z.B. mdi:bell, mdi:door-open,
  # mdi:water-alert. Der Font font_hint_icon (packages/ui.yaml) traegt dafuer
  # den echten MDI-Webfont - "mdi:" rendert also wirklich, ist kein reiner
  # Namensalias. Eingebettet ist trotzdem nur eine feste, zur Compile-Zeit
  # gewaehlte Auswahl: microphone, microphone-off, alert, wifi-off, help,
  # check, bell, alert-circle, door, door-open, motion-sensor, water,
  # water-alert, fire, thermometer, package-variant, lock, lock-open,
  # battery-alert, email. Jeder andere mdi:-Name zeigt nur den Text, kein
  # Icon - neue Namen brauchen einen Eintrag in font_hint_icon/show_hint
  # (packages/ui.yaml) plus Compile und OTA. Ein roher Codepoint
  # ("\U000F009A") geht weiterhin unveraendert durch.
  #
  # Der Parameter heisst nachricht und nicht text, weil cv.validate_id_name die
  # Namen der ESPHome-Plattformen sperrt - "text" ist eine davon.
  actions:
    - action: zeige_hinweis
      variables:
        icon: string
        nachricht: string
        sekunden: int
      then:
        - script.execute:
            id: show_hint
            icon: !lambda return icon;
            nachricht: !lambda return nachricht;
            sekunden: !lambda return sekunden;

    # Zweiter Haken, diesmal keine Zusatz-, sondern eine Kernfunktion: anders
    # als zeige_hinweis kommt die Wetteranzeige ohne eine HA-Automation gar
    # nicht zustande, weil auch hier gilt, was oben steht - das Geraet
    # erfaehrt nie, was ein Befehl bewirkt hat, und eine Vorhersage fuer einen
    # bestimmten Tag/eine bestimmte Stunde gibt es nur ueber
    # weather.get_forecasts, das ausschliesslich in Home Assistant aufrufbar
    # ist. Einrichtung (Skript + Satzausloeser zum Kopieren) steht in
    # README.md, Abschnitt "Wetter auf Nachfrage".
    #
    # zustand ist der rohe Home-Assistant-Wetterzustand (z.B. "partlycloudy"),
    # wird in stage_weather (packages/voice.yaml) auf einen von sieben
    # vereinfachten Icon-Buckets abgebildet. einheit ist meist "°C" - die
    # HA-Automation entscheidet, das Geraet nimmt sie unveraendert.
    - action: zeige_wetter
      variables:
        zustand: string
        temperatur: float
        einheit: string
      then:
        - script.execute:
            id: stage_weather
            zustand: !lambda return zustand;
            temperatur: !lambda return temperatur;
            einheit: !lambda return einheit;

ota:
  - platform: esphome
    password: !secret ota_password

# Zeitquelle fuer die Standby-Uhr
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      # Die Uhr zeigt nur HH:MM, also genuegt die volle Minute - und zwar
      # punktgenau statt bis zu 10 s versetzt wie beim frueheren 10-s-Intervall
      # in ui.yaml. Die Seitenpruefung spart das Neuzeichnen des 108-px-Fonts,
      # solange die Uhr gar nicht sichtbar ist; beim Betreten frischt
      # show_standby_page sie ohnehin auf. Im Standby liegt page_off vorne
      # (Bildschirm aus), dann trifft kein Zweig zu und der Takt macht nichts.
      # Die Widgets selbst stehen in ui.yaml.
      #
      # Hier lag frueher zusaetzlich der Einbrennschutz: Uhr, Datum und
      # Countdown wanderten minuetlich um ein paar Pixel, das Zifferblatt als
      # Ganzes ueber seinen Traeger dial_face. Der ist ersatzlos entfallen,
      # seit das Display nach num_standby_timeout (packages/settings.yaml) von
      # selbst ganz ausgeht (sleep_display in ui.yaml) - laenger als das steht
      # kein Standbild mehr auf dem Schirm, und page_off leuchtet ueberhaupt
      # nicht.
      #
      # Achtung: Es gibt einen Zweig je Standby-Seite, *die Zeit anzeigt*.
      # Sobald show_standby_page (ui.yaml) eine weitere schaltet, muss hier
      # einer dazukommen - sonst laeuft der Minutentakt auf ihr gar nicht.
      # page_face braucht deshalb keinen: das Gesicht kennt keine Uhrzeit, und
      # seine Bewegung haengt an einem eigenen interval in ui.yaml.
      - seconds: 0
        then:
          - if:
              condition:
                lvgl.page.is_showing: page_standby
              then:
                - script.execute: update_clock
          - if:
              condition:
                lvgl.page.is_showing: page_dial
              then:
                - script.execute: update_dial
    # Bei jeder erfolgreichen Synchronisation mit Home Assistant die dann
    # praezise Zeit in die RTC zurueckschreiben - sonst bliebe der PCF85063 auf
    # dem Stand seines letzten Boots stehen und der Fallback wuerde mit jedem
    # Neustart ungenauer. Kein Wettlauf mit dem Lesen oben: write_time liest
    # die gerade gesetzte Systemzeit, nicht die RTC.
    on_time_sync:
      - pcf85063.write_time:
          id: rtc_time

  # Zeit-Fallback, falls das Geraet (noch) keine API-Verbindung hat - siehe
  # on_boot oben. Haengt am selben I2C-Bus wie Touch und die Audio-Codecs
  # (packages/hardware.yaml), keine zusaetzliche Verdrahtung. Das Modul auf
  # dem Board hat keinen Adress-Pin, 0x51 ist der Schema-Default.
  #
  # update_interval bleibt beim 15-min-Default: ein zweites periodisches
  # Nachlesen aus der RTC ist unkritisch, auch nachdem Home Assistant laengst
  # synchronisiert hat - synchronize_epoch_() springt nur, wenn die Differenz
  # mehr als eine Sekunde betraegt, sonst feuert es nur den on_time_sync-
  # Trigger erneut (time/real_time_clock.cpp).
  - platform: pcf85063
    id: rtc_time
    i2c_id: bus_i2c

# Diagnose-Entities: helfen beim Einschaetzen des Speicherdrucks
# (LVGL + Voice Assistant sind zusammen speicherhungrig).
debug:
  update_interval: 60s

# Alles hier trug einmal disabled_by_default: true. Der Grund war die eigene
# Bedienseite des Geraets (packages/web.yaml, entfallen) - sie sollte nur die
# Display-Einstellungen zeigen, und web_server kennt kein "nur im Web
# verstecken". Ohne Weboberflaeche gibt es diesen Grund nicht mehr, und die
# Kehrseite ist teuer: eine frisch eingerichtete HA-Integration legt
# deaktivierte Entities an, und wer Displayhelligkeit oder Media Player dort
# vergisst, verliert den Standby-Weg und die Announcements. entity_category
# sortiert sie in Home Assistant ohnehin nach Diagnose bzw. Konfiguration.
sensor:
  - platform: debug
    free:
      name: "Freier Heap"
      entity_category: diagnostic
    psram:
      name: "Freier PSRAM"
      entity_category: diagnostic
  - platform: wifi_signal
    name: "WLAN-Signal"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "ESPHome-Version"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Neustart"
    entity_category: config
