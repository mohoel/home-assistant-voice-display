# Basis: SoC, Netzwerk, API, OTA, Zeit.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # CST9217-Touch-Support (Plattform cst9220) gibt es erst ab 2026.7.0.
  min_version: 2026.7.0
  project:
    name: mohoel.assist-satellit
    version: ${project_version}
  on_boot:
    # Nach dem Aufbau aller Komponenten einmal die Oberflaeche zeichnen. Ohne
    # das haengt page_main bis zur ersten API-Verbindung in einem
    # Zwischenzustand (Vollring sichtbar, aber kein Statusicon), weil update_ui
    # sonst erst in on_client_connected das erste Mal laeuft.
    - priority: -100
      then:
        # Erst ab hier steht LVGL. boot_done gibt apply_rotation frei (der
        # restaurierte Wert von sel_rotation hat sein on_value schon lange
        # vorher gefeuert, siehe packages/web.yaml) und wird dann einmal
        # bewusst angewendet - vor update_ui, damit die Oberflaeche gleich in
        # der richtigen Ausrichtung gezeichnet wird.
        - globals.set:
            id: boot_done
            value: "true"
        - script.execute: apply_rotation
        - script.execute: update_ui
  # Hinweis: platformio_options (flash_mode, f_flash, f_cpu) aus der
  # Community-Config wirken beim nativen ESP-IDF-Toolchain nicht und wurden
  # entfernt. Die CPU-Frequenz steht unten im esp32-Block.

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG
  # DEBUG loggt jeden Wake-Word-Inferenzschritt und jeden Audio-Chunk - das
  # kostet auf dem Geraet spuerbar CPU und kann waehrend eines Sprachvorgangs
  # zu Aussetzern fuehren. Zur Fehlersuche voruebergehend auf DEBUG stellen.
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Default auf ESP32 ist LIGHT: der WLAN-Chip schlaeft zwischen Beacons und
  # verzoegert Pakete um bis zu ein DTIM-Intervall. Fuer den kontinuierlichen
  # Audio-Stream zum und vom Assistenten bedeutet das Jitter und Aussetzer.
  power_save_mode: none
  ap:
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

  # Optionaler Haken fuer Home Assistant. Fuer den normalen Betrieb wird er
  # nicht gebraucht - das Geraet kommt ohne eine einzige Automation aus, und
  # ohne diesen Aufruf aendert sich nichts.
  #
  # Er existiert, weil dem Geraet eine Sache grundsaetzlich fehlt: Was ein
  # Befehl bewirkt hat, erfaehrt es nie. on_intent_end hat im Codegen eine
  # leere Parameterliste (voice_assistant/__init__.py:311), also weder Domain
  # noch Entitaet noch Wert. Wer das trotzdem will - ein Gluehbirnen-Symbol
  # beim Schalten, ein Hinweis bei der Tuerklingel - kann von HA aus
  #
  #   action: esphome.assist_satellit_zeige_hinweis
  #   data: {icon: "\U0000E31D", nachricht: "Post da", sekunden: 10}
  #
  # rufen. icon ist ein Codepoint aus dem Font font_icon (packages/ui.yaml);
  # nur die dort gelisteten Glyphen sind eingebettet, andere bleiben leer.
  #
  # Der Parameter heisst nachricht und nicht text, weil cv.validate_id_name die
  # Namen der ESPHome-Plattformen sperrt - "text" ist eine davon.
  actions:
    - action: zeige_hinweis
      variables:
        icon: string
        nachricht: string
        sekunden: int
      then:
        - script.execute:
            id: show_hint
            icon: !lambda return icon;
            nachricht: !lambda return nachricht;
            sekunden: !lambda return sekunden;

ota:
  - platform: esphome
    password: !secret ota_password

# Zeitquelle fuer die Standby-Uhr
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      # Die Uhr zeigt nur HH:MM, also genuegt die volle Minute - und zwar
      # punktgenau statt bis zu 10 s versetzt wie beim frueheren 10-s-Intervall
      # in ui.yaml. Die Seitenpruefung spart das Neuzeichnen des 108-px-Fonts,
      # solange die Uhr gar nicht sichtbar ist; beim Betreten frischt
      # show_standby_page sie ohnehin auf. Im Standby liegt page_off vorne
      # (Bildschirm aus), dann trifft kein Zweig zu und der Takt macht nichts.
      # Die Widgets selbst stehen in ui.yaml.
      #
      # Hier lag frueher zusaetzlich der Einbrennschutz: Uhr, Datum und
      # Countdown wanderten minuetlich um ein paar Pixel, das Zifferblatt als
      # Ganzes ueber seinen Traeger dial_face. Der ist ersatzlos entfallen,
      # seit das Display nach ${standby_timeout} von selbst ganz ausgeht
      # (sleep_display in ui.yaml) - laenger als standby_timeout steht kein
      # Standbild mehr auf dem Schirm, und page_off leuchtet ueberhaupt nicht.
      #
      # Achtung: Es gibt einen Zweig je Standby-Seite, *die Zeit anzeigt*.
      # Sobald show_standby_page (ui.yaml) eine weitere schaltet, muss hier
      # einer dazukommen - sonst laeuft der Minutentakt auf ihr gar nicht.
      # page_face braucht deshalb keinen: das Gesicht kennt keine Uhrzeit, und
      # seine Bewegung haengt an einem eigenen interval in ui.yaml.
      - seconds: 0
        then:
          - if:
              condition:
                lvgl.page.is_showing: page_standby
              then:
                - script.execute: update_clock
          - if:
              condition:
                lvgl.page.is_showing: page_dial
              then:
                - script.execute: update_dial

# Diagnose-Entities: helfen beim Einschaetzen des Speicherdrucks
# (LVGL + Voice Assistant sind zusammen speicherhungrig).
debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      name: "Freier Heap"
      entity_category: diagnostic
    psram:
      name: "Freier PSRAM"
      entity_category: diagnostic
  - platform: wifi_signal
    name: "WLAN-Signal"
    update_interval: 60s
    entity_category: diagnostic

  # PV-Uebersicht (page_power in packages/ui.yaml): reine Importe bereits
  # bestehender Home-Assistant-Sensoren, analog zu ha_time weiter oben - das
  # Geraet misst selbst nichts. internal: true wie bei device_ip, damit keine
  # doppelten Entities entstehen (die Werte stehen schon in HA).
  #
  # Alle vier in Watt; update_power_flow (ui.yaml) rechnet ab 1000 W selbst
  # auf kW um. Ein fehlender oder negativer Wert (Batterie laedt, Netz speist
  # ein) wird dort wie 0 behandelt, nicht hier - deshalb kein weiterer Filter.
  - platform: homeassistant
    id: ha_pv_power
    entity_id: sensor.pv_anlage_solar_power
    internal: true
    on_value:
      - script.execute: update_power_flow
  - platform: homeassistant
    id: ha_batt_power
    entity_id: sensor.pv_anlage_battery_power
    internal: true
    on_value:
      - script.execute: update_power_flow
  - platform: homeassistant
    id: ha_netz_power
    entity_id: sensor.pv_anlage_grid_power
    internal: true
    on_value:
      - script.execute: update_power_flow
  - platform: homeassistant
    id: ha_haus_power
    entity_id: sensor.pv_anlage_home_power
    internal: true
    on_value:
      - script.execute: update_power_flow

text_sensor:
  - platform: version
    name: "ESPHome-Version"
    entity_category: diagnostic

  # Quelle fuer die Konfigurationsseite auf dem Display (show_config_page in
  # packages/ui.yaml). Ueber die wifi_info-Plattform statt per Lambda, weil
  # IPAddress::str() ab 2026.8.0 entfaellt und der Listener die Adresse nach
  # jedem Reconnect von selbst nachzieht.
  #
  # internal: true - HA und die Weboberflaeche zeigen die Adresse ohnehin am
  # Geraeteeintrag, eine zusaetzliche Entity waere nur Rauschen.
  - platform: wifi_info
    ip_address:
      id: device_ip
      internal: true

button:
  - platform: restart
    name: "Neustart"
    entity_category: config
