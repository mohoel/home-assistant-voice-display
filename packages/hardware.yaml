# Hardware des Waveshare ESP32-S3-Touch-AMOLED-1.75.
# Pins verifiziert gegen das Waveshare-BSP
# (components/esp32_s3_touch_amoled_1_75/include/bsp/esp32_s3_touch_amoled_1_75.h)
# und die ESPHome-Device-Seite.

i2c:
  - id: bus_i2c
    sda: GPIO15
    scl: GPIO14
    scan: true
    # ESPHome faehrt I2C sonst mit 50 kHz. Der Touchcontroller wird bei jedem
    # Interrupt komplett ausgelesen; bei 50 kHz blockiert das den Loop lange
    # genug, um Audio-Callbacks zu verzoegern. CST9217, ES7210 und ES8311
    # koennen laut Datenblatt alle 400 kHz.
    frequency: 400kHz

# ---------------------------------------------------------------- Display ---
spi:
  - id: bus_qspi
    type: quad
    clk_pin: GPIO38
    data_pins: [GPIO4, GPIO5, GPIO6, GPIO7]

display:
  - platform: mipi_spi
    id: disp
    # Board-spezifisches Modell statt generischem CO5300 + manuellen
    # dimensions: - das war der eigentliche Ring-Bug (Ring/Icon auf dem
    # ganzen System nach oben-links verschoben, Foto-Befund). Der generische
    # CO5300-Treiber hat ein 480x480-GRAM; unsere 466x466-Sichtflaeche liegt
    # darin nicht bei Spalte 0, sondern bei Spalte 6 (offset_width: 6). Ohne
    # dieses Offset schreibt LVGL seinen 466x466-Canvas ab GRAM-Spalte 0,
    # der sichtbare runde Ausschnitt des Panels beginnt aber erst bei Spalte
    # 6 - alles auf dem Display sitzt dadurch systematisch verschoben, nicht
    # nur der Ring. Das board-spezifische Modell traegt width/height/
    # offset_width/offset_height/cs_pin/reset_pin schon korrekt aus dem
    # ESPHome-mipi_spi-Treiber (components/mipi_spi/models/waveshare.py,
    # CO5300.extend("WAVESHARE-ESP32-S3-TOUCH-AMOLED-1.75", offset_width: 6))
    # - das ist der eigentliche Fix, keine manuelle dimensions:-Angabe mehr
    # noetig. Bestaetigt auch im HA-Community-Thread "ESPHome mipi_spi
    # display configuration for CO5300": offset_width: 6 behebt genau dieses
    # Symptom ("viewable area didn't align with pixel position zero").
    model: WAVESHARE-ESP32-S3-TOUCH-AMOLED-1.75
    spi_id: bus_qspi
    bus_mode: quad
    cs_pin: GPIO12
    reset_pin: GPIO39
    auto_clear_enabled: false
    update_interval: never

# AMOLED hat keine Hintergrundbeleuchtung - die Helligkeit ist ein
# Display-Kommando. Als monochromatic light verpackt, damit sich Standby
# und HA-Entity sauber darueber steuern lassen.
output:
  - platform: template
    id: out_brightness
    type: float
    write_action:
      - lambda: id(disp).set_brightness((uint8_t) (state * 255));

light:
  - platform: monochromatic
    id: display_brightness
    name: "Displayhelligkeit"
    output: out_brightness
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms
    initial_state:
      brightness: 100%

touchscreen:
  - platform: cst9220          # unterstuetzt CST9220 und CST9217
    id: touch
    i2c_id: bus_i2c
    display: disp
    interrupt_pin: GPIO11
    reset_pin: GPIO40
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      - script.execute: on_screen_touch

# ------------------------------------------------------------------ Audio ---
# Ein einziger I2S-Bus fuer Mikrofon und Lautsprecher. Das Board hat laut BSP
# genau einen I2S-Controller mit DOUT und DSIN - wie beim ESP32-S3-Box-3.
i2s_audio:
  - id: bus_i2s
    i2s_bclk_pin: GPIO9
    i2s_lrclk_pin: GPIO45
    i2s_mclk_pin: GPIO42

audio_adc:
  - platform: es7210
    id: adc_es7210
    i2c_id: bus_i2c
    sample_rate: 16000
    bits_per_sample: 16bit

audio_dac:
  - platform: es8311
    id: dac_es8311
    i2c_id: bus_i2c
    sample_rate: 48000
    bits_per_sample: 16bit

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: bus_i2s
    i2s_din_pin: GPIO10
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: bus_i2s
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: dac_es8311
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: mono
    # 100 ms reichen nicht, um WLAN-Jitter beim FLAC-Stream der TTS-Antwort
    # aufzufangen - der Puffer laeuft leer und die Antwort stottert. 500 ms
    # ist der ESPHome-Default und liegt dank PSRAM nicht im internen RAM.
    buffer_duration: 500ms

media_player:
  - platform: speaker
    id: media_out
    name: None
    volume_min: 0.4
    volume_max: 0.85
    announcement_pipeline:
      speaker: spk
      format: FLAC
      sample_rate: 48000
      num_channels: 1

switch:
  # Verstaerker-Enable. GPIO46 ist ein Strapping-Pin des ESP32-S3.
  - platform: gpio
    id: amp_enable
    name: "Lautsprecherverstaerker"
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    disabled_by_default: true
