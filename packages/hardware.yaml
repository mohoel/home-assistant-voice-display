# Hardware des Waveshare ESP32-S3-Touch-AMOLED-1.75.
# Pins verifiziert gegen das Waveshare-BSP
# (components/esp32_s3_touch_amoled_1_75/include/bsp/esp32_s3_touch_amoled_1_75.h)
# und die ESPHome-Device-Seite.

i2c:
  - id: bus_i2c
    sda: GPIO15
    scl: GPIO14
    scan: true
    # ESPHome faehrt I2C sonst mit 50 kHz. Der Touchcontroller wird bei jedem
    # Interrupt komplett ausgelesen; bei 50 kHz blockiert das den Loop lange
    # genug, um Audio-Callbacks zu verzoegern. CST9217, ES7210 und ES8311
    # koennen laut Datenblatt alle 400 kHz.
    frequency: 400kHz

# ---------------------------------------------------------------- Display ---
spi:
  - id: bus_qspi
    type: quad
    clk_pin: GPIO38
    data_pins: [GPIO4, GPIO5, GPIO6, GPIO7]

display:
  - platform: mipi_spi
    id: disp
    # Board-spezifisches Modell statt generischem CO5300 + manuellen
    # dimensions:. Es traegt width/height/offset_width/offset_height/cs_pin/
    # reset_pin korrekt aus dem ESPHome-mipi_spi-Treiber
    # (components/mipi_spi/models/waveshare.py, CO5300.extend(
    # "WAVESHARE-ESP32-S3-TOUCH-AMOLED-1.75", ..., offset_width=6)) - der
    # generische CO5300 hat ein 480x480-GRAM, unsere 466x466-Sichtflaeche
    # beginnt darin erst bei Spalte 6.
    #
    # Achtung, historische Fehldiagnose: dieses offset_width: 6 war NICHT die
    # Ursache des verschobenen Rings. Der Wechsel aufs Board-Modell wurde
    # dafuer geflasht und aenderte am Symptom nichts; die echte Ursache lag
    # im LVGL-Codegen und ist in packages/ui.yaml dokumentiert. Das Modell
    # bleibt trotzdem, weil es sachlich richtig und wartungsaermer ist.
    model: WAVESHARE-ESP32-S3-TOUCH-AMOLED-1.75
    spi_id: bus_qspi
    bus_mode: quad
    cs_pin: GPIO12
    reset_pin: GPIO39
    # Ohne diese Zeile faehrt der QSPI-Bus mit 10 MHz. Der Modelleintrag
    # WAVESHARE-ESP32-S3-TOUCH-AMOLED-1.75 setzt als einziger der CO5300-Familie
    # kein data_rate (mipi_spi/models/waveshare.py), und mipi_spi faellt dann auf
    # seinen Schema-Default von 10 MHz zurueck (display.py: default_data_rate=
    # 10_000_000). 10 MHz x 4 Lanes = 5 MB/s; ein voller Frame 466x466x2 = 434 kB
    # braucht damit ~87 ms -> ~11 fps. Genau das war die ruckelnde Ringanimation:
    # der Spinner bekommt bei spin_time 800 ms nur ~9 Bilder pro Umdrehung.
    # 40 MHz sind das, was das Schwestermodell 2.16" (gleicher CO5300, gleiche
    # Pins) und das Waveshare-BSP fuer dieses Board fahren -> 20 MB/s, ~22 ms
    # pro Frame, ~45 fps. Darueber wird es unzuverlaessig: CLK GPIO38 und die
    # Datenpins liegen nicht auf den IOMUX-Pins von SPI2, laufen also ueber die
    # GPIO-Matrix; 80 MHz sind nur mit IOMUX-Routing sauber.
    # Bremse ist danach LVGL selbst (LV_DEF_REFR_PERIOD = 16 ms, fest im
    # ESPHome-lvgl-Codegen) bzw. der 60-Hz-Takt des Panels - beides deutlich
    # ueber dem, was die Animation braucht. spin_time bleibt unveraendert.
    data_rate: 40MHz
    auto_clear_enabled: false
    update_interval: never

# AMOLED hat keine Hintergrundbeleuchtung - die Helligkeit ist ein
# Display-Kommando, geschrieben ueber diesen einen float-Output.
#
# Zwei Lichter teilen sich ihn, mit getrennten Aufgaben:
# - display_level: die eigentliche Dimmung. internal: true - dieses Licht
#   taucht in Home Assistant nicht auf. Es gab hier einmal eine einzelne
#   dimmbare Entity fuer beides, und ihr Helligkeitsregler war fuer einen
#   Nutzer wertlos: jeder Phasenwechsel in packages/ui.yaml ueberschreibt den
#   Wert binnen Millisekunden wieder, der Regler "springt" nur. Die echten,
#   von Hand sinnvoll einstellbaren Helligkeiten sind seither die beiden
#   HA-Number-Entities in packages/settings.yaml: num_standby_brightness fuer
#   den echten Standby (Uhr, Zifferblatt, wartendes Gesicht) und
#   num_display_brightness ("Displayhelligkeit") fuer alles Sichtbare
#   darueber hinaus - Zuhoeren, Verarbeitung, Antwort, Fehler, Hinweis,
#   klingelnder Timer.
# - display_brightness ("Display"): reine Ein/Aus-Sicht fuer Home Assistant,
#   siehe unten.
output:
  - platform: template
    id: out_brightness
    type: float
    write_action:
      - lambda: id(disp).set_brightness((uint8_t) (state * 255));

  # Fasst den eigentlichen Output nicht an - existiert nur, weil das
  # binary-Lichtprofil einen BinaryOutput verlangt. Reicht Ein/Aus lediglich
  # an display_level weiter, damit ein manuelles Umschalten der Entity
  # "Display" in Home Assistant den Bildschirm auch wirklich hell/dunkel
  # schaltet (siehe on_turn_on unten).
  - platform: template
    id: out_display_power
    type: binary
    write_action:
      - if:
          condition:
            lambda: return state;
          then:
            - light.turn_on: display_level
          else:
            - light.turn_off: display_level

light:
  # Physische Dimmung, nicht in Home Assistant sichtbar (internal: true,
  # siehe Begruendung oben). Alle Aufrufer stehen in packages/ui.yaml.
  - platform: monochromatic
    id: display_level
    internal: true
    output: out_brightness
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms
    initial_state:
      brightness: 100%

  # Ein/Aus-Ansicht fuer Home Assistant. Zeigt bewusst keine Helligkeit mehr,
  # siehe die Begruendung im output-Block oben.
  - platform: binary
    id: display_brightness
    name: "Display"
    output: out_display_power
    restore_mode: ALWAYS_ON
    # Der Standby (sleep_display in packages/ui.yaml) schaltet das Licht ganz
    # aus und legt die leere page_off vor. Wer es danach aus Home Assistant
    # heraus wieder einschaltet, saehe sonst einen hellen, leeren Bildschirm -
    # und nichts wuerde ihn je wieder ausschalten, weil der Rueckweg sonst nur
    # ueber on_idle fuehrt und das eine Beruehrung braucht. Deshalb hier
    # zusaetzlich standby_return, das nach num_standby_timeout
    # (packages/settings.yaml) von selbst wieder ausschaltet.
    #
    # Die geraeteeigenen Weckwege laufen hier bewusst ins Leere: wake_display
    # und on_screen_touch schalten die Seite *vor* dem Einschalten um, page_off
    # liegt dann nicht mehr vorne. Der Trigger feuert ohnehin nur beim Wechsel
    # von aus nach an (LightTurnOnTrigger: `is_on && !last_on_`).
    #
    # boot_done haelt den Aufruf zurueck, bis LVGL steht - der Trigger kann
    # schon beim Wiederherstellen des Lichtzustands im Setup feuern.
    #
    # display_level bekommt hier zusaetzlich explizit eine Helligkeit: die
    # write_action von out_display_power schaltet es zwar mit ein, aber ohne
    # Helligkeitsangabe nur auf seinen letzten Wert - und der kann nach einem
    # laengeren Aus-Zustand veraltet sein.
    on_turn_on:
      - if:
          condition:
            lambda: return id(boot_done);
          then:
            - if:
                condition:
                  lvgl.page.is_showing: page_off
                then:
                  - script.execute: show_standby_page
                  - script.execute: standby_return
                  - light.turn_on:
                      id: display_level
                      brightness: !lambda "return id(num_standby_brightness).state / 100.0f;"

touchscreen:
  - platform: cst9220          # unterstuetzt CST9220 und CST9217
    id: touch
    i2c_id: bus_i2c
    display: disp
    interrupt_pin: GPIO11
    reset_pin: GPIO40
    transform:
      mirror_x: true
      mirror_y: true
    # on_touch feuert genau einmal je Beruehrung (touchscreen.cpp: first_touch_).
    # on_screen_touch reagiert sofort (wecken/abbrechen); detect_tap zaehlt
    # daneben mit, ob ein zweiter Touch folgt, und meldet Tipp/Doppeltipp an
    # Home Assistant. Beide Skripte stehen in packages/ui.yaml.
    on_touch:
      - script.execute: on_screen_touch
      - script.execute: detect_tap

# Meldet einfachen und doppelten Tipp auf den Bildschirm an Home Assistant -
# wie bei einem smarten Schalter mit Klick-Events. Ausgeloest von detect_tap
# (packages/ui.yaml), das beide Gesten an der Zeit zwischen zwei Beruehrungen
# unterscheidet. Ersetzt die frühere Gedrückthalten-Geste zur Konfigurations-
# seite; die Geräteadresse zeigt Home Assistant am Geräteeintrag ohnehin an.
event:
  - platform: template
    id: evt_display_touch
    name: "Display Touch"
    device_class: button
    event_types:
      - "single_press"
      - "double_press"

# ------------------------------------------------------------------ Audio ---
# Ein einziger I2S-Bus fuer Mikrofon und Lautsprecher. Das Board hat laut BSP
# genau einen I2S-Controller mit DOUT und DSIN - wie beim ESP32-S3-Box-3.
i2s_audio:
  - id: bus_i2s
    i2s_bclk_pin: GPIO9
    i2s_lrclk_pin: GPIO45
    i2s_mclk_pin: GPIO42

audio_adc:
  - platform: es7210
    id: adc_es7210
    i2c_id: bus_i2c
    sample_rate: 16000
    bits_per_sample: 16bit

audio_dac:
  - platform: es8311
    id: dac_es8311
    i2c_id: bus_i2c
    sample_rate: 48000
    bits_per_sample: 16bit

# channel: stereo statt frueher left - das Board hat laut Waveshare ein
# "Onboard Dual Microphone Array", der ES7210 liefert also zwei Mikrofone im
# selben I2S-Frame. Mit "left" ging das zweite ungenutzt verloren. Genau wie
# im offiziellen home-assistant-voice-pe (dort i2s_mics mit channel: stereo)
# liest dieser eine Mic-Component beide Kanaele; wer welchen Kanal daraus
# will, entscheidet sich erst bei den Konsumenten (packages/voice.yaml):
# micro_wake_word bleibt bei Kanal 0, voice_assistant bekommt beide.
microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: bus_i2s
    i2s_din_pin: GPIO10
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: stereo

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: bus_i2s
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: dac_es8311
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: mono
    # 100 ms reichen nicht, um WLAN-Jitter beim FLAC-Stream der TTS-Antwort
    # aufzufangen - der Puffer laeuft leer und die Antwort stottert. 500 ms
    # ist der ESPHome-Default und liegt dank PSRAM nicht im internen RAM.
    buffer_duration: 500ms

media_player:
  - platform: speaker
    id: media_out
    name: None
    volume_min: 0.4
    volume_max: 0.85
    announcement_pipeline:
      speaker: spk
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    # Eingebettete Toene fuer Timer und Bestaetigung. Sie liegen als Datei im
    # Repo (sounds/, Herkunft und Lizenz stehen dort im README) statt als URL,
    # damit der Build ohne Internetzugang funktioniert.
    #
    # Beide sind 48 kHz mono 16 Bit - identisch zur announcement_pipeline
    # darueber, es wird also nichts resampelt. Gespielt werden sie ueber
    # media_player.speaker.play_on_device_media_file mit announcement: true,
    # damit sie denselben Weg nehmen wie die TTS-Antwort und sich nicht mit ihr
    # um den I2S-Bus streiten. Die Skripte dazu stehen in packages/voice.yaml.
    #
    # Die Pfade sind relativ zum Verzeichnis von lumi.yaml, nicht zu
    # dieser Datei: cv.file_ loest ueber CORE.relative_config_path auf, und das
    # ist immer das Konfigurationsverzeichnis - Packages verschieben den Bezug
    # nicht.
    files:
      - id: snd_timer
        file: sounds/timer_finished.flac
      - id: snd_confirm
        file: sounds/center_button_press.flac
    # Eine Ansage, die *nicht* zu einem laufenden Sprachvorgang gehoert, kommt
    # aus Home Assistant (tts.speak, assist_satellite.announce/ask_question).
    # Dann laeuft gerade die Wake-Word-Erkennung und haelt den einzigen
    # I2S-Bus - der Lautsprecher bekaeme ihn nicht. announcement_guard
    # (packages/voice.yaml) raeumt ihn und stellt danach wieder scharf.
    #
    # Ohne Phasenpruefung, und das ist der Kern der Sache: hier stand einmal
    # eine auf phase_idle/phase_muted, und genau daran ist der erste Versuch
    # gescheitert. on_announce feuert *zuerst* den TTS-Start-Trigger
    # (voice_assistant.cpp:1056) - die Phase steht also schon auf
    # phase_replying, wenn der Media Player zu spielen beginnt, und der Guard
    # lief nie. Sichtbar war das als "fuenf Balken, aber kein Ton".
    #
    # Ungefaehrlich ist das, weil das Skript nur micro_wake_word anfasst und
    # die Pipeline in Ruhe laesst. Die eigenen Toene (Bestaetigung, Klingeln)
    # laufen mit hinein, stoeren sich aber nicht daran: beide haben das Wake
    # Word ohnehin selbst gestoppt, und der Wiederanlauf am Ende prueft, ob
    # inzwischen jemand anders das Mikrofon hat.
    on_announcement:
      - script.execute: announcement_guard

switch:
  # Verstaerker-Enable. GPIO46 ist ein Strapping-Pin des ESP32-S3. Kein
  # HA-Bedienelement (internal: true) - der Verstaerker muss dauerhaft an
  # sein, sonst kommt kein Ton mehr aus dem Lautsprecher. Es gibt im ganzen
  # Projekt keine Stelle, die ihn je ausschaltet; ohne Konfiguration bliebe
  # GPIO46 als Strapping-Pin aber in undefiniertem Zustand, deshalb bleibt
  # die Komponente selbst bestehen.
  - platform: gpio
    id: amp_enable
    internal: true
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: RESTORE_DEFAULT_ON

# Batteriemodus: kein USB-C-Strom, obwohl ein Akku angeschlossen ist. Gesetzt
# im AXP2101-Takt weiter unten (VBUS Good, Register 0x00 Bit 5) - ein
# zweiter I2C-Poll auf demselben Bus wie Touch und Audio waere unnoetig dafuer.
# Ohne angeschlossenen Akku bleibt der Wert immer false, das Geraet laeuft
# dann ohnehin nur am Netz.
globals:
  - id: on_battery
    type: bool
    restore_value: false
    initial_value: "false"

# -------------------------------------------------------------- Akkustand ---
# Das Board hat einen AXP2101 (Power-Path, Laden, Akku-Telemetrie) auf
# demselben I2C-Bus wie Touch und die Audio-Codecs, Adresse 0x34 - verifiziert
# gegen das offizielle Waveshare-Repo
# (waveshareteam/ESP32-S3-Touch-AMOLED-1.75, HARDWARE_REFERENCE.md und
# examples/esp-idf/01_AXP2101), nicht nur gegen die Produktseite.
#
# Es gibt dafuer **keinen** core-ESPHome-Baustein und auch keinen brauchbaren
# externen: die einzigen bekannten Community-Komponenten
# (stefanthoss/esphome-axp2101 und ihre Forks) kennen nur ein einziges,
# hartcodiertes model: M5CORE2 - andere Register/Boards sind nicht vorgesehen,
# und dieselbe Zurueckhaltung gegenueber unmaintained External Components wie
# bei shelson/esphome-cst9217 (siehe CLAUDE.md, "Verifizierte
# Hardware-Fakten") gilt hier genauso. Gelesen wird deshalb roh ueber
# esphome::i2c::I2CDevice, denselben Weg, den ESPHomes eigene Komponenten
# intern nutzen - keine externe Abhaengigkeit, keine Registerannahme ohne
# Beleg.
#
# Registeradressen und ihre Bedeutung sind gegen lewisxhe/XPowersLib
# (XPowersAXP2101.hpp, REG/AXP2101Constants.h) verifiziert - genau die
# Referenzbibliothek, die Waveshares eigenes AXP2101-Beispiel fuer dieses
# Board einbindet:
# - Register 0x00 (STATUS1), Bit 3: Akku angeschlossen (isBatteryConnect()).
# - Register 0xA4 (BAT_PERCENT_DATA): eingebauter Fuel-Gauge-Prozentwert
#   0-100, direkt vom PMU berechnet - keine eigene Kennlinie noetig, und ohne
#   weitere Freischaltung gueltig (Waveshares eigenes Beispiel liest es direkt
#   nach PMU.begin()).
# Diese zwei Register werden hier rein lesend genutzt - keine ADC-Kanaele
# werden umkonfiguriert. Das Laden selbst regelt der AXP2101 autonom in
# Hardware; der Ladestopp-Takt weiter unten greift nur mit einem einzigen,
# gezielten Bit ein (Register 0x18, Bit 1), siehe dort. Spannung zeigt die
# Entity bewusst nicht - angefragt war nur der Akkustand.
#
# disabled_by_default, weil das Geraet im Normalbetrieb am Netzteil haengt und
# ohne Akku isBatteryConnect() ohnehin dauerhaft false liefert (NAN). Wer
# einen Akku nutzt, aktiviert die Entity in Home Assistant von Hand - derselbe
# Schalter wie bei den uebrigen Diagnose-Entities in packages/core.yaml.
sensor:
  - platform: template
    name: "Akkustand"
    device_class: battery
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 60s
    lambda: |-
      esphome::i2c::I2CDevice pmu;
      pmu.set_i2c_bus(id(bus_i2c));
      pmu.set_i2c_address(0x34);
      uint8_t status1;
      if (!pmu.read_byte(0x00, &status1) || !(status1 & 0x08)) {
        return NAN;  // kein Akku angeschlossen
      }
      uint8_t percent;
      if (!pmu.read_byte(0xA4, &percent)) {
        return NAN;
      }
      return (float) percent;

# ---------------------------------------------------------- Ladestopp ---
# Ohne Eingriff haelt der AXP2101 den Akku im Dauerbetrieb am Netzteil in
# einer endlosen Erhaltungsladung nahe 4.2V (er laedt bei jedem leichten
# Abfall sofort wieder nach) - schlecht fuer die Lebensdauer eines
# Li-Ion-Akkus. Dieser Takt schaltet das Laden deshalb ab, sobald USB-C-Strom
# anliegt UND der Akku 100% zeigt, und wieder an, sobald eine der beiden
# Bedingungen nicht mehr gilt (Akku faellt unter 100%, oder USB-C wird
# gezogen). Derselbe Durchlauf veroeffentlicht auch gleich den tatsaechlichen
# Ladezustand an den binary_sensor "Lädt" unten - ein zweiter, eigener Takt
# dafuer waere ein zweiter I2C-Poll fuer dieselbe Information.
#
# Gegen lewisxhe/XPowersLib verifiziert, dieselbe Referenz wie beim
# Akkustand oben:
# - Register 0x18 (CHARGE_GAUGE_WDT_CTRL), Bit 1: Ladefreigabe fuer den
#   Hauptakku (enableCellbatteryCharge()/disableCellbatteryCharge()). Bit 0
#   ist der Watchdog, Bit 2 die Knopfzellenladung - beide bleiben unberuehrt,
#   deshalb Lesen-Aendern-Schreiben statt eines vollen Byte-Writes.
# - Register 0x00 (STATUS1), Bit 5: VBUS Good (isVbusGood()) - derselbe
#   Registerblock, aus dem Bit 3 oben schon "Akku angeschlossen" liest.
# - Register 0x01 (STATUS2), Bits 5-7: PMU-Gesamtzustand, 1 = Laden
#   (isCharging()) - eine ehrliche Momentaufnahme der Hardware, keine
#   Ableitung aus dem selbst gesetzten Bit 1 von Register 0x18: nach dem
#   Ladestopp bei 100% steht hier korrekt "false", genauso waehrend einer
#   Temperaturschutz-Pause, die der AXP2101 autonom einlegt.
#
# Bewusst NICHT ueber BATFET (Register 0x12, Bit 3, disableBATFET()): das
# trennt den Akku komplett vom System-Rail statt nur den Ladestrom. Faellt
# USB-C dann kurz aus - Wackelkontakt, Steckdosenleiste - haette das Geraet
# ohne Backup sofort keine Spannung mehr, mitten in einem OTA-Schreibvorgang
# waere das ein beschaedigtes Flash. Reines Laden-Stoppen laesst den Akku als
# Backup verbunden, nur der Ladestrom bleibt aus.
#
# Ohne angeschlossenen Akku (Bit 3 von STATUS1) ist nichts zu tun - der Takt
# liest dann nur das eine Byte und kehrt zurueck, weder Schreibzugriff noch
# Statuspublikation ohne Akku. Geschrieben wird an Register 0x18 zusaetzlich
# nur bei einem tatsaechlichen Zustandswechsel, nicht bei jedem Durchlauf -
# und genau dieser Wechsel bekommt eine eigene ESP_LOGI-Zeile ("ladestopp"),
# analog zur Wachhund-WARN-Zeile weiter unten: ohne sie liesse sich von
# aussen nicht unterscheiden, ob der Takt ueberhaupt eingreift oder ob der
# Akku einfach nie gleichzeitig 100% und USB-C erreicht.
#
# Derselbe Durchlauf setzt zusaetzlich das Global on_battery (oben) und den
# binary_sensor "Netzbetrieb" (unten) aus demselben VBUS-Good-Bit, das hier
# schon fuer den Ladestopp gelesen wird - wieder kein zweiter I2C-Poll fuer
# dieselbe Information. Reaktionszeit ist dieser Takt selbst, also bis zu
# 60 s nach dem Ziehen oder Stecken von USB-C; fuer eine Statusanzeige
# unkritisch. Bislang wirkt sich on_battery auf nichts weiter aus - die
# Wake-Word-Erkennung laeuft im Batteriemodus unveraendert weiter (siehe
# CLAUDE.md fuer den geplanten naechsten Schritt, Tap-to-Talk statt
# Dauerlauschen).
interval:
  - interval: 60s
    then:
      - lambda: |-
          esphome::i2c::I2CDevice pmu;
          pmu.set_i2c_bus(id(bus_i2c));
          pmu.set_i2c_address(0x34);
          uint8_t status1;
          if (!pmu.read_byte(0x00, &status1) || !(status1 & 0x08)) {
            id(on_battery) = false;  // kein Akku -> immer Netzbetrieb
            return;
          }
          bool vbus_good = status1 & 0x20;
          id(on_battery) = !vbus_good;
          id(bin_mains_power).publish_state(vbus_good);
          uint8_t percent;
          if (!pmu.read_byte(0xA4, &percent)) {
            return;
          }
          uint8_t reg18;
          if (!pmu.read_byte(0x18, &reg18)) {
            return;
          }
          bool charge_enabled = reg18 & 0x02;
          bool should_charge = !(vbus_good && percent >= 100);
          if (should_charge != charge_enabled) {
            uint8_t new_reg18 = should_charge ? (uint8_t) (reg18 | 0x02)
                                               : (uint8_t) (reg18 & ~0x02);
            pmu.write_byte(0x18, new_reg18);
            ESP_LOGI("ladestopp", "Laden %s (USB-C=%s, Akku=%u%%)",
                     should_charge ? "wieder freigegeben" : "gestoppt bei 100%",
                     vbus_good ? "an" : "aus", percent);
          }
          uint8_t status2;
          if (pmu.read_byte(0x01, &status2)) {
            id(bin_charging).publish_state((status2 >> 5) == 0x01);
          }

# Beide Sensoren unten haben kein eigenes lambda - sie warten nur auf
# publish_state() aus dem Takt oben. Ein binary_sensor.template *mit* eigenem
# lambda kennt kein update_interval (anders als sensor.template) und wuerde
# stattdessen bei jedem einzelnen loop()-Durchlauf neu ausgewertet
# (template_binary_sensor.cpp: setup() ruft ohne lambda disable_loop() auf,
# mit lambda dagegen jeden Tick loop()) - viel zu oft fuer einen I2C-Zugriff
# auf einem Bus, der auch Touch und Audio bedient.
binary_sensor:
  - platform: template
    id: bin_charging
    name: "Lädt"
    device_class: battery_charging
    entity_category: diagnostic
    disabled_by_default: true

  # device_class power: HA zeigt "on" als "Power detected", "off" als
  # "No power" - trifft VBUS Good direkt, ohne Umdeutung. Batteriemodus ist
  # damit bewusst der "off"-Zustand dieser Entity und keine eigene mit
  # umgekehrtem Namen: das Global on_battery (oben) traegt die invertierte
  # Bedeutung intern, die HA-Entity bleibt bei der natuerlichen Lesart eines
  # Netzteil-Sensors. disabled_by_default aus demselben Grund wie bei
  # Akkustand/Lädt - ohne Akku liefe on_battery ohnehin immer false, dann ist
  # die Entity bedeutungslos.
  - id: bin_mains_power
    name: "Netzbetrieb"
    platform: template
    device_class: power
    entity_category: diagnostic
    disabled_by_default: true
