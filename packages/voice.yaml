# Voice Assistant, Wake Word und die zugehoerigen HA-Entities.
# Logik uebernommen vom offiziellen esphome/wake-word-voice-assistants
# (esp32-s3-box-3) und home-assistant-voice-pe.

globals:
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: ${phase_not_ready}

  # ------------------------------------------------------------------ Timer
  # Home Assistant schickt Timer-Ereignisse von sich aus an den Satelliten,
  # sobald die voice_assistant-Komponente mindestens einen on_timer_*-Trigger
  # hat (set_has_timers im Codegen). Es braucht dafuer keine Automation in HA.
  #
  # Quelle der Wahrheit ist on_timer_tick: der Takt liefert jede Sekunde *alle*
  # laufenden Timer, daraus wird der naechstfaellige gesucht. started/updated
  # schreiben zusaetzlich sofort, damit der Ring nicht bis zu einer Sekunde auf
  # sich warten laesst.
  - id: timer_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: timer_total
    type: int
    restore_value: false
    initial_value: "0"
  - id: timer_left
    type: int
    restore_value: false
    initial_value: "0"
  - id: timer_name
    type: std::string
    restore_value: false
  - id: timer_ringing
    type: bool
    restore_value: false
    initial_value: "false"

  # ------------------------------------------------- Ergebnis eines Befehls
  # 1 = Messwert (result_value/result_unit), 2 = Bestaetigung (Haken),
  # 3 = Wetter (weather_icon_glyph + result_value/result_unit).
  # Gesetzt in on_tts_start aus dem Antworttext (1/2) bzw. in stage_weather
  # aus der API-Aktion zeige_wetter (3), ausgewertet in update_ui.
  - id: result_kind
    type: int
    restore_value: false
    initial_value: "0"
  - id: result_value
    type: std::string
    restore_value: false
  - id: result_unit
    type: std::string
    restore_value: false
  # Icon-Codepoint fuer die Wetteranzeige (result_kind == 3), gesetzt in
  # stage_weather, gelesen in update_ui. Kein Gegenstueck bei Messwert/
  # Bestaetigung noetig - deren Icon steht fest im Lambda von update_ui.
  - id: weather_icon_glyph
    type: std::string
    restore_value: false
  # Merker zwischen stage_weather und on_tts_start: verhindert, dass die
  # Text-Heuristik dort ein gerade erst gesetztes result_kind == 3 wieder
  # ueberschreibt. Sicherheitsnetz in on_listening, falls doch kein
  # on_tts_start folgt.
  - id: weather_shown
    type: bool
    restore_value: false
    initial_value: "false"
  # Merker, ob in diesem Durchgang ueberhaupt eine Sprachausgabe kam. Bleibt er
  # false, hat Home Assistant den Befehl stumm ausgefuehrt - dann uebernimmt der
  # lokale Bestaetigungston die Rueckmeldung (siehe on_end).
  - id: had_tts
    type: bool
    restore_value: false
    initial_value: "false"
  # Der Bestaetigungston ist faellig. Gespielt wird er nicht sofort, sondern in
  # end_session - siehe dort, es geht um den I2S-Bus.
  - id: confirm_pending
    type: bool
    restore_value: false
    initial_value: "false"

  # --------------------------------------------------------- Fehlerklassen
  # 0 = allgemeiner Fehler, 1 = nicht verstanden, 2 = Home Assistant nicht
  # erreichbar. Gesetzt in on_error, ausgewertet in update_ui.
  - id: error_kind
    type: int
    restore_value: false
    initial_value: "0"

  # -------------------------------------------------------- Rueckfrage-Merker
  # continue_conversation_ ist in der voice_assistant-Komponente privat und hat
  # keinen Getter - eine Rueckfrage laesst sich also nicht direkt abfragen.
  # Ersatz: wurde vor diesem Zuhoeren ein Wake Word erkannt? Wenn nicht, hat
  # Home Assistant die Sitzung offen gelassen und wartet auf eine Antwort.
  - id: wake_word_seen
    type: bool
    restore_value: false
    initial_value: "false"
  - id: is_followup
    type: bool
    restore_value: false
    initial_value: "false"

  # Kam das gerade endende "Ende" ueberhaupt aus einem Sprachvorgang? Bei einer
  # Ansage aus Home Assistant naemlich nicht: on_announce feuert end_trigger
  # sofort beim *Start* der Ansage (voice_assistant.cpp:1080), nicht an ihrem
  # Ende. Gesetzt in on_listening, zurueckgesetzt in end_session.
  - id: pipeline_session
    type: bool
    restore_value: false
    initial_value: "false"

micro_wake_word:
  id: mww
  microphone:
    microphone: mic
    # channels default ist "0" - explizit hier, weil mic seit dem Dual-Mic-
    # Umbau (packages/hardware.yaml) stereo liefert und die Wake-Word-Inferenz
    # bewusst nur auf einem Kanal laeuft.
    channels: 0
    gain_factor: 4
  # Nach einer Erkennung die Inferenz anhalten. Mit false lief das Wake-Word-
  # Modell waehrend des gesamten Sprachvorgangs weiter, hat auf demselben
  # Mikrofonstream permanent Erkennungen gemeldet (daher die
  # duplicate_wake_up_detected-Filterung in on_error) und dabei dauerhaft
  # CPU verbraucht. start_wake_word startet es in end_session wieder.
  stop_after_detection: true
  task_stack_in_psram: true
  vad:
  models:
    - model: okay_nabu
      id: mww_okay_nabu
    - model: hey_jarvis
      id: mww_hey_jarvis
    - model: hey_mycroft
      id: mww_hey_mycroft
  on_wake_word_detected:
    - if:
        condition:
          switch.is_off: mute
        then:
          # Merker fuer die Rueckfrage-Erkennung: das naechste on_listening hat
          # damit ein Wake Word vor sich und ist keine Antwort auf eine
          # Rueckfrage von Home Assistant.
          - lambda: id(wake_word_seen) = true;
          - voice_assistant.start:
              wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  # Beide Kanaele des Dual-Mic-Arrays statt nur einem (siehe channel: stereo
  # in packages/hardware.yaml) - genau das Muster aus dem offiziellen
  # home-assistant-voice-pe. Home Assistant bekommt damit zwei Audiostreams
  # statt einem; ob das beim Fernsehton-Problem tatsaechlich hilft (das Board
  # bewirbt die Dual-Mic-Faehigkeit primaer fuer Echo-Cancellation gegen den
  # eigenen Lautsprecher, nicht zwingend fuer Fremdgeraeusch-Beamforming), ist
  # am Geraet zu pruefen.
  microphone:
    - microphone: mic
      channels: 0
    - microphone: mic
      channels: 1
  media_player: media_out
  micro_wake_word: mww
  use_wake_word: false
  # Laeuft nicht auf dem Geraet: der Wert geht nur als Zahl im API-Request an
  # Home Assistant (VoiceAssistantAudioSettings, voice_assistant.cpp:341) - die
  # eigentliche Unterdrueckung passiert serverseitig ueber HAs
  # webrtc-audio-processing-Bibliothek. War kurzzeitig auf 3 (high), nachdem
  # Fernsehton teilweise mit in Befehle transkribiert wurde - seit dem
  # Dual-Mic-Umbau oben (channels: 0/1) auf 0.
  #
  # Bewusst NICHT am offiziellen home-assistant-voice-pe orientiert (das faehrt
  # ebenfalls 0/0dBFS/1) - dessen aic3204-Codec ist ein anderer Chip als unser
  # es7210/es8311, vermutlich mit eigener Onboard-Verarbeitung. Der
  # esp32-s3-box-3 hat denselben Chipsatz wie wir und braucht 2/31dBFS/2.0 -
  # der naeherliegende Vergleich, und der Rueckfallwert, falls die Erkennung
  # wieder unsauber wird, nicht Voice PEs 0. Der ESPHome-es7210-Treiber macht
  # ohnehin kein eigenes Onboard-DSP (nur Gain/Bits/Rate ueber I2C) - was der
  # zweite Kanal auf HA-Seite tatsaechlich bewirkt, ist von hier aus nicht
  # einsehbar.
  #
  # Die 0 ist deshalb kein Nachbau eines fremden Vorbilds, sondern ein am
  # eigenen Geraet bestaetigtes Ergebnis (16.08.2026): TV-Stoerung blieb sauber
  # weg, und ein Vergleich gegen das unveraenderte zweite Geraet (kein
  # Dual-Mic, `level: 2`) zeigte dieselbe Verarbeitungsdauer - die
  # Software-Stufe kostet hier also keine zusaetzliche Zeit, die man sich mit
  # 0 erkaufen wuerde. Auf dem unveraenderten Geraet trat im selben Test wieder
  # die TV-Fehltranskription auf, das urspruengliche Problem ist also real und
  # kein Zufallstreffer.
  noise_suppression_level: 0
  auto_gain: 31dBFS
  volume_multiplier: 2.0

  # Feuert auch, wenn das Wake Word in Home Assistant erkannt wurde
  # (VOICE_ASSISTANT_WAKE_WORD_END, voice_assistant.cpp:779) - der Merker gilt
  # damit fuer beide Engines.
  on_wake_word_detected:
    - lambda: id(wake_word_seen) = true;

  on_listening:
    # Aufraeum-Timer eines vorherigen Durchgangs abbrechen. Sonst setzt deren
    # verzoegertes set_idle_or_muted mitten in den neuen Vorgang hinein.
    - script.stop: end_session
    - script.stop: clear_error
    # Ein klingelnder Timer soll verstummen, sobald gesprochen wird - sonst
    # redet der Nutzer gegen die Glocke an. Das Skript laeuft ohne delay durch,
    # setzt also synchron auf Idle; die Phase unten ueberschreibt das gleich
    # wieder.
    - if:
        condition:
          lambda: return id(timer_ringing);
        then:
          - script.execute: timer_stop_ringing
    # Kam kein Wake Word, ist das hier die Antwort auf eine Rueckfrage von Home
    # Assistant. Der Merker wird dabei verbraucht.
    - lambda: |-
        id(is_followup) = !id(wake_word_seen);
        id(wake_word_seen) = false;
        // Ab hier laeuft ein echter Sprachvorgang - end_session darf danach
        // ohne Bedenkzeit aufraeumen.
        id(pipeline_session) = true;
        id(had_tts) = false;
        id(result_kind) = 0;
        // Ein vorgemerkter Ton aus einem abgebrochenen Durchgang gehoert nicht
        // in den neuen hinein.
        id(confirm_pending) = false;
        // Sicherheitsnetz: falls zeige_wetter ausgeloest wurde, aber aus
        // irgendeinem Grund kein on_tts_start folgte (z. B. das HA-Skript
        // bricht vorher ab), darf der naechste echte Sprachvorgang die
        // Bestaetigungs-/Messwert-Heuristik dort nicht faelschlich
        // ueberspringen.
        id(weather_shown) = false;
    - lambda: id(voice_assistant_phase) = ${phase_listening};
    - text_sensor.template.publish:
        id: text_request
        state: ""
    - text_sensor.template.publish:
        id: text_response
        state: ""
    - script.execute: update_ui

  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${phase_thinking};
    - script.execute: update_ui

  # x = erkannter Text des Nutzers
  on_stt_end:
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
    - script.execute: update_ui

  # x = Antworttext des Assistenten
  #
  # Der Antworttext ist die einzige inhaltliche Rueckmeldung, die das Geraet
  # bekommt: on_intent_end hat im Codegen eine leere Parameterliste
  # (voice_assistant/__init__.py:311), es gibt also weder Domain noch Entitaet
  # noch Ergebniswert. Was hier passiert, ist deshalb bewusst eine Heuristik
  # ueber den Satz - mehr ist ohne eine Automation in Home Assistant nicht
  # moeglich. Erkennt sie nichts, bleibt alles wie bisher bei den fuenf Balken.
  on_tts_start:
    - lambda: |-
        id(had_tts) = true;

        // zeige_wetter (core.yaml) -> stage_weather (weiter unten in dieser
        // Datei) hat result_kind/result_value/result_unit/weather_icon_glyph
        // bereits gesetzt, bevor die Sprachausgabe beginnt. Die Heuristik
        // unten wuerde das mit ihrem eigenen result_kind = 0 als erste Zeile
        // sofort wieder ueberschreiben - deshalb hier abfangen. Der Tail
        // (Phasensetzung + Log, ganz unten) bleibt unveraendert und
        // funktioniert bereits generisch fuer result_kind == 3, weil er nur
        // auf != 0 prueft.
        if (id(weather_shown)) {
          id(weather_shown) = false;
        } else {
        id(result_kind) = 0;
        id(result_value).clear();
        id(result_unit).clear();

        // Alles ohne cctype/cstring, damit die Bytes von Umlauten unangetastet
        // bleiben: tolower auf einem UTF-8-Folgebyte waere je nach Locale
        // undefiniert. Grossbuchstaben sind hier ohnehin nur ASCII.
        auto ist_ziffer = [](char c) { return c >= '0' && c <= '9'; };

        const std::string &t = x;
        // Laengere Antworten sind Fliesstext und kein Ergebnis. 80 Zeichen
        // lassen Raum fuer lange Entitaetsnamen ("Der Ladestand der Batterie
        // deines Autos betraegt 72 Prozent."), schliessen aber die
        // ausformulierten Antworten eines Sprachmodells weiter aus.
        if (!t.empty() && t.size() <= 80) {
          // --- Bestaetigung: kurzer, formelhafter Satz ---
          //
          // Steht *vor* der Messwerterkennung, und das ist der ganze Punkt:
          // "Rollo auf 50 Prozent gestellt" enthaelt eine Zahl mit Einheit,
          // ist aber die Rueckmeldung zu einem Befehl und kein Messwert.
          // Umgekehrt gelesen: eine Bestaetigung schlaegt eine Zahl im selben
          // Satz. Was geschaltet wurde, sagt der Haken so wenig wie bei jeder
          // anderen Entitaet - mehr weiss das Geraet ohnehin nicht.
          //
          // Gesucht wird das Wort ueberall im Satz, nicht nur am Anfang. Der
          // Satzanfang allein traf nur die knappste Form ("Eingeschaltet.");
          // Home Assistant antwortet je nach Intent und Sprachpaket auch mit
          // "Das Licht wurde eingeschaltet", und dann liefen die fuenf Balken,
          // obwohl gar nichts gesprochen wurde.
          //
          // Die Laengengrenze von 45 Zeichen ist der Preis dafuer: sie haelt
          // Saetze draussen, die das Wort nur beilaeufig enthalten ("Im
          // Wohnzimmer sind drei von fuenf Lampen eingeschaltet"). Der Preis
          // der Reihenfolge ist ein anderer: "Die Heizung ist auf 21 Grad
          // eingestellt" zeigt jetzt den Haken statt der Zahl. Das ist die
          // bewusste Entscheidung - Befehle sind der haeufigere Fall.
          {
            std::string k = t;
            while (!k.empty() &&
                   (k.back() == '.' || k.back() == '!' || k.back() == ' '))
              k.pop_back();
            for (char &c : k)
              if (c >= 'A' && c <= 'Z') c += 32;
            // "gestellt" deckt "eingestellt" mit ab (Teilzeichenkette) und
            // faengt zugleich das Rollo: "auf 50 Prozent gestellt".
            static const char *const BESTAETIGUNG[] = {
                "eingeschaltet", "ausgeschaltet", "angeschaltet", "abgeschaltet",
                "gestellt", "gesetzt", "erledigt", "fertig", "ok", "okay",
                "gestartet", "gestoppt", "angehalten", "fortgesetzt",
                "geöffnet", "geschlossen", "aktiviert", "deaktiviert", "gedimmt"};
            if (k.size() <= 45) {
              for (const char *b : BESTAETIGUNG) {
                if (k.find(b) != std::string::npos) {
                  id(result_kind) = 2;
                  break;
                }
              }
            }
          }

          // --- Messwert: Zahl mit bekannter Einheit ---
          //
          // *Jede* Ziffernfolge wird geprueft, nicht nur die erste. Sonst
          // reicht eine Zahl im Geraetenamen ("ID.3", "Model 3", "Sensor 2"),
          // um die Erkennung zu verlieren: die erste Ziffernfolge haette dann
          // keine Einheit hinter sich, und der Messwert weiter hinten im Satz
          // waere nie angesehen worden.
          // "Uhr" stand hier einmal, ist aber wieder entfallen: Home Assistant
          // antwortet auf die Frage nach der Zeit mit "Es ist 22:26" - ohne
          // die Einheit hinter der Zahl. Sie haette also ohnehin nur bei
          // Formulierungen gegriffen, die so nicht vorkommen.
          static const char *const EINHEITEN[] = {
              "°C", "°F", "°", "%", "Prozent", "Grad", "km/h",
              "hPa", "lx", "ppm", "kWh", "kW", "Wh", "W", "V", "A", "dB",
              "km", "cm", "mm", "m"};

          for (size_t i = 0; i < t.size() && id(result_kind) == 0; i++) {
            if (!ist_ziffer(t[i])) continue;

            const size_t start = (i > 0 && t[i - 1] == '-') ? i - 1 : i;
            size_t j = i;
            // ':' gehoert dazu, damit "17:45 Uhr" als eine Zahl durchgeht.
            while (j < t.size() &&
                   (ist_ziffer(t[j]) || t[j] == ',' || t[j] == '.' || t[j] == ':'))
              j++;
            // Ein Satzzeichen direkt hinter der Zahl gehoert nicht mehr dazu.
            size_t ende = j;
            while (ende > i &&
                   (t[ende - 1] == ',' || t[ende - 1] == '.' || t[ende - 1] == ':'))
              ende--;
            const std::string zahl = t.substr(start, ende - start);

            // Einheit steht direkt dahinter oder nach genau einem Leerzeichen.
            // Home Assistant setzt dort teils ein geschuetztes Leerzeichen
            // (U+00A0, in UTF-8 zwei Bytes).
            size_t k = ende;
            if (k < t.size() && t[k] == ' ')
              k += 1;
            else if (k + 1 < t.size() && t.compare(k, 2, "\xc2\xa0") == 0)
              k += 2;
            std::string rest = t.substr(k);
            while (!rest.empty() &&
                   (rest.back() == '.' || rest.back() == '!' || rest.back() == ','))
              rest.pop_back();

            // Laengere Einheiten stehen vor ihren Praefixen; die Pruefung auf
            // das Zeichen hinter der Einheit faengt den Rest ab, damit "kWh"
            // nicht als "kW" und "mm" nicht als "m" durchgeht.
            for (const char *e : EINHEITEN) {
              const std::string einheit(e);
              if (rest.compare(0, einheit.size(), einheit) == 0 &&
                  (rest.size() == einheit.size() || rest[einheit.size()] == ' ')) {
                // Auf eine Nachkommastelle runden - das Design "Rundes
                // Display Konzepte" zeigt die Zahl gross und allein, ohne
                // Icon, das eine ungleiche Ziffernzahl kaschieren wuerde.
                //
                // Nur das *letzte* Komma oder der letzte Punkt in der Zahl
                // zaehlt als Dezimaltrennzeichen (zu einem Punkt fuer
                // strtod gewandelt); alle davor sind Tausendertrenner und
                // fallen weg - so werden sowohl "22,4" als auch ein
                // gruppierter Wert wie "1.234,5" richtig gelesen. strtod
                // bricht an der ersten unbekannten Stelle ab (etwa dem ':'
                // einer Uhrzeit) und liefert trotzdem den Teil davor -
                // id(result_kind) bleibt in dem Fall ohnehin 0, weil keine
                // der EINHEITEN je auf eine Uhrzeit folgt.
                std::string ziffern;
                ziffern.reserve(zahl.size());
                const size_t trenner = zahl.find_last_of(",.");
                for (size_t p = 0; p < zahl.size(); p++) {
                  const char c = zahl[p];
                  if (c == ',' || c == '.') {
                    if (p == trenner) ziffern += '.';
                  } else {
                    ziffern += c;
                  }
                }
                char *zahl_ende = nullptr;
                const double wert = strtod(ziffern.c_str(), &zahl_ende);
                id(result_value) = (zahl_ende != ziffern.c_str())
                    ? esphome::str_sprintf("%.1f", wert)
                    : zahl;
                for (char &c : id(result_value))
                  if (c == '.') c = ',';

                // "Grad" und "Prozent" sind ausgeschriebene Woerter, keine
                // Einheitensymbole - Home Assistant spricht Temperatur und
                // Anteil so aus, gemeint ist aber "°C" bzw. "%". Sie werden
                // deshalb auf ihr Symbol abgebildet statt wie die uebrigen
                // Eintraege in EINHEITEN nur grossgeschrieben zu werden.
                //
                // Alle anderen Eintraege sind bereits Symbole und bekommen
                // wie bisher nur Grossbuchstaben fuers Design: die Einheit
                // steht als kleine, grossgeschriebene Bildunterschrift unter
                // der Trennlinie (packages/ui.yaml, font_unit). Dieselbe
                // ASCII-Schleife wie beim Kleinschreiben oben, nur
                // andersherum.
                std::string e_anzeige;
                if (einheit == "Grad") {
                  e_anzeige = "°C";
                } else if (einheit == "Prozent") {
                  e_anzeige = "%";
                } else {
                  e_anzeige = einheit;
                  for (char &c : e_anzeige)
                    if (c >= 'a' && c <= 'z') c -= 32;
                }
                id(result_unit) = e_anzeige;

                id(result_kind) = 1;
                break;
              }
            }
            // Hinter die gerade gepruefte Zahl springen; t[j] ist keine Ziffer.
            i = j;
          }

        }
        }

        id(voice_assistant_phase) =
            (id(result_kind) != 0) ? ${phase_result} : ${phase_replying};

        // Bleibt dauerhaft drin und laeuft auf INFO: eine Zeile je Antwort ist
        // billig, und ohne sie ist nicht zu unterscheiden, ob die Erkennung
        // danebenlag oder die Anzeige. Genau diese Frage kostete beim ersten
        // Fehlerbild eine komplette Runde aus Compile und OTA.
        // x statt t: t ist nur eine Referenz auf x und lebt nur innerhalb des
        // else-Zweigs oben (weather_shown-Guard) - x selbst ist der
        // Funktionsparameter und bleibt bis hierhin gueltig.
        ESP_LOGI("ergebnis", "Antwort='%s' -> art=%d wert='%s' einheit='%s'",
                 x.c_str(), id(result_kind), id(result_value).c_str(),
                 id(result_unit).c_str());
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
    - script.execute: update_ui

  # Warten und Aufraeumen passiert in end_session. Ein Trigger ist keine
  # Automation mit definierter Restart-Semantik - lage das wait_until/delay
  # direkt hier, wuerde ein zweiter on_end-Aufruf in die noch laufende
  # Aktionsliste hineinlaufen. Das Skript ist mode: restart und damit sauber.
  on_end:
    # Kam keine Sprachausgabe, hat Home Assistant den Befehl stumm ausgefuehrt
    # (leerer Antworttext oder abgeschaltete TTS). Dann traegt der lokale
    # Bestaetigungston die Rueckmeldung, damit es in *jedem* Fall eine
    # akustische Bestaetigung gibt.
    #
    # Die Pruefung auf phase_thinking ist der Filter: nur ein Durchgang, der
    # bis zur Verarbeitung gekommen und dort stehen geblieben ist, war ein
    # ausgefuehrter Befehl. Ein Fehler hat die Phase laengst auf phase_error
    # gesetzt, ein Abbruch per Tippen auf Idle - beide fallen hier heraus.
    - if:
        condition:
          lambda: |-
            return !id(had_tts)
                && id(voice_assistant_phase) == ${phase_thinking};
        then:
          # Muss als *erstes* stehen und ist der Grund, warum das Geraet nach
          # einer Antwort ohne Sprachausgabe taub wurde.
          #
          # Endet die Pipeline, waehrend das Mikrofon noch abgebaut wird, ist
          # der Zustand STOP_MICROPHONE und der Wunschzustand AWAITING_RESPONSE
          # (gesetzt vom vorangegangenen "STT by VAD end"). Der RUN_END-Handler
          # kennt genau diesen Zustand nicht (voice_assistant.cpp:903: er prueft
          # START_PIPELINE, STARTING_PIPELINE, STREAMING_MICROPHONE und
          # AWAITING_RESPONSE) und laesst den Wunsch stehen - die Komponente
          # landet also in AWAITING_RESPONSE und wartet dort auf eine Antwort,
          # die Home Assistant laengst geschickt hat. Verlassen wird der
          # Zustand nur durch ein Ereignis ("State changed by events",
          # voice_assistant.cpp:433), und es kommt keines mehr.
          #
          # Ab da ist das Geraet still taub: das Wake Word wird weiter erkannt,
          # aber voice_assistant.start steigt wortlos aus, weil request_start
          # nur aus IDLE heraus etwas tut (voice_assistant.cpp:682). Genau das
          # stand im Log - "Detected 'Okay Nabu'" ohne jede Folge. Auch ein
          # spaeteres voice_assistant.stop half nicht: aus AWAITING_RESPONSE
          # heraus signalisiert es nur nach Home Assistant und laesst den
          # Zustand stehen (Zeile 713).
          #
          # Hier dagegen ist der Zustand noch STOP_MICROPHONE/
          # STOPPING_MICROPHONE, und dafuer gibt es den Zweig
          # `desired_state_ = IDLE` (Zeile 709) - der Abbau laeuft zu Ende und
          # die Komponente landet sauber im Leerlauf.
          #
          # Ungefaehrlich ist das nur an dieser Stelle: `!had_tts` heisst, es
          # spielt keine Sprachausgabe, die abgeschnitten werden koennte.
          - voice_assistant.stop:
          - lambda: |-
              id(result_kind) = 2;
              id(voice_assistant_phase) = ${phase_result};
              // Nur vormerken. Der Ton laeuft in end_session, sobald der
              // I2S-Bus sicher frei ist.
              id(confirm_pending) = true;
          - script.execute: update_ui
    - script.execute: end_session

  on_error:
    # duplicate_wake_up_detected ist Rauschen des lokalen Wake Words und wird
    # weiterhin verschluckt. stt-no-text-recognized dagegen nicht mehr: es
    # bedeutet "nichts verstanden" und wird jetzt als Fragezeichen angezeigt -
    # ohne das wirkt ein Fehlausloeser wie ein haengendes Geraet.
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
        then:
          # Fehlerklassen. Die Codes stammen teils aus der Pipeline in Home
          # Assistant, teils aus der ESPHome-Komponente selbst
          # (voice_assistant.cpp: mic-channel-stalled, not-connected,
          # failed-to-start, wake-provider-missing).
          - lambda: |-
              if (code == "stt-no-text-recognized" ||
                  code == "intent-not-recognized") {
                id(error_kind) = 1;
              } else if (code == "not-connected" || code == "failed-to-start" ||
                         code == "wake-provider-missing" ||
                         code == "wake-engine-missing" ||
                         code == "pipeline-not-found") {
                id(error_kind) = 2;
              } else {
                id(error_kind) = 0;
              }
              id(voice_assistant_phase) = ${phase_error};
          - text_sensor.template.publish:
              id: text_response
              state: !lambda return message;
          - script.execute: update_ui
          - script.execute: clear_error

  # ------------------------------------------------------------------ Timer
  # Der Ring am Bildschirmrand und der Countdown in der Mitte haengen an diesen
  # fuenf Triggern. Allein ihre Anwesenheit schaltet den Timer-Support scharf
  # (set_has_timers im Codegen) - in Home Assistant ist dafuer nichts zu tun.
  on_timer_started:
    - lambda: |-
        id(timer_active) = true;
        id(timer_total) = timer.total_seconds;
        id(timer_left) = timer.seconds_left;
        id(timer_name) = timer.name;
    - script.execute: update_timer_ui

  on_timer_updated:
    - lambda: |-
        id(timer_active) = timer.is_active;
        id(timer_total) = timer.total_seconds;
        id(timer_left) = timer.seconds_left;
        id(timer_name) = timer.name;
    - script.execute: update_timer_ui

  # Der Takt korrigiert das gleich wieder, falls noch weitere Timer laufen -
  # er feuert weiter, solange die Liste in der Komponente nicht leer ist
  # (voice_assistant.cpp:1035). Der Ring kann dabei bis zu eine Sekunde lang
  # verschwinden; das ist der Preis dafuer, hier keine Liste mitzufuehren.
  on_timer_cancelled:
    - lambda: id(timer_active) = false;
    - script.execute: update_timer_ui

  on_timer_finished:
    - lambda: id(timer_active) = false;
    - script.execute: update_timer_ui
    - script.execute: timer_start_ringing

  # Quelle der Wahrheit: jede Sekunde kommt die vollstaendige Liste. Angezeigt
  # wird der naechstfaellige Timer.
  on_timer_tick:
    # Ueber den Index statt ueber einen Zeiger, damit der Typ Timer hier nicht
    # benannt werden muss - er liegt im Namensraum voice_assistant, der in der
    # generierten main.cpp nicht offen ist.
    - lambda: |-
        int naechster = -1;
        for (size_t i = 0; i < timers.size(); i++) {
          if (!timers[i].is_active) continue;
          if (naechster < 0 ||
              timers[i].seconds_left < timers[naechster].seconds_left)
            naechster = (int) i;
        }
        if (naechster < 0) {
          id(timer_active) = false;
        } else {
          id(timer_active) = true;
          id(timer_total) = timers[naechster].total_seconds;
          id(timer_left) = timers[naechster].seconds_left;
          id(timer_name) = timers[naechster].name;
        }
    - script.execute: update_timer_ui

  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_muted
    - script.execute: update_ui

  on_client_disconnected:
    # Laufende Aufraeum-Timer abbrechen, sonst ueberschreibt deren
    # set_idle_or_muted spaeter die Not-Ready-Anzeige.
    - script.stop: end_session
    - script.stop: clear_error
    - script.execute: stop_wake_word
    - lambda: id(voice_assistant_phase) = ${phase_not_ready};
    - script.execute: update_ui

text_sensor:
  - platform: template
    id: text_request
    name: "Erkannter Text"
    icon: mdi:account-voice
  - platform: template
    id: text_response
    name: "Antwort"
    icon: mdi:message-text

switch:
  - platform: template
    id: mute
    name: "Mikrofon stumm"
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: stop_wake_word
      - lambda: id(voice_assistant_phase) = ${phase_muted};
      - script.execute: update_ui
    on_turn_off:
      - script.execute: start_wake_word
      - lambda: id(voice_assistant_phase) = ${phase_idle};
      - script.execute: update_ui

select:
  # Die vom Nutzer gewuenschte Umschaltung zwischen lokalem Wake Word und
  # Wake Word in Home Assistant (openWakeWord).
  - platform: template
    id: wake_word_engine_location
    name: "Wake-Word-Engine"
    icon: mdi:account-voice
    optimistic: true
    restore_value: true
    entity_category: config
    initial_option: "Auf dem Geraet"
    options:
      - "Auf dem Geraet"
      - "In Home Assistant"
    on_value:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            # Timeout, damit die Umschaltung nicht dauerhaft haengen bleibt,
            # falls die Phase wegen eines Fehlers nie in den Idle zurueckfaellt.
            - wait_until:
                condition:
                  lambda: |-
                    return id(voice_assistant_phase) == ${phase_idle}
                        || id(voice_assistant_phase) == ${phase_muted};
                timeout: 30s
            - script.execute: stop_wake_word
            - delay: 500ms
            - script.execute: start_wake_word

  - platform: template
    id: wake_word_sensitivity
    name: "Wake-Word-Empfindlichkeit"
    icon: mdi:tune
    optimistic: true
    restore_value: true
    entity_category: config
    initial_option: "Mittel"
    options:
      - "Niedrig"
      - "Mittel"
      - "Hoch"
    on_value:
      # Kalibrierte Schwellwerte aus home-assistant-voice-pe.
      # Werte sind quantisierte uint8 (0-255) der Wahrscheinlichkeit.
      - lambda: |-
          if (x == "Niedrig") {
            id(mww_okay_nabu).set_probability_cutoff(217);
            id(mww_hey_jarvis).set_probability_cutoff(247);
            id(mww_hey_mycroft).set_probability_cutoff(253);
          } else if (x == "Mittel") {
            id(mww_okay_nabu).set_probability_cutoff(176);
            id(mww_hey_jarvis).set_probability_cutoff(235);
            id(mww_hey_mycroft).set_probability_cutoff(242);
          } else {
            id(mww_okay_nabu).set_probability_cutoff(143);
            id(mww_hey_jarvis).set_probability_cutoff(212);
            id(mww_hey_mycroft).set_probability_cutoff(237);
          }

script:
  # Startet die Wake-Word-Erkennung passend zur gewaehlten Engine.
  - id: start_wake_word
    mode: restart
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - if:
                condition:
                  lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
                then:
                  - micro_wake_word.stop:
                  - lambda: id(va).set_use_wake_word(true);
                  - voice_assistant.start_continuous:
                else:
                  - lambda: id(va).set_use_wake_word(false);
                  - voice_assistant.stop:
                  - micro_wake_word.start:

  - id: stop_wake_word
    mode: restart
    then:
      - micro_wake_word.stop:
      - lambda: id(va).set_use_wake_word(false);
      - voice_assistant.stop:

  - id: set_idle_or_muted
    then:
      - if:
          condition:
            switch.is_on: mute
          then:
            - lambda: id(voice_assistant_phase) = ${phase_muted};
          else:
            - lambda: id(voice_assistant_phase) = ${phase_idle};

  # Abschluss eines Sprachvorgangs: Ausgabe abwarten, Balken mit dem Ton
  # beenden, Wake Word wieder scharfstellen, eine Ergebnisanzeige noch kurz
  # stehen lassen, dann zurueck in den Idle.
  # Wird von on_listening abgebrochen, falls schon wieder gesprochen wird.
  - id: end_session
    mode: restart
    then:
      # Warten bis die Sprachausgabe wirklich durch ist, sonst kollidiert
      # das Wake Word mit dem noch belegten I2S-Bus.
      - wait_until:
          condition:
            media_player.is_announcing:
          timeout: 0.5s
      # Ohne Timeout haengt das Skript fuer immer, wenn der Speaker seinen
      # Zustand nicht sauber zuruecksetzt - dann bleibt das Geraet ohne Wake
      # Word in der Replying-Anzeige stehen. 30 s sind laenger als jede
      # realistische TTS-Antwort.
      - wait_until:
          condition:
            and:
              - not:
                  media_player.is_announcing:
              - not:
                  speaker.is_playing:
          timeout: 30s
      # Bedenkzeit nach einer Ansage aus Home Assistant. on_announce feuert
      # end_trigger schon beim *Start* der Ansage (voice_assistant.cpp:1080),
      # dieses Skript laeuft also die ganze Ansage lang mit - und raeumte
      # danach sofort auf. Bei assist_satellite.ask_question ist das genau
      # falsch: die Pipeline geht nach der Frage in START_MICROPHONE weiter
      # (voice_assistant.cpp:513), und der Aufraeumteil unten hat ihr das mit
      # dem voice_assistant.stop aus start_wake_word wieder abgedreht. Auf dem
      # Geraet sah man die Frage, danach sofort Standby und kein Fragezeichen.
      #
      # Zwei Sekunden reichen, denn abgebrochen wird dieses Skript nicht hier,
      # sondern von on_listening (script.stop: end_session), sobald Home
      # Assistant wirklich aufnimmt. Bleibt die Aufnahme aus - eine gewoehnliche
      # Ansage ohne Rueckfrage -, kostet es nur diese zwei Sekunden bis zum
      # Scharfstellen.
      - if:
          condition:
            lambda: return !id(pipeline_session);
          then:
            - delay: 2s
      - lambda: id(pipeline_session) = false;
      # Die fuenf Balken sind die Sprachausgabe, nicht ihr Nachklang: hoert der
      # Ton auf, hoeren sie auf. Frueher lief die Animation noch die 8 s des
      # Nachlaufs unten weiter - der Nachlauf ist aber fuer die
      # Ergebnisanzeige da (Messwert oder Haken, phase_result), und die bleibt
      # unberuehrt. In phase_replying steht ohnehin nichts Lesbares auf dem
      # Schirm, das noch stehen bleiben muesste.
      - if:
          condition:
            lambda: return id(voice_assistant_phase) == ${phase_replying};
          then:
            - script.execute: set_idle_or_muted
            - script.execute: update_ui
      # Bestaetigungston, falls Home Assistant den Befehl stumm ausgefuehrt hat.
      # Er muss *hier* liegen, zwischen dem Ende der Sprachausgabe und dem
      # Scharfstellen des Wake Words - das ist das einzige Fenster, in dem der
      # I2S-Bus frei ist.
      #
      # Das Board hat genau einen I2S-Controller fuer Mikrofon und Lautsprecher.
      # Laeuft die Wake-Word-Erkennung, haelt sie ihn mit 16 kHz; der
      # Lautsprecher will 48 kHz und scheitert mit "Parent bus is busy"
      # (i2s_audio.speaker.std:401), gefolgt von einer Wiederholschleife im
      # Sekundentakt. Genau das passierte, solange der Ton direkt im on_end lag.
      - if:
          condition:
            lambda: return id(confirm_pending);
          then:
            - lambda: id(confirm_pending) = false;
            - media_player.speaker.play_on_device_media_file:
                id: media_out
                media_file: snd_confirm
                announcement: true
            # Ohne dieses Warten kaeme start_wake_word dem Ton zuvor und
            # belegte den Bus, den er gerade erst bekommen hat.
            - wait_until:
                condition:
                  not:
                    speaker.is_playing:
                timeout: 5s
            # Dieselben 500 ms wie beim Engine-Wechsel und beim Klingelton:
            # speaker.is_playing wird false, sobald die letzten Samples
            # abgegeben sind - den I2S-Bus gibt der Lautsprechertask aber erst
            # danach frei. Ohne diese Pause scheitert micro_wake_word beim
            # Griff aufs Mikrofon, und weil danach nichts mehr nachfasst, blieb
            # das Geraet nach einem still ausgefuehrten Befehl taub.
            - delay: 500ms
      # Erst scharfstellen, wenn die Komponente wirklich im Leerlauf ist - sonst
      # loescht das Scharfstellen die Rueckfrage, die es gerade auszuwerten
      # gilt.
      #
      # Home Assistant meldet eine offene Rueckfrage im INTENT_END-Ereignis
      # (continue_conversation, esphome/assist_satellite.py; gesetzt, sobald die
      # Antwort mit einem Fragezeichen endet, conversation/chat_log.py). Die
      # Komponente merkt sie sich und wertet sie erst aus, wenn der Ton durch
      # ist: RESPONSE_FINISHED geht dann nach START_MICROPHONE statt nach IDLE
      # (voice_assistant.cpp:513). Zwischen "Ton fertig" und dieser Auswertung
      # liegen rund 100 ms - und genau dort lag bisher start_wake_word, dessen
      # voice_assistant.stop den Merker bedingungslos loescht
      # (voice_assistant.cpp:692). Das Geraet hat sich seine eigene Rueckfrage
      # abgeraeumt; im Log stand danach RESPONSE_FINISHED → IDLE.
      #
      # Laeuft die Rueckfrage weiter, wird dieses Skript ohnehin von
      # on_listening abgebrochen - das Warten laeuft dann ins Timeout und die
      # fuenf Sekunden sieht nie jemand. Nur fuer die lokale Engine: dort ist
      # continuous_ false, `voice_assistant.is_running` meint also wirklich
      # "Zustand != IDLE". In der HA-Engine waere die Bedingung immer wahr
      # (voice_assistant.h:383) und das Warten liefe jedes Mal ins Leere.
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "Auf dem Geraet";
          then:
            - wait_until:
                condition:
                  not:
                    voice_assistant.is_running:
                timeout: 5s
      # Ueber das Skript statt direkt micro_wake_word.start: das beruecksichtigt
      # die gewaehlte Engine und respektiert eine waehrend des Vorgangs
      # gesetzte Stummschaltung.
      - script.execute: start_wake_word
      # Stehen bleibt nur, was man auch ansehen will: der Messwert bzw. der
      # Haken der Ergebnisanzeige. Die Balken der Sprachausgabe sind zu diesem
      # Zeitpunkt laengst weg - der Zweig oben hat die Phase mit dem letzten
      # Ton verlassen.
      - if:
          condition:
            lambda: return id(voice_assistant_phase) == ${phase_result};
          then:
            - delay: ${result_hold_time}
      # Eine Fehleranzeige gehoert clear_error und niemandem sonst. Viele
      # Fehler loesen *beides* aus - erst on_error, gleich danach on_end -,
      # und ohne diesen Guard raeumte end_session das Fragezeichen nach
      # Sekundenbruchteilen wieder weg, obwohl clear_error es drei Sekunden
      # stehen lassen wollte. Von aussen sah das aus wie ein Aufblitzen.
      - if:
          condition:
            lambda: return id(voice_assistant_phase) != ${phase_error};
          then:
            - script.execute: set_idle_or_muted
            - script.execute: update_ui
      # Die Textsensoren sind die einzige Stelle, an der Frage und Antwort in
      # Home Assistant landen - sie behalten ihre Standzeit unabhaengig davon,
      # wie lange die Anzeige auf dem Geraet stehen bleibt.
      - delay: 8s
      - text_sensor.template.publish:
          id: text_request
          state: ""
      - text_sensor.template.publish:
          id: text_response
          state: ""

  # Laufenden Sprachvorgang abbrechen. Aufgerufen aus on_screen_touch
  # (packages/ui.yaml), und zwar nur aus den drei aktiven Phasen heraus.
  - id: abort_session
    mode: restart
    then:
      # Ein noch laufender Fehler-Timer wuerde spaeter set_idle_or_muted
      # aufrufen und in die frisch aufgeraeumte Anzeige hineinschreiben.
      - script.stop: clear_error
      # request_stop() beendet die Pipeline aus jedem Zustand heraus: beim
      # Zuhoeren/Verarbeiten geht ein Stop-Signal an Home Assistant, in der
      # Sprachausgabe stoppt die Komponente das Announcement des Media Players
      # selbst (voice_assistant.cpp:690). Ein extra media_player.stop braucht
      # es deshalb nicht. Wichtig: dabei faellt continuous_ weg - ohne
      # anschliessendes start_wake_word bliebe das Geraet in der HA-Engine taub.
      - voice_assistant.stop:
      - text_sensor.template.publish:
          id: text_request
          state: ""
      - text_sensor.template.publish:
          id: text_response
          state: ""
      - script.execute: set_idle_or_muted
      - script.execute: update_ui
      # Wake Word wieder scharfstellen - ueber end_session, damit gewartet wird,
      # bis der Lautsprecher den I2S-Bus tatsaechlich freigegeben hat. Ein
      # danach doch noch eintreffendes on_end startet dasselbe Skript neu
      # (mode: restart), es kann also nichts doppelt laufen. Dessen zweiter
      # Aufraeum-Durchgang nach 8 s schreibt genau dieselben Werte.
      - script.execute: end_session

  # ------------------------------------------------------- Timer klingelt
  # Wichtig: Das Geraet muss den Timer in Home Assistant *nicht* abraeumen.
  # voice_assistant.cpp:1030 loescht ihn unmittelbar nachdem on_timer_finished
  # gefeuert hat, fuer HA ist er damit erledigt. Hier bleibt also nur der
  # lokale Ton - und deshalb braucht das Stoppen per Tippen keine Automation.
  - id: timer_start_ringing
    mode: restart
    then:
      - lambda: |-
          id(timer_ringing) = true;
          id(voice_assistant_phase) = ${phase_timer_ringing};
      - script.execute: update_ui
      - script.execute: timer_ring_sound
      - script.execute: timer_ring_guard

  - id: timer_ring_sound
    mode: restart
    then:
      # Erst das Wake Word abschalten, sonst bleibt der Klingelton stumm.
      #
      # Das Board hat genau einen I2S-Controller fuer Mikrofon und
      # Lautsprecher. Laeuft die Wake-Word-Erkennung, haelt sie ihn mit 16 kHz
      # und der Lautsprecherstart mit 48 kHz scheitert an "Parent bus is busy"
      # (i2s_audio.speaker.std:401) - dieselbe Ursache wie frueher beim
      # Bestaetigungston. stop_after_detection rettet hier nichts: es haelt das
      # Modell nur nach einer *Erkennung* an, und ein ablaufender Timer trifft
      # das Geraet in aller Regel mitten im Lauschen. (Die frueher hier
      # stehende Behauptung, der Klingelton sei davon nicht betroffen, war
      # schlicht falsch - der Ton kam nie.)
      #
      # Solange es klingelt, hoert das Geraet also kein Wake Word. Das ist der
      # Preis des einen Busses; zum Beenden genuegt ein Tippen, und nach
      # ${timer_ring_timeout} gibt timer_ring_guard von selbst Ruhe.
      - script.execute: stop_wake_word
      # Dieselben 500 ms wie beim Engine-Wechsel: der Mikrofontask gibt den Bus
      # nicht im selben Atemzug frei.
      - delay: 500ms
      - while:
          condition:
            lambda: return id(timer_ringing);
          then:
            - media_player.speaker.play_on_device_media_file:
                id: media_out
                media_file: snd_timer
                announcement: true
            - delay: ${timer_sound_repeat}

  # Nach ${timer_ring_timeout} von selbst Ruhe geben, falls niemand da ist.
  - id: timer_ring_guard
    mode: restart
    then:
      - delay: ${timer_ring_timeout}
      - script.execute: timer_stop_ringing

  # Aufgerufen vom Tippen (on_screen_touch in packages/ui.yaml), vom
  # on_listening (wer spricht, will die Glocke los) und vom Wachhund oben.
  # Laeuft ohne delay durch, ist also aus einem anderen Skript heraus synchron.
  - id: timer_stop_ringing
    mode: restart
    then:
      - script.stop: timer_ring_sound
      - script.stop: timer_ring_guard
      - lambda: id(timer_ringing) = false;
      - media_player.stop:
          id: media_out
      - script.execute: set_idle_or_muted
      - script.execute: update_ui
      # Das Wake Word wieder scharfstellen. Getrenntes Skript, weil dabei auf
      # den Lautsprecher gewartet werden muss - dieses hier muss synchron
      # durchlaufen, damit on_listening danach seine eigene Phase setzen kann.
      - script.execute: timer_ring_release

  # Gegenstueck zum stop_wake_word in timer_ring_sound: Bus freigeben lassen,
  # dann die Erkennung neu starten.
  - id: timer_ring_release
    mode: restart
    then:
      - wait_until:
          condition:
            not:
              speaker.is_playing:
          timeout: 5s
      # Hat inzwischen ein Sprachvorgang begonnen (on_listening ruft
      # timer_stop_ringing, bevor es die Phase setzt), gehoert der Bus ihm -
      # dessen end_session stellt das Wake Word selbst wieder scharf.
      - if:
          condition:
            lambda: |-
              return id(voice_assistant_phase) == ${phase_idle}
                  || id(voice_assistant_phase) == ${phase_muted};
          then:
            - script.execute: start_wake_word

  # ------------------------------------------- Ansage aus Home Assistant
  # Gerufen vom on_announcement des Media Players (packages/hardware.yaml),
  # und zwar nur aus dem Leerlauf heraus - waehrend eines Sprachvorgangs ist
  # die Ansage die TTS-Antwort, um die sich end_session kuemmert.
  #
  # Der Grund ist derselbe wie beim Klingelton: das Board hat einen einzigen
  # I2S-Controller. Trifft eine Ansage aus Home Assistant ein, waehrend die
  # Wake-Word-Erkennung den Bus mit 16 kHz haelt, scheitert der Lautsprecher
  # mit "Parent bus is busy" - die Ansage blieb stumm, und
  # assist_satellite.ask_question hing daran fest: Home Assistant wartet auf
  # das Ende der Frage, bevor es die Antwort aufnimmt. Auf dem Geraet sah man
  # deshalb die fuenf Balken und danach nichts mehr.
  #
  # Das Geraet raeumt den Bus selbst nur in der HA-Engine: on_announce schickt
  # die Pipeline nach STOP_MICROPHONE, aber ausdruecklich nur
  # `if (this->continuous_)` (voice_assistant.cpp:1070). Das lokale
  # micro_wake_word laeuft unabhaengig davon weiter und haelt das Mikrofon -
  # dagegen hilft nur dieses Skript.
  #
  # Gestoppt wird gezielt `micro_wake_word.stop` und *nicht* das Skript
  # stop_wake_word: dessen `voice_assistant.stop` wuerde die Ansage abwuergen,
  # die ja gerade aus der Pipeline kommt.
  #
  # Scharfgestellt wird erst eine Sekunde nach dem letzten Ton, und nur, wenn
  # inzwischen niemand sonst das Mikrofon hat: nach einer Rueckfrage nimmt
  # Home Assistant sofort wieder auf, und nach einer gewoehnlichen Antwort hat
  # end_session laengst selbst scharfgestellt.
  - id: announcement_guard
    mode: restart
    then:
      - micro_wake_word.stop:
      - wait_until:
          condition:
            not:
              media_player.is_announcing:
          timeout: 60s
      - wait_until:
          condition:
            not:
              speaker.is_playing:
          timeout: 10s
      - delay: 1s
      - if:
          condition:
            and:
              - lambda: |-
                  return id(voice_assistant_phase) == ${phase_idle}
                      || id(voice_assistant_phase) == ${phase_muted};
              - not:
                  voice_assistant.is_running:
              - not:
                  micro_wake_word.is_running:
          then:
            - script.execute: start_wake_word

  - id: clear_error
    mode: restart
    then:
      - delay: 3s
      # Mehrere Fehlerpfade im Voice Assistant (not-connected, failed-to-start,
      # mic-channel-stalled, wake-provider-missing) loesen *nur* on_error aus,
      # nie on_end. Ohne diesen Zweig bliebe das lokale Wake Word nach so einem
      # Fehler dauerhaft gestoppt (stop_after_detection: true) und das Geraet
      # taub. Die is_running-Pruefung verhindert, dass wir dabei einen noch
      # laufenden Vorgang abwuergen - um den kuemmert sich end_session.
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: start_wake_word
      - script.execute: set_idle_or_muted
      - text_sensor.template.publish:
          id: text_response
          state: ""
      - script.execute: update_ui

  # ------------------------------------------------- Wetter auf Nachfrage
  # Gegenstueck zur optionalen API-Aktion zeige_wetter (packages/core.yaml).
  # Setzt nur State, fasst kein Widget an - das uebernimmt update_ui weiter
  # oben ueber on_tts_start, sobald die gesprochene Antwort einsetzt (siehe
  # dort, weather_shown). Ohne einen Aufruf aus Home Assistant (README,
  # Abschnitt "Wetter auf Nachfrage") laeuft dieses Skript nie.
  - id: stage_weather
    mode: restart
    parameters:
      zustand: string
      temperatur: float
      einheit: string
    then:
      - lambda: |-
          // Sieben vereinfachte Zustaende statt aller vierzehn Home-Assistant-
          // Wetterzustaende - das reicht auf einem 466 px runden Display aus,
          // um sie unterscheidbar zu zeigen. Unbekannte/kuenftige Zustaende
          // (auch "exceptional" und "fog") fallen auf bewoelkt zurueck.
          // Codepoints aus demselben Material-Symbols-Codepoint-Register wie
          // font_icon (Link dort, packages/ui.yaml).
          struct Eintrag { const char *ha; const char *glyph; };
          static const char *const G_SONNIG     = "\U0000E81A"; // sunny
          static const char *const G_KLAR_NACHT = "\U0000F159"; // clear_night
          static const char *const G_BEWOELKT   = "\U0000F15C"; // cloud
          static const char *const G_REGNERISCH = "\U0000F176"; // rainy
          static const char *const G_GEWITTRIG  = "\U0000EBDB"; // thunderstorm
          static const char *const G_SCHNEEIG   = "\U0000E2CD"; // weather_snowy
          static const char *const G_WINDIG     = "\U0000EFD8"; // air

          static const Eintrag ZUSTAENDE[] = {
              {"sunny",           G_SONNIG},
              {"clear-night",     G_KLAR_NACHT},
              {"cloudy",          G_BEWOELKT},
              {"partlycloudy",    G_BEWOELKT},
              {"exceptional",     G_BEWOELKT},
              {"fog",             G_BEWOELKT},
              {"rainy",           G_REGNERISCH},
              {"pouring",         G_REGNERISCH},
              {"hail",            G_REGNERISCH},
              {"lightning",       G_GEWITTRIG},
              {"lightning-rainy", G_GEWITTRIG},
              {"snowy",           G_SCHNEEIG},
              {"snowy-rainy",     G_SCHNEEIG},
              {"windy",           G_WINDIG},
              {"windy-variant",   G_WINDIG}};

          const char *glyph = G_BEWOELKT;
          bool bekannt = false;
          for (const Eintrag &e : ZUSTAENDE)
            if (zustand == e.ha) { glyph = e.glyph; bekannt = true; break; }
          id(weather_icon_glyph) = glyph;

          // Gleiches Rundungsmuster wie die Messwerterkennung in
          // on_tts_start: eine Nachkommastelle, Komma statt Punkt. temperatur
          // ist hier schon ein float - kein strtod noetig, das braucht nur
          // die Textheuristik dort.
          id(result_value) = esphome::str_sprintf("%.1f", temperatur);
          for (char &c : id(result_value))
            if (c == '.') c = ',';

          id(result_unit) = einheit;
          id(result_kind) = 3;
          id(weather_shown) = true;

          // Gegenstueck zur "ergebnis"-Zeile in on_tts_start.
          ESP_LOGI("wetter", "zustand='%s' bekannt=%d temperatur=%.1f einheit='%s'",
                   zustand.c_str(), bekannt, temperatur, einheit.c_str());

# ------------------------------------------------------ Wake-Word-Wachhund
# Das Geraet kann taub werden, ohne dass es jemand merkt: micro_wake_word
# braucht das Mikrofon, und das Mikrofon haengt am selben I2S-Controller wie
# der Lautsprecher. Scheitert ein Start (der Lautsprechertask gibt den Bus
# etwas spaeter frei, als speaker.is_playing es sagt), versucht es niemand
# erneut - das Geraet steht dann still im Leerlauf und hoert nichts mehr.
# Genau das ist beim Bestaetigungston und nach einer Rueckfrage passiert.
#
# Die einzelnen Stellen sind repariert (500 ms Pause, announcement_guard,
# pipeline_session), aber sie sind alle vom selben Muster - deshalb hier ein
# Netz darunter statt einer weiteren Einzelkorrektur. Der Wachhund fasst nur
# an, was eindeutig ist: Leerlauf, nicht stumm, lokale Engine, kein Ton
# unterwegs und micro_wake_word laeuft trotzdem nicht.
#
# Nur fuer die lokale Engine. In der HA-Engine gibt es kein micro_wake_word,
# das laufen koennte - dort ist die Dauerverbindung selbst das Wake Word.
interval:
  - interval: 30s
    then:
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - lambda: return id(voice_assistant_phase) == ${phase_idle};
              - switch.is_off: mute
              - lambda: return id(wake_word_engine_location).current_option() == "Auf dem Geraet";
              - not:
                  micro_wake_word.is_running:
              - not:
                  media_player.is_announcing:
              - not:
                  speaker.is_playing:
          then:
            # Bleibt dauerhaft drin und laeuft auf WARN: schlaegt der Wachhund
            # regelmaessig an, ist eine der Einzelkorrekturen unvollstaendig -
            # ohne diese Zeile faellt das nie auf, weil er es ja repariert.
            - logger.log:
                level: WARN
                format: "Wake Word stand still im Leerlauf - wird neu gestartet"
            - script.execute: start_wake_word

      # Zweiter Fall, und der gefaehrlichere: das Wake Word laeuft, wird auch
      # erkannt - aber die Pipeline steht in einem Zwischenzustand, und
      # voice_assistant.start steigt deshalb wortlos aus (request_start tut nur
      # aus IDLE heraus etwas, voice_assistant.cpp:682). Von aussen sieht das
      # aus wie ein taubes Geraet, obwohl alles zu laufen scheint.
      #
      # In der lokalen Engine ist continuous_ false, `voice_assistant.is_running`
      # meint hier also wirklich "Zustand != IDLE" - in der HA-Engine waere die
      # Bedingung dagegen immer wahr (voice_assistant.h:383), deshalb steht die
      # Engine-Pruefung mit drin.
      #
      # Der Versuch, es zu richten, ist bewusst nur ein voice_assistant.stop:
      # aus den meisten Zwischenzustaenden fuehrt das nach IDLE zurueck. Aus
      # AWAITING_RESPONSE nicht - dagegen hilft nur der Zweig in on_end, der
      # diesen Zustand gar nicht erst entstehen laesst. Bleibt die Meldung
      # trotzdem stehen, fehlt noch ein Pfad.
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - lambda: return id(voice_assistant_phase) == ${phase_idle};
              - switch.is_off: mute
              - lambda: return id(wake_word_engine_location).current_option() == "Auf dem Geraet";
              - micro_wake_word.is_running:
              - voice_assistant.is_running:
              - not:
                  media_player.is_announcing:
              - not:
                  speaker.is_playing:
          then:
            - logger.log:
                level: WARN
                format: "Pipeline haengt im Leerlauf - Wake Word wird nicht angenommen"
            - voice_assistant.stop:
