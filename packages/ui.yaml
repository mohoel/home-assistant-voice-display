        - label:
            id: lbl_date
            align: CENTER
            y: 82
            text: ""
            text_font: font_date
            text_color: ${color_text_dim}
            text_align: CENTER

    # ------------------------------------------------ Standby: Zifferblatt
    # Zweite, ueber sel_standby_page waehlbare Standby-Seite. Umsetzung des
    # Designs "Runde Zeitanzeige" (Claude-Design-Projekt) und bewusst *ohne*
    # Zeiger: die Stunde ist die hervorgehobene Ziffer, die Minute der
    # hervorgehobene Strich im Kranz. Beides setzt update_dial.
    #
    # Warum `line:` und nicht `obj:` oder `arc:`
    # -----------------------------------------
    # Ein Strich zeigt radial nach aussen, steht also in fast jeder Position
    # schraeg. Ein gedrehtes `obj:` waere der naheliegende Weg, aber
    # transform_rotation laesst LVGL 9 das Widget in einen eigenen Layer
    # rendern - genau die Zeichenbandbreite, an der schon der Phasen-Ring
    # gescheitert ist. Ein `arc:` braucht keine Drehung, kann seine Winkel
    # aber nur ganzzahlig setzen: ein Grad sind auf Radius 218 rund 3,8 px,
    # die zarten 2-px-Minutenstriche des Entwurfs gaebe es damit nicht. Bleibt
    # `line:` - kein Layer, echte Kantenglaettung, runde Enden
    # (`line_rounded`) und eine Bounding-Box in Strichgroesse statt 466 px.
    #
    # Achtung beim Umbau: LVGL kompiliert nur die Widgets ein, die im YAML
    # auch vorkommen (LV_USE_LINE steht sonst auf 0). Die Striche muessen
    # deshalb hier stehen und koennen nicht zur Laufzeit erzeugt werden.
    #
    # Woher die Zahlen kommen
    # -----------------------
    # Die 72 Zeilen unten sind erzeugt, nicht von Hand geschrieben. Fuer
    # Strich i (0..59, i % 5 == 0 ist ein Stundenstrich) mit Winkel a = i * 6°
    # und Laenge len (16 bzw. 7 px):
    #
    #   ux =  sin a                  hx = len/2 * ux
    #   uy = -cos a                  hy = len/2 * uy
    #   width  = max(round(2*|hx|), 1)   x = round(${dial_radius} * ux)
    #   height = max(round(2*|hy|), 1)   y = round(${dial_radius} * uy)
    #   points = innerer -> aeusserer Endpunkt, Ursprung linke obere Ecke
    #
    # Der Strich ist damit die Diagonale seiner eigenen Box, und die Box-Mitte
    # liegt genau auf dem Kranzradius - deshalb genuegt `align: CENTER` plus
    # Versatz. Das `max(..., 1)` gilt den vier achsparallelen Strichen (12, 3,
    # 6, 9 Uhr): eine Box der Breite 0 hat eine leere Flaeche und wuerde beim
    # Zeichnen uebersprungen.
    #
    # Die Ziffern stehen nach derselben Rechnung auf Radius ${dial_num_radius},
    # Winkel n * 30°.
    - id: page_dial
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        # Alle Elemente liegen in einem gemeinsamen Traeger. Angelegt wurde er
        # fuer den Einbrennschutz, der das ganze Zifferblatt mit *einem*
        # Aufruf verschob statt mit 72; den gibt es nicht mehr (der Bildschirm
        # geht stattdessen ganz aus, siehe sleep_display). Er bleibt trotzdem,
        # weil er das Zifferblatt als eine Einheit greifbar macht und nichts
        # kostet. Bildschirmgross genuegt: LVGL schneidet Kinder am Elternrand
        # ab, und das aeusserste Element ist die Minutenmarke mit
        # 218 (Kranz) + 10 (halbe Marke) = 228 < 233. Frueher stand hier 560,
        # weil der Glow der Minutenmarke weit ueber den Kranz hinausreichte -
        # den gibt es nicht mehr.
        - obj:
            id: dial_face
            align: CENTER
            width: 466
            height: 466
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            clickable: false
            scrollable: false
            widgets:
              # Hier lagen einmal zwei Weichzeichner-Kreise (dial_glow_num,
              # dial_glow_tick): unsichtbare Objekte, die nur ihren Schatten
              # trugen - der einzige Glow, den LVGL kennt, weil es keinen
              # Weichzeichner fuer Linien oder Text gibt. Auf dem Geraet sahen
              # sie nicht nach Leuchten aus, sondern nach einem kleinen Kreis
              # *um* Ziffer und Minutenmarke herum: LVGL zeichnet den Schatten
              # als weichgezeichnete Kontur der Box, und bei einer 34-px-Box
              # mit 40 px Weichzeichnung bleibt davon ein Ring uebrig.
              # Hervorgehoben wird jetzt das Element selbst - Akzentfarbe,
              # volle Deckkraft und beim Strich zusaetzlich mehr Laenge und
              # Staerke (siehe dial_active und update_dial).

              # --- 60 feste Striche (erzeugt, siehe Kopfkommentar) ---
              - line: {id: dial_t00, styles: [dial_st_h], x: 0, y: -218, width: 1, height: 16, points: [[0, 16], [0, 0]]}
