    # ---------------------------------------------------- Standby: Gesicht
    # Dritte, ueber sel_standby_page waehlbare Standby-Seite und Umsetzung des
    # Designs "Animierter Charakter rundes Display" (Device Face.dc.html).
    #
    # Sie ist die einzige Standby-Seite, die auch waehrend eines Sprachvorgangs
    # vorne liegt: ist das Gesicht gewaehlt, ersetzt es Mikrofon-Icon, Punkte
    # und Balken - also genau die drei animierten Phasen. Wer stattdessen Uhr
    # oder Zifferblatt gewaehlt hat, bekommt unveraendert die bisherigen
    # Animationen auf page_main. Entschieden wird das in wake_display.
    #
    # Alle uebrigen Zustaende bleiben auch im Gesichtsmodus bei page_main:
    # Messwert, Haken, Fehler, stumm, nicht bereit, klingelnder Timer und der
    # Hinweis von aussen tragen Information und sind keine Animation, fuer die
    # das Mockup eine Entsprechung haette.
    #
    # Hier stehen nur die Ruhezustaende - Groesse, Position und Sichtbarkeit
    # schreibt der `interval: ${face_step_time}` am Dateiende. Die Reihenfolge
    # ist Z-Ordnung: die Zunge liegt unter dem Mund, damit dessen Rechteck ihre
    # oberen Ecken verdeckt.
    - id: page_face
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        - obj:
            id: face_tongue
            align: CENTER
            x: 0
            y: ${face_tongue_dy}
            width: ${face_tongue_w}
            height: ${face_tongue_h}
            radius: 20
            bg_color: ${color_face}
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            clickable: false
            shadow_width: ${face_glow}
            shadow_spread: 0
            shadow_color: ${color_face}
            shadow_opa: ${face_glow_opa}
            hidden: true

        - obj:
            id: face_mouth
            align: CENTER
            x: 0
            y: ${face_mouth_dy}
            width: ${face_mouth_w}
            height: ${face_mouth_h}
            radius: ${face_mouth_radius}
            bg_color: ${color_face}
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            clickable: false
            shadow_width: ${face_glow}
            shadow_spread: 0
            shadow_color: ${color_face}
            shadow_opa: ${face_glow_opa}

        - obj:
            id: face_eye_l
            align: CENTER
            x: -${face_eye_dx}
            y: -${face_eye_dy}
            width: ${face_eye_w}
            height: ${face_eye_h}
            radius: ${face_eye_radius}
            bg_color: ${color_face}
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            clickable: false
            shadow_width: ${face_glow}
            shadow_spread: 0
            shadow_color: ${color_face}
            shadow_opa: ${face_glow_opa}
        - obj:
            id: face_eye_r
            align: CENTER
            x: ${face_eye_dx}
            y: -${face_eye_dy}
            width: ${face_eye_w}
            height: ${face_eye_h}
            radius: ${face_eye_radius}
            bg_color: ${color_face}
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            clickable: false
            shadow_width: ${face_glow}
            shadow_spread: 0
            shadow_color: ${color_face}
            shadow_opa: ${face_glow_opa}

    # ------------------------------------------------------ Bildschirm aus
    # Leere schwarze Seite - der Standby-Zustand des Geraets. Sie ist der
    # zweite Teil des Ausschaltens: die Helligkeit allein genuegt nicht, weil
    # das Dimm-Register des CO5300 bei 0 nur die kleinste Stufe meint und nicht
    # garantiert "aus" - eine helle Uhr koennte dabei noch schwach glimmen. Auf
    # AMOLED ist Schwarz dagegen echtes Pixel-aus, also zeigt sleep_display
    # beides zusammen: Helligkeit 0 *und* eine Seite ohne ein einziges Widget.
    #
    # Das ist zugleich der Ersatz fuer den frueheren Pixel-Shift: was nicht
    # leuchtet, brennt auch nicht ein.
    - id: page_off
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false

globals:
  # Zaehlt Beruehrungen innerhalb des laufenden ${double_tap_window}-Fensters.
  # Gelesen und zurueckgesetzt von detect_tap, siehe dort.
  - id: tap_count
    type: int
    restore_value: false
    initial_value: "0"

  # Ein Hinweis von aussen steht an (API-Aktion zeige_hinweis in
  # packages/core.yaml). Nur update_ui und show_hint fassen ihn an.
  - id: hint_active
    type: bool
    restore_value: false
    initial_value: "false"

  # Der Hinweis kam ohne brauchbaren Iconnamen - dann steht nur der Text da.
  # Gesetzt von show_hint, gelesen von update_ui, das den Hinweis nach einem
  # Sprachvorgang wieder aufbaut und dabei sonst beide Widgets zeigte.
  - id: hint_text_only
    type: bool
    restore_value: false
    initial_value: "false"

  # Zwischenstand des ausblendenden Timer-Rings (ring_fade_out). Als Globals
  # und nicht als static im Lambda, weil das Skript ueber mehrere Durchlaeufe
  # eines repeat: laeuft und mode: restart jederzeit neu ansetzen kann.
  - id: ring_fade_from
    type: int
    restore_value: false
    initial_value: "0"
  - id: ring_fade_step
    type: int
    restore_value: false
    initial_value: "0"

script:
  # ---------------------------------------------------------- Hinweis zeigen
  # Gegenstueck zur optionalen API-Aktion zeige_hinweis. Fuer den normalen
  # Betrieb spielt das Skript keine Rolle - ohne einen Aufruf aus Home
  # Assistant laeuft es nie.
  #
  # Die eigentliche Anzeige macht update_ui; hier stehen nur Text, Merker und
  # Standzeit. Dadurch gewinnt ein Sprachvorgang automatisch: er setzt die
  # Phase und ruft update_ui, das den Hinweis dann zurueckstellt.
  - id: show_hint
    mode: restart
    parameters:
      icon: string
      nachricht: string
      sekunden: int
    then:
      - lambda: |-
          // icon ist ein *Name* aus der Liste unten, nicht "mdi:irgendwas".
          // Material Design Icons gibt es auf dem Geraet nicht, und der Font
          // traegt nur die sieben eingebetteten Glyphen - alles andere ergab
          // bisher das leere Kaestchen des Fonts. Unbekannte Namen zeigen
          // deshalb gar kein Icon, nur den Text.
          //
          // Ein roher Codepoint funktioniert weiterhin (alles, was ein Byte
          // >= 0x80 enthaelt, geht unveraendert durch) - dann muss der Glyph
          // aber in font_icon eingebettet sein.
          struct Eintrag { const char *name; const char *glyph; };
          static const Eintrag ICONS[] = {
              {"mikrofon", "\U0000E31D"}, {"stumm", "\U0000E02B"},
              {"warnung",  "\U0000F083"}, {"offline", "\U0000E648"},
              {"frage",    "\U0000EB8B"}, {"haken",   "\U0000E668"},
              {"glocke",   "\U0000E7F7"}};

          std::string name = icon;
          for (char &c : name)
            if (c >= 'A' && c <= 'Z') c += 32;

          const char *glyph = nullptr;
          for (const Eintrag &e : ICONS)
            if (name == e.name) { glyph = e.glyph; break; }
          if (glyph == nullptr)
            for (unsigned char c : name)
              if (c >= 0x80) { glyph = icon.c_str(); break; }

          if (glyph != nullptr) {
            lv_label_set_text(id(lbl_hint_icon), glyph);
            lv_obj_remove_flag(id(lbl_hint_icon), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_label_set_text(id(lbl_hint_icon), "");
            lv_obj_add_flag(id(lbl_hint_icon), LV_OBJ_FLAG_HIDDEN);
          }
          // Wie die ergebnis-Zeile in voice.yaml: ohne sie ist nicht zu
          // unterscheiden, ob der Name nicht erkannt wurde oder die Anzeige
          // klemmt - und diese Frage kostet sonst eine Runde aus Compile
          // und OTA.
          ESP_LOGI("hinweis", "icon='%s' -> %s", icon.c_str(),
                   glyph == nullptr ? "kein Glyph" : "erkannt");
          id(hint_text_only) = (glyph == nullptr);
          lv_label_set_text(id(lbl_hint_text), nachricht.c_str());
          id(hint_active) = true;
      - script.execute: update_ui
      # Ohne sinnvolle Angabe zehn Sekunden - lange genug zum Lesen, kurz genug,
      # dass ein vergessener Aufruf das Display nicht dauerhaft belegt.
      # Als Block, weil das " : " des Fragezeichenoperators in einer YAML-Zeile
      # als Zuordnung gelesen wuerde.
      - delay: !lambda |-
          return (sekunden > 0 ? sekunden : 10) * 1000;
      - lambda: id(hint_active) = false;
      - script.execute: update_ui

  # --------------------------------------------------- Statusanzeige updaten
  - id: update_ui
    mode: restart
    then:
      # Genau eine Gruppe in der Mitte je Phase: Verarbeitung -> drei Punkte,
      # Sprachausgabe -> fuenf Balken, Messwert -> Zahl und Einheit, alles
      # andere -> ein Statusicon. Erst alles aus, dann eine Gruppe an; das
      # laeuft synchron in einem Durchgang, also ohne Flackern.
      #
      # Das steht als ein Lambda statt als Kaskade aus lvgl.widget.show/hide:
      # mit sechs Faellen waere die YAML-Verschachtelung sechs Ebenen tief
      # gewesen. lv_obj_add_flag/lv_obj_remove_flag ist genau das, was der
      # Codegen aus lvgl.widget.hide/show ohnehin erzeugt
      # (lvgl/widgets/__init__.py:317).
      #
      # Text auf page_main gibt es seit dem Design-Handoff nicht mehr - der
      # Antworttext bleibt nur als text_sensor in HA verfuegbar. Zahl und
      # Einheit eines Messwerts sind die eine bewusste Ausnahme davon.
      - lambda: |-
          lv_obj_t *const alle[] = {
              id(lbl_icon), id(dot_1), id(dot_2), id(dot_3),
              id(bar_1), id(bar_2), id(bar_3), id(bar_4), id(bar_5),
              id(box_result), id(box_weather),
              id(lbl_hint_icon), id(lbl_hint_text)};
          for (lv_obj_t *w : alle)
            lv_obj_add_flag(w, LV_OBJ_FLAG_HIDDEN);

          // Ein Hinweis von aussen (API-Aktion zeige_hinweis) belegt die
          // Anzeige nur, solange nichts Wichtigeres los ist. Faengt ein
          // Sprachvorgang an, tritt er zurueck und kommt danach von selbst
          // wieder - sein Skript laeuft im Hintergrund weiter und raeumt am
          // Ende auf.
          if (id(hint_active) &&
              (id(voice_assistant_phase) == ${phase_idle} ||
               id(voice_assistant_phase) == ${phase_muted})) {
            // Ohne erkanntes Icon bleibt es beim Text - siehe show_hint.
            if (!id(hint_text_only))
              lv_obj_remove_flag(id(lbl_hint_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(lbl_hint_text), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          // Glyph und Farbe des Statusicons. Seit dem Wegfall des Rings traegt
          // das Icon die Farbcodierung; Farben und Phasen sind beide feste
          // Substitutions aus common-substitutions.yaml.
          const char *glyph = nullptr;
          int farbe = ${color_text_dim};

          switch (id(voice_assistant_phase)) {
            case ${phase_thinking}:
              lv_obj_remove_flag(id(dot_1), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(dot_2), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(dot_3), LV_OBJ_FLAG_HIDDEN);
              break;

            case ${phase_replying}:
              lv_obj_remove_flag(id(bar_1), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(bar_2), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(bar_3), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(bar_4), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(bar_5), LV_OBJ_FLAG_HIDDEN);
              break;

            case ${phase_result}:
              if (id(result_kind) == 1) {
                // Zahl (schon auf eine Nachkommastelle gerundet) und Einheit
                // (schon grossgeschrieben) kommen fertig aus on_tts_start in
                // packages/voice.yaml - hier wird nur noch gesetzt und
                // gezeigt. Kein Icon mehr zur Einheit: das Design "Rundes
                // Display Konzepte" traegt die Messwertanzeige allein ueber
                // Zahl, Trennlinie und Einheitstext.
                lv_label_set_text(id(lbl_value), id(result_value).c_str());
                lv_label_set_text(id(lbl_unit), id(result_unit).c_str());
                lv_obj_remove_flag(id(box_result), LV_OBJ_FLAG_HIDDEN);
              } else if (id(result_kind) == 3) {
                // Wetter auf Nachfrage (zeige_wetter -> stage_weather). Icon,
                // Zahl und Einheit kommen fertig aus stage_weather in
                // packages/voice.yaml - hier wird nur noch gesetzt und
                // gezeigt, wie beim Messwert oben.
                lv_label_set_text(id(lbl_weather_icon),
                                   id(weather_icon_glyph).c_str());
                lv_label_set_text(id(lbl_weather_value),
                                   id(result_value).c_str());
                lv_label_set_text(id(lbl_weather_unit),
                                   id(result_unit).c_str());
                lv_obj_remove_flag(id(box_weather), LV_OBJ_FLAG_HIDDEN);
              } else {
                glyph = "\U0000E668";  // check
                farbe = ${color_result};
              }
              break;

            case ${phase_timer_ringing}:
              glyph = "\U0000E7F7";  // notifications_active
              farbe = ${color_timer};
              break;

            case ${phase_listening}:
              // Ohne vorangegangenes Wake Word ist das die Antwort auf eine
              // Rueckfrage von Home Assistant - das Fragezeichen macht
              // sichtbar, dass das Geraet auf eine Antwort wartet und nicht
              // auf einen neuen Befehl. Beide Glyphen atmen (interval: am
              // Dateiende).
              glyph = id(is_followup) ? "\U0000EB8B" : "\U0000E31D";
              farbe = ${color_listening};
              break;

            case ${phase_error}:
              // Drei sehr verschiedene Lagen, die frueher alle gleich rot
              // aussahen: nicht verstanden, Home Assistant nicht erreichbar,
              // echter Fehler.
              if (id(error_kind) == 1) {
                glyph = "\U0000EB8B";  // question_mark
                farbe = ${color_thinking};
              } else if (id(error_kind) == 2) {
                glyph = "\U0000E648";  // wifi_off
                farbe = ${color_text_dim};
              } else {
                glyph = "\U0000F083";  // warning
                farbe = ${color_error};
              }
              break;

            case ${phase_muted}:
              glyph = "\U0000E02B";  // mic_off
              break;

            case ${phase_not_ready}:
              glyph = "\U0000E648";  // wifi_off
              break;

            default:
              // phase_idle: nichts in der Mitte, es geht ohnehin in den Standby
              break;
          }

          if (glyph != nullptr) {
            lv_label_set_text(id(lbl_icon), glyph);
            lv_obj_set_style_text_color(
                id(lbl_icon), lv_color_hex((uint32_t) farbe), LV_PART_MAIN);
            lv_obj_remove_flag(id(lbl_icon), LV_OBJ_FLAG_HIDDEN);
          }

          // Gegenstueck zur Logzeile in on_tts_start (packages/voice.yaml):
          // dort steht, was erkannt wurde, hier, was daraus auf dem Schirm
          // wurde. Erst beides zusammen trennt "falsch erkannt" von "nicht
          // angezeigt" - ohne das kostet die Unterscheidung eine Runde aus
          // Compile und OTA.
          ESP_LOGI("anzeige",
                   "phase=%d art=%d wert_sichtbar=%d wetter_sichtbar=%d icon_sichtbar=%d",
                   id(voice_assistant_phase), id(result_kind),
                   !lv_obj_has_flag(id(box_result), LV_OBJ_FLAG_HIDDEN),
                   !lv_obj_has_flag(id(box_weather), LV_OBJ_FLAG_HIDDEN),
                   !lv_obj_has_flag(id(lbl_icon), LV_OBJ_FLAG_HIDDEN));

      # Im Leerlauf gibt es nichts anzuzeigen -> Standby-Seite (Uhr,
      # Zifferblatt oder Gesicht, je nach sel_standby_page), nicht sofort aus.
      # Bis hierhin ging update_ui beim Wechsel nach phase_idle direkt in
      # sleep_display: nach einer Bestaetigung oder dem Ende der Sprachausgabe
      # wurde das Display schwarz, bevor sich etwa das Gesicht sichtbar wieder
      # in seinen wartenden Ausdruck haette zuruecknehmen koennen (der Takt in
      # der Animationsschleife unten hatte die Farbe zwar schon zurueckgesetzt
      # - man hat es nur nie gesehen). Jetzt zeigt es wie ein Tippen auf den
      # dunklen Bildschirm zunaechst die Standby-Seite bei
      # num_standby_brightness und faellt erst nach num_standby_timeout ueber
      # standby_return in sleep_display. Das gilt fuer jeden Uebergang nach
      # phase_idle - auch nach einem Abbruch per Antippen, nach einer
      # Fehleranzeige und beim Hochfahren, wo das Display bis hierhin sofort
      # dunkel blieb.
      #
      # Alles andere weckt das Display, ein anstehender Hinweis eingeschlossen -
      # sonst schoebe sleep_display die Standby-Seite darueber.
      - if:
          condition:
            lambda: |-
              return id(voice_assistant_phase) == ${phase_idle}
                  && !id(hint_active);
          then:
            - script.execute: show_standby_page
            - light.turn_on:
                id: display_level
                brightness: !lambda "return id(num_standby_brightness).state / 100.0f;"
            - light.turn_on: display_brightness
            - script.execute: standby_return
          else:
            - script.execute: wake_display

  # Antippen hat je nach Zustand vier Bedeutungen:
  #
  # - Auf der Konfigurationsseite fuehrt es zurueck (update_ui waehlt die
  #   richtige Seite, Standby oder Hauptseite); die Helligkeit setzt danach der
  #   passende Zweig unten - wer gerade tippt, will nicht ins Dunkle zurueck.
  # - Waehrend Zuhoeren, Verarbeitung oder Sprachausgabe bricht es den Vorgang
  #   ab (abort_session in packages/voice.yaml). Das Display ist in diesen
  #   Phasen ohnehin schon wach, ein wake_display waere ueberfluessig -
  #   abort_session endet selbst mit update_ui und damit im Standby-Zweig.
  # - Zeigt der Bildschirm schon eine Standby-Seite (Uhr, Zifferblatt,
  #   wartendes Gesicht), schaltet ein weiteres Tippen ihn aus (sleep_display)
  #   statt nur die Helligkeit neu zu setzen - ein Nutzer, der den schon
  #   sichtbaren Bildschirm antippt, will ihn in aller Regel loswerden, nicht
  #   ihn ein zweites Mal wecken. Das war frueher gar nicht vorgesehen: bis
  #   hierhin weckte jedes Tippen im Leerlauf/stumm nur, ohne Weg zurueck
  #   außer der automatischen Standby-Zeit. Ein anstehender Hinweis
  #   (hint_active, liegt auf page_main statt einer Standby-Seite) ist davon
  #   ausgenommen - der soll seine volle Anzeigezeit behalten, nicht durch ein
  #   Antippen vorzeitig verschwinden.
  # - Sonst (Bildschirm aus, page_off) weckt es nur das Display und holt die
  #   Standby-Seite zurueck, Helligkeit num_standby_brightness. Einen eigenen
  #   Ruecksprung-Timer braucht das nicht: die Beruehrung hat LVGLs
  #   Untaetigkeitszaehler zurueckgesetzt, on_idle oben faellt nach
  #   num_standby_timeout von selbst wieder in sleep_display.
  #
  # Fehler und "nicht bereit" sind bewusst nicht abbrechbar: da laeuft nichts,
  # was man abbrechen koennte, und clear_error raeumt von selbst auf.
  - id: on_screen_touch
    mode: restart
    then:
      - if:
          # Ein klingelnder Timer hat Vorrang vor allem anderen: wer den
          # Bildschirm anfasst, waehrend es klingelt, will genau eins. Das
          # Skript raeumt Ton, Phase und Anzeige selbst auf, deshalb endet der
          # Zweig hier.
          #
          # Home Assistant muss dafuer nichts tun - die Komponente loescht den
          # abgelaufenen Timer schon beim Ausloesen von on_timer_finished
          # (voice_assistant.cpp:1030), fuer HA ist er also erledigt. Es bleibt
          # nur der lokale Ton.
          condition:
            lambda: return id(timer_ringing);
          then:
            - script.execute: timer_stop_ringing
          else:
            - if:
                condition:
                  lambda: |-
                    return id(voice_assistant_phase) == ${phase_listening}
                        || id(voice_assistant_phase) == ${phase_thinking}
                        || id(voice_assistant_phase) == ${phase_replying};
                then:
                  - script.execute: abort_session
                else:
                  - if:
                      condition:
                        lambda: |-
                          return id(voice_assistant_phase) == ${phase_idle}
                              || id(voice_assistant_phase) == ${phase_muted};
                      then:
                        - if:
                            # War der Bildschirm schon aus, liegt page_off vorne
                            # und traegt nichts - wecken statt ausschalten.
                            condition:
                              lvgl.page.is_showing: page_off
                            then:
                              # Wer tippt, will hinsehen: ein laufender
                              # Rueckfall aus Home Assistant faellt weg. Ab
                              # hier zaehlt wieder on_idle, das die Beruehrung
                              # gerade zurueckgesetzt hat - der Bildschirm geht
                              # also num_standby_timeout nach dieser
                              # Beruehrung von selbst wieder aus.
                              - script.stop: standby_return
                              - script.execute: show_standby_page
                              # Warten, nicht zuhoeren: num_standby_brightness
                              # genuegt (packages/settings.yaml). Die
                              # Displayhelligkeit gibt es erst, wenn ein Wake
                              # Word den Vorgang startet - dann hellt
                              # wake_display auf. display_level ist die
                              # physische Dimmung, display_brightness nur die
                              # Ein/Aus-Sicht fuer Home Assistant
                              # (packages/hardware.yaml).
                              - light.turn_on:
                                  id: display_level
                                  brightness: !lambda "return id(num_standby_brightness).state / 100.0f;"
                              - light.turn_on: display_brightness
                            else:
                              # Zeigt schon eine Standby-Seite - ein weiteres
                              # Tippen schaltet aus, ausser waehrend eines
                              # anstehenden Hinweises (siehe Begruendung oben).
                              - if:
                                  condition:
                                    lambda: return !id(hint_active);
                                  then:
                                    - script.execute: sleep_display
                      else:
                        - script.execute: wake_display

  # ------------------------------------------------- Tipp / Doppeltipp an HA
  # Gestartet vom on_touch des Touchscreens (packages/hardware.yaml), parallel
  # zu on_screen_touch - das eine reagiert sofort (wecken/abbrechen), das hier
  # meldet erst nach ${double_tap_window} ohne weitere Beruehrung, was daraus
  # geworden ist. Genau das ist der Grund fuer den eigenen Takt statt eines
  # einfachen Zaehlers in on_screen_touch: ein einzelner Tipp darf erst dann
  # als "einfach" gelten, wenn das Fenster fuer einen zweiten verstrichen ist.
  #
  # mode: restart macht die Erkennung selbst: ein zweiter Touch innerhalb des
  # Fensters bricht den wartenden Durchlauf ab und startet neu, zaehlt dabei
  # aber weiter hoch (das Global ueberlebt den Abbruch, nur der delay wird neu
  # aufgesetzt). Bleibt es beim einen Tipp, laeuft das Fenster ab und meldet
  # "single_press"; folgt ein zweiter, steht beim Ablauf tap_count auf 2 und
  # es wird "double_press". Ein dritter/vierter Tipp waehrend desselben
  # Fensters zaehlt weiter hoch, wird aber ebenfalls nur als Doppeltipp
  # gemeldet - fuer mehr als zwei kennt evt_display_touch keinen eigenen Typ.
  #
  # Erkannt wird nur im Wartezustand (idle/muted). Waehrend eines
  # Sprachvorgangs bedeutet Tippen "abbrechen" (on_screen_touch) - dieselbe
  # Beruehrung soll dann nicht zusaetzlich als Klick-Event an HA gehen. Die
  # Pruefung sitzt bewusst nur am Anfang, nicht auch nach dem delay: die Phase
  # gilt fuer den Moment der Beruehrung, ein Wake Word waehrend des Wartens
  # soll ein bereits gezaehltes single_press nicht mehr unterdruecken.
  #
  # Das gilt ausdruecklich auch im echten Standby (Bildschirm aus, page_off):
  # die Pruefung haengt an der Phase, nicht an der gezeigten Seite, und dort
  # steht die Phase weiterhin auf idle. Der erste Tipp weckt dabei ganz normal
  # ueber on_screen_touch den Bildschirm (das laeuft synchron vor detect_tap),
  # zaehlt aber trotzdem mit - ein zweiter Tipp im selben Fenster ergibt also
  # double_press, nicht zwei einzelne single_press.
  - id: detect_tap
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(voice_assistant_phase) == ${phase_idle}
                  || id(voice_assistant_phase) == ${phase_muted};
          then:
            - lambda: id(tap_count)++;
            - delay: ${double_tap_window}
            - lambda: |-
                const bool doppelt = id(tap_count) > 1;
                id(tap_count) = 0;
                id(evt_display_touch).trigger(doppelt ? "double_press"
                                                       : "single_press");

  # ------------------------------------------------------- Display aufwecken
  #
  # Jede hier aufgeweckte Phase (Zuhoeren, Verarbeitung, Antwort, Fehler,
  # Hinweis, klingelnder Timer) laeuft auf derselben Helligkeit:
  # num_display_brightness ("Displayhelligkeit", packages/settings.yaml). Der
  # Sprung von der Standby-Helligkeit auf diesen Wert ist selbst Teil der
  # Rueckmeldung - er faellt aus dem Augenwinkel auf, noch bevor Mikrofon-Icon
  # oder Gesicht gelesen sind.
  #
  # Das war einmal anders und ist der Kern eines gemeldeten Fehlers gewesen:
  # nur das Zuhoeren lag fest auf 100 % (Substitution active_brightness,
  # nicht per HA einstellbar), jede andere hier aufgeweckte Phase fiel mangels
  # eigener Einstellung auf num_standby_brightness zurueck - der Bildschirm
  # wurde beim Denken sichtbar duenkler, obwohl er die ganze Zeit wach war.
  # num_display_brightness deckt jetzt alle diese Phasen einheitlich ab.
  #
  # display_level ist die physische Dimmung, display_brightness nur die
  # Ein/Aus-Sicht fuer Home Assistant (packages/hardware.yaml) - deshalb immer
  # beide Lichter anfassen.
  #
  # Hier faellt ausserdem die eine Entscheidung des Gesichtsmodus: Welche Seite traegt die
  # laufende Phase - page_main mit Icon/Punkten/Balken oder page_face?
  #
  # Sie steht bewusst *nicht* in update_ui. update_ui fuellt die Widgets von
  # page_main und weiss nichts von Seiten; wake_display ist ohnehin die einzige
  # Stelle, die page_main vorlegt, und wird von update_ui und von
  # on_screen_touch gleichermassen gerufen. Damit gibt es genau einen Ort, an
  # dem die Auswahl haengt.
  #
  # Das Gesicht bekommt die drei animierten Phasen plus eine vierte
  # Ausnahme: eine Bestaetigung (result_kind == 2). Statt auf page_main
  # umzuschalten und dort den Haken zu zeigen, bleibt das Gesicht vorne und
  # faerbt sich stattdessen gruen (siehe der `if (phase != last_phase)`-Zweig
  # im Animations-Takt unten). Ein Messwert (result_kind == 1) ist davon
  # ausdruecklich ausgenommen: eine Zahl mit Einheit kennt das Design-Mockup
  # nicht als Miene, die bleibt wie Fehler, stumm, nicht bereit und
  # klingelnder Timer auf page_main. Ein Hinweis von aussen (hint_active)
  # ebenso: seine beiden Widgets liegen auf page_main.
  - id: wake_display
    mode: restart
    then:
      - script.stop: standby_return
      - if:
          condition:
            lambda: |-
              return id(sel_standby_page).active_index().value_or(0) == 2
                  && !id(hint_active)
                  && (id(voice_assistant_phase) == ${phase_listening}
                      || id(voice_assistant_phase) == ${phase_thinking}
                      || id(voice_assistant_phase) == ${phase_replying}
                      || (id(voice_assistant_phase) == ${phase_result}
                          && id(result_kind) == 2));
          then:
            - lvgl.page.show: page_face
          else:
            - lvgl.page.show: page_main
      - light.turn_on:
          id: display_level
          brightness: !lambda "return id(num_display_brightness).state / 100.0f;"
      - light.turn_on: display_brightness

  # --------------------------------------------------- Bildschirm ausschalten
  # Standby heisst aus, nicht gedimmt: die frueheren Substitutions
  # standby_brightness und screen_off_delay gibt es nicht mehr, und mit ihnen
  # auch keine Zwischenstufe. Eine gedimmte Uhr ist auf einem AMOLED der
  # einzige dauerhaft leuchtende Inhalt im ganzen Entwurf - genau das soll im
  # Ruhezustand nicht mehr passieren.
  #
  # Beides zusammen ist noetig: das Dimm-Register des CO5300 meint bei 0 nur
  # die kleinste Stufe und nicht garantiert "aus", eine helle Uhr koennte also
  # noch schwach glimmen. Erst die Seite ohne ein einziges Widget macht den
  # Bildschirm wirklich schwarz.
  #
  # Erst dunkel, dann umschalten: so ist der Seitenwechsel nicht zu sehen.
  - id: sleep_display
    mode: restart
    then:
      - light.turn_off: display_level
      - light.turn_off: display_brightness
      - lvgl.page.show: page_off

  # --------------------------------------- Rueckfall ohne Beruehrung
  # Nur fuer einen Weckweg noetig: das Einschalten der Lichtentity aus Home
  # Assistant (on_turn_on in packages/hardware.yaml). Alle anderen Wege gehen
  # ueber den Touchscreen, und der setzt LVGLs Untaetigkeitszaehler zurueck -
  # dort holt on_idle den Bildschirm nach num_standby_timeout von selbst
  # wieder ab (packages/settings.yaml, ersetzt die fruehere Substitution
  # standby_timeout).
  #
  # Ein zweites on_idle waere der naheliegende Weg und ist falsch: der Trigger
  # misst reine Touch-Untaetigkeit und feuert je Untaetigkeitsphase genau
  # einmal (IdleTrigger::is_idle_ in lvgl_esphome.cpp:429). Ohne Beruehrung
  # steht der Zaehler laengst ueber der Schwelle, der Trigger kaeme also nie
  # wieder - der Bildschirm bliebe bis zur naechsten Beruehrung an.
  #
  # `mode: restart` ist Pflicht (delay in einem Skript), und jeder Weg, der das
  # Display absichtlich wach haelt, muss es stoppen - sonst faellt der
  # Bildschirm mitten im Hinschauen ins Dunkle. Das sind wake_display und der
  # Idle-Zweig von on_screen_touch.
  - id: standby_return
    mode: restart
    then:
      - delay: !lambda "return (uint32_t) id(num_standby_timeout).state * 1000;"
      - script.execute: sleep_display

  # Welche Standby-Seite gezeigt wird, entscheidet sel_standby_page aus
  # packages/settings.yaml, und zwar ueber den Index: 0 Uhr, 1 Zifferblatt,
  # 2 Gesicht. Wer eine weitere hinzufuegt, muss drei Stellen anfassen: eine
  # Option am *Ende* von sel_standby_page, einen Zweig hier und - sofern die
  # Seite Zeit anzeigt - die is_showing-Bedingung des Minutentakts in
  # packages/core.yaml.
  #
  # Ein laufender Timer sticht die Auswahl aus: dann ist immer page_standby
  # dran, weil nur sie den Countdown traegt. Das Zifferblatt kann ihn nicht
  # zeigen (die Ziffern staenden mitten im Kranz, deshalb blieb dort bewusst
  # nur der Ring am Rand), und das Gesicht schon gar nicht. Von beiden ist der
  # Ring allein aber zu wenig: er sagt "noch ein Rest", nicht wie lang.
  #
  # Der Inhalt wird jeweils *vor* dem Seitenwechsel aufgefrischt, damit keine
  # veraltete Uhrzeit aufblitzt. Das Gesicht braucht das nicht: es zeigt keine
  # Zeit, und sein Takt laeuft von selbst an, sobald die Seite vorne liegt.
  - id: show_standby_page
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(sel_standby_page).active_index().value_or(0) == 1
                  && !id(timer_active);
          then:
            - script.execute: update_dial
            - lvgl.page.show: page_dial
          else:
            - if:
                condition:
                  lambda: |-
                    return id(sel_standby_page).active_index().value_or(0) == 2
                        && !id(timer_active);
                then:
                  - lvgl.page.show: page_face
                else:
                  - script.execute: update_clock
                  - lvgl.page.show: page_standby
      # Erst nach dem Seitenwechsel: update_timer_ui schreibt den Countdown nur,
      # wenn die Standby-Seite auch wirklich vorne liegt. Der Aufruf raeumt
      # ausserdem auf, wenn der letzte Timer ablief, waehrend eine andere Seite
      # sichtbar war - dann steht lbl_clock noch auf versteckt. Auf dem
      # Zifferblatt bleibt vom Timer nur der Ring im top_layer; einen Countdown
      # gibt es dort bewusst nicht, er wuerde mitten im Kranz stehen.
      - script.execute: update_timer_ui

  # ------------------------------------------------------------- Timer-Anzeige
  # Aufgerufen aus allen fuenf on_timer_*-Triggern (packages/voice.yaml), im
  # laufenden Betrieb also einmal pro Sekunde. Zwei Dinge haengen daran:
  #
  #   - der Ring im top_layer, sichtbar auf jeder Seite
  #   - der Countdown auf der Standby-Seite, der dort die Uhr ersetzt
  #
  # Bewusst *keine* Farbzuweisung und keine Deckkraftrechnung pro Durchlauf -
  # der Ring soll genau eine Sache pro Sekunde tun: seinen Wert aendern. Die
  # frueheren Ringe sind daran gescheitert, pro Frame den ganzen Kranz neu zu
  # mischen; hier ist es ein Bruchteil eines Grades pro Sekunde.
  - id: update_timer_ui
    mode: restart
    then:
      # Ein Timer aendert, welche Standby-Seite die richtige ist: nur
      # page_standby traegt den Countdown (siehe show_standby_page). Liegt
      # gerade Zifferblatt oder Gesicht vorne, wird hier umgeschaltet - und
      # beim letzten Timer wieder zurueck.
      #
      # Beide Zweige machen den Seitenwechsel selbst, statt show_standby_page
      # zu rufen: das Skript endet mit einem Aufruf von update_timer_ui, und
      # ein `mode: restart`-Skript, das sich selbst neu startet, wuerde sich
      # mitten im eigenen Durchlauf abschiessen.
      #
      # Die Phasenpruefung ist der Grund, warum das nicht einfach jede Sekunde
      # blind laeuft: page_face traegt im Gesichtsmodus auch Zuhoeren,
      # Verarbeitung und Sprachausgabe. Waehrend eines Sprachvorgangs bleibt
      # das Gesicht also stehen; der Countdown kommt erst, wenn er vorbei ist.
      # Der Bildschirm im Standby (page_off) bleibt in beiden Zweigen aussen
      # vor - er soll dunkel bleiben, nicht wegen eines Timers angehen.
      - if:
          condition:
            and:
              - lambda: |-
                  return id(voice_assistant_phase) == ${phase_idle}
                      || id(voice_assistant_phase) == ${phase_muted};
              - or:
                  - lvgl.page.is_showing: page_dial
                  - lvgl.page.is_showing: page_face
              - lambda: return id(timer_active);
          then:
            - script.execute: update_clock
            - lvgl.page.show: page_standby
      - if:
          condition:
            and:
              - lambda: |-
                  return !id(timer_active)
                      && id(sel_standby_page).active_index().value_or(0) != 0;
              - lvgl.page.is_showing: page_standby
          then:
            - if:
                condition:
                  lambda: return id(sel_standby_page).active_index().value_or(0) == 1;
                then:
                  - script.execute: update_dial
                  - lvgl.page.show: page_dial
                else:
                  - lvgl.page.show: page_face

      - if:
          condition:
            lambda: return id(timer_active) && id(timer_total) > 0;
          then:
            # Ein neuer Timer bricht ein laufendes Ausblenden ab; die Deckkraft
            # setzt das Lambda darunter wieder zurueck, sonst bliebe der Ring
            # auf dem Stand, auf dem ring_fade_out ihn verlassen hat.
            - script.stop: ring_fade_out
            - lambda: |-
                int32_t wert = (int32_t) (1000.0f * (float) id(timer_left) /
                                          (float) id(timer_total));
                if (wert < 0) wert = 0;
                if (wert > 1000) wert = 1000;
                lv_arc_set_value(id(ring_timer), wert);
                lv_obj_set_style_arc_opa(id(ring_timer), LV_OPA_COVER,
                                         LV_PART_INDICATOR);
                lv_obj_remove_flag(id(ring_timer), LV_OBJ_FLAG_HIDDEN);
                // lv_arc_set_value invalidiert nur die Flaeche zwischen altem
                // und neuem Winkel (inv_arc_area in lv_arc.c). Deren
                // Quadrant-Aufteilung (lv_draw_arc_get_area, alle 90 Grad)
                // lässt an genau diesen Grenzen - hier bei Wert 500, also
                // 6-Uhr-Position - ein bis zwei Pixel der alten Fuellung
                // stehen. Volles Invalidieren kostet hier nichts: der Wert
                // aendert sich nur einmal pro Sekunde, nicht 25 Mal.
                lv_obj_invalidate(id(ring_timer));
          else:
            # Der Ring verschwand bisher von einem Bild aufs naechste - beim
            # Abbrechen eines Timers wirkte das wie ein Anzeigefehler. Jetzt
            # laeuft er auf null und blendet dabei aus.
            - if:
                condition:
                  lambda: |-
                    return !lv_obj_has_flag(id(ring_timer), LV_OBJ_FLAG_HIDDEN)
                        && !id(ring_fade_out).is_running();
                then:
                  - script.execute: ring_fade_out

      # Der Countdown steht nur auf der Standby-Seite. Auf der Hauptseite
      # gehoert die Mitte der laufenden Phase, auf der Konfigurationsseite dem
      # QR-Code - dort waere er nur im Weg. Die Pruefung laeuft ueber die
      # LVGL-Bedingung statt ueber ein Lambda, weil Seiten hier echte Screens
      # sind (lv_screen_load_anim) und nicht ueber ein Hidden-Flag geschaltet
      # werden.
      - if:
          condition:
            lvgl.page.is_showing: page_standby
          then:
            - lambda: |-
                lv_obj_t *const teile[3] = {id(lbl_timer_pre),
                                            id(lbl_timer_colon),
                                            id(lbl_timer_sec)};
                if (id(timer_active)) {
                  const int rest = id(timer_left);
                  const int stunden = rest / 3600;
                  const int minuten = (rest % 3600) / 60;
                  const int sekunden = rest % 60;
                  // Links vom letzten Doppelpunkt steht bei einem langen Timer
                  // "1:23", sonst nur "05". Der letzte Doppelpunkt ist der
                  // Ankerpunkt in der Bildschirmmitte.
                  const std::string vorn =
                      stunden > 0
                          ? esphome::str_sprintf("%d:%02d", stunden, minuten)
                          : esphome::str_sprintf("%02d", minuten);
                  lv_label_set_text(id(lbl_timer_pre), vorn.c_str());
                  lv_label_set_text(id(lbl_timer_colon), ":");
                  lv_label_set_text(
                      id(lbl_timer_sec),
                      esphome::str_sprintf("%02d", sekunden).c_str());

                  // Mit Stunden waere die linke Box zu breit fuer den runden
                  // Bildschirm - dann wandert die ganze Gruppe nach rechts.
                  //
                  // lv_obj_set_style_x und nicht lv_obj_set_x: der Codegen
                  // legt `x:` als Style-Property an (lv_obj_set_style_x im
                  // generierten main.cpp), und `lvgl.widget.update` schreibt
                  // dorthin zurueck.
                  // Ab zehn Stunden kommt links eine Ziffer dazu, und der
                  // Countdown steht dann nicht mehr sauber im runden Bild.
                  // Ein zweiter Versatz war der naheliegende Versuch und hat
                  // es schlimmer gemacht: die Gruppe rutschte sichtbar aus der
                  // Mitte. Es bleibt bei einem Versatz - Timer ueber zehn
                  // Stunden sind der dokumentierte Grenzfall (README).
                  const int16_t versatz = stunden > 0 ? ${timer_hour_shift} : 0;
                  lv_obj_set_style_x(id(lbl_timer_pre),
                                     -${timer_part_offset} + versatz, LV_PART_MAIN);
                  lv_obj_set_style_x(id(lbl_timer_colon), versatz, LV_PART_MAIN);
                  lv_obj_set_style_x(id(lbl_timer_sec),
                                     ${timer_part_offset} + versatz, LV_PART_MAIN);

                  lv_label_set_text(id(lbl_date), id(timer_name).empty()
                                                      ? "Timer"
                                                      : id(timer_name).c_str());
                  lv_obj_add_flag(id(lbl_clock), LV_OBJ_FLAG_HIDDEN);
                  for (lv_obj_t *w : teile)
                    lv_obj_remove_flag(w, LV_OBJ_FLAG_HIDDEN);
                } else {
                  for (lv_obj_t *w : teile)
                    lv_obj_add_flag(w, LV_OBJ_FLAG_HIDDEN);
                  lv_obj_remove_flag(id(lbl_clock), LV_OBJ_FLAG_HIDDEN);
                }
      # Faellt der letzte Timer weg, brauchen Uhr und Datum wieder ihren
      # eigenen Text - lbl_date trug bis eben den Namen des Timers.
      - if:
          condition:
            lambda: return !id(timer_active);
          then:
            - script.execute: update_clock

  # Ausblenden des Timer-Rings. Der einzige Fall, in dem der Ring animiert
  # wird - und er bleibt damit innerhalb der Grenzen, an denen die frueheren
  # Phasen-Ringe gescheitert sind: er laeuft genau
  # ${ring_fade_steps} * ${ring_fade_step_time} lang und danach nie wieder.
  #
  # Zwei Dinge laufen gleichzeitig: der Wert geht auf null (der Bogen zieht
  # sich zur Zwoelf zurueck) und die Deckkraft mit ihm. Am Ende steht der Ring
  # wieder auf voller Deckkraft, damit der naechste Timer nicht blass anfaengt.
  - id: ring_fade_out
    mode: restart
    then:
      - lambda: |-
          id(ring_fade_from) = lv_arc_get_value(id(ring_timer));
          id(ring_fade_step) = 0;
      - repeat:
          count: ${ring_fade_steps}
          then:
            - lambda: |-
                id(ring_fade_step)++;
                const float f = 1.0f - (float) id(ring_fade_step) /
                                           (float) ${ring_fade_steps};
                lv_arc_set_value(id(ring_timer),
                                 (int32_t) (id(ring_fade_from) * f));
                lv_obj_set_style_arc_opa(id(ring_timer),
                                         (lv_opa_t) (255.0f * f),
                                         LV_PART_INDICATOR);
                // Siehe update_timer_ui: dieselbe Quadranten-Randluecke von
                // lv_arc_set_value, hier bei jedem der 14 Schritte moeglich.
                lv_obj_invalidate(id(ring_timer));
            - delay: ${ring_fade_step_time}
      - lambda: |-
          lv_obj_add_flag(id(ring_timer), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_style_arc_opa(id(ring_timer), LV_OPA_COVER,
                                   LV_PART_INDICATOR);

  # ---------------------------------------------------------------- Uhrzeit
  # Steigt aus, solange ein Timer laeuft: dann gehoeren beide Labels dem
  # Countdown (lbl_date traegt dessen Namen), und der Minutentakt aus
  # packages/core.yaml wuerde sie sonst jede Minute kurz mit Uhrzeit und Datum
  # ueberschreiben, bis update_timer_ui eine Sekunde spaeter zurueckschreibt.
  - id: update_clock
    then:
      - if:
          condition:
            lambda: return !id(timer_active);
          then:
            - lvgl.label.update:
                id: lbl_clock
                text: !lambda |-
                  return id(ha_time).now().is_valid()
                       ? id(ha_time).now().strftime("%H:%M")
                       : std::string("--:--");
            # "Dienstag, 4. August" - strftime kennt nur die C-Locale, also
            # englische Namen. Deshalb von Hand.
            - lvgl.label.update:
                id: lbl_date
                text: !lambda |-
                  static const char *const WOCHENTAG[] = {
                    "Sonntag", "Montag", "Dienstag", "Mittwoch",
                    "Donnerstag", "Freitag", "Samstag"};
                  static const char *const MONAT[] = {
                    "Januar", "Februar", "März", "April", "Mai", "Juni", "Juli",
                    "August", "September", "Oktober", "November", "Dezember"};
                  auto t = id(ha_time).now();
                  if (!t.is_valid())
                    return std::string("");
                  return esphome::str_sprintf("%s, %d. %s",
                                              WOCHENTAG[t.day_of_week - 1],
                                              t.day_of_month,
                                              MONAT[t.month - 1]);

  # ------------------------------------------------------------ Zifferblatt
  # Gegenstueck zu update_clock fuer page_dial. Laeuft beim Betreten des
  # Standbys und danach im Minutentakt aus core.yaml.
  #
  # Es sind genau drei Dinge zu tun: die Minutenmarke auf den gueltigen Strich
  # legen, die Stundenziffer einfaerben und die vorige zuruecksetzen. Die 60
  # festen Striche werden nie angefasst - die laengere Marke deckt den Strich
  # darunter ab.
  #
  # Kein Guard auf die sichtbare Seite: die Aufrufer wissen, wann es sich
  # lohnt, und LVGL verwirft ein lv_obj_invalidate fuer Widgets, die nicht auf
  # dem aktiven Screen liegen, ohnehin.
  - id: update_dial
    mode: restart
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) {
            // Vor der ersten Zeit aus Home Assistant gibt es nichts
            // hervorzuheben. Der Kranz steht, die Marke bleibt weg - eine
            // Marke auf der Zwoelf waere eine Falschaussage.
            lv_obj_add_flag(id(dial_active)->obj, LV_OBJ_FLAG_HIDDEN);
            return;
          }

          static const float BOGEN = 3.14159265f / 180.0f;

          // --- Minutenmarke ---
          // Dieselbe Rechnung wie fuer die festen Striche (Kopfkommentar von
          // page_dial), nur mit Laenge ${dial_mark_len}. Das Punktearray muss
          // LVGL ueberdauern: lv_line_set_points uebernimmt den Zeiger, es
          // kopiert nicht - deshalb static und nicht auf dem Stapel.
          static lv_point_precise_t marke[2];
          const float am = t.minute * 6.0f * BOGEN;
          const float ux = sinf(am), uy = -cosf(am);
          const float hx = 0.5f * ${dial_mark_len} * ux;
          const float hy = 0.5f * ${dial_mark_len} * uy;
          const int32_t bw = (int32_t) lroundf(2.0f * fabsf(hx));
          const int32_t bh = (int32_t) lroundf(2.0f * fabsf(hy));
          marke[0].x = hx > 0 ? 0 : bw;
          marke[0].y = hy > 0 ? 0 : bh;
          marke[1].x = hx > 0 ? bw : 0;
          marke[1].y = hy > 0 ? bh : 0;
          lv_line_set_points(id(dial_active)->obj, marke, 2);
          // Nach set_points, sonst zieht die Inhaltsgroesse die Box wieder auf
          // die Punkte zusammen. Die Mindestgroesse 1 gilt den vier
          // achsparallelen Stellungen (0, 15, 30, 45): eine Box der Breite 0
          // hat eine leere Flaeche und wuerde beim Zeichnen uebersprungen.
          lv_obj_set_size(id(dial_active)->obj, bw > 0 ? bw : 1, bh > 0 ? bh : 1);

          const int32_t mx = (int32_t) lroundf(${dial_radius} * ux);
          const int32_t my = (int32_t) lroundf(${dial_radius} * uy);
          lv_obj_align(id(dial_active)->obj, LV_ALIGN_CENTER, mx, my);
          lv_obj_remove_flag(id(dial_active)->obj, LV_OBJ_FLAG_HIDDEN);

          // --- Stundenziffer ---
          int stunde = t.hour % 12;
          if (stunde == 0) stunde = 12;
          lv_obj_t *const zahlen[12] = {
              id(dial_n01), id(dial_n02), id(dial_n03), id(dial_n04),
              id(dial_n05), id(dial_n06), id(dial_n07), id(dial_n08),
              id(dial_n09), id(dial_n10), id(dial_n11), id(dial_n12)};

          // Die vorige Ziffer bekommt den Kranzstil zurueck. 204 ist das
          // text_opa: 80% aus dial_st_num.
          static int8_t vorige = -1;
          if (vorige >= 1 && vorige <= 12) {
            lv_obj_set_style_text_color(zahlen[vorige - 1],
                                        lv_color_hex(${color_text}), LV_PART_MAIN);
            lv_obj_set_style_text_opa(zahlen[vorige - 1], (lv_opa_t) 204,
                                      LV_PART_MAIN);
          }
          lv_obj_set_style_text_color(
              zahlen[stunde - 1], lv_color_hex(${color_dial}),
              LV_PART_MAIN);
          lv_obj_set_style_text_opa(zahlen[stunde - 1], LV_OPA_COVER,
                                    LV_PART_MAIN);
          vorige = (int8_t) stunde;

  # Der minuetliche Takt fuer Uhr und Zifferblatt haengt am Zeitgeber in
  # core.yaml (`time: ha_time` -> on_time), weil ESPHome Plattform-Listen
  # ueber Package-Grenzen hinweg nicht per id zusammenfuehrt.

# --------------------------------------------- Animation der Verarbeitung
# ESPHome-LVGL hat kein Animations-Primitive fuer eigene Widget-Eigenschaften
# (`lvgl.widget.update` kennt keine Zeitachse), also laeuft die Welle als
# eigener Takt. Ein Schritt schreibt Groesse, Position und Deckkraft aller
# drei Punkte direkt ueber die LVGL-API - ein Lambda statt einer
# YAML-Fallunterscheidung pro Punkt und Schritt.
#
# Die Amplitude ist eine angehobene Kosinuswelle (0..1, Maximum bei p == 0),
# jeder Punkt liegt ein Drittel Zyklus hinter dem vorherigen. Dadurch wandert
# der Buckel von links nach rechts, statt dass die Punkte gemeinsam blinken.
#
# Der Takt laeuft immer, macht aber ausserhalb der Verarbeitung nichts - die
# Punkte sind dann ohnehin versteckt (update_ui).
#
# Der `is_showing`-Guard davor ist seit dem Gesichtsmodus noetig: liegt page_face
# vorne, tragen dieselben Phasen ein Gesicht, und die Punkte auf page_main
# waeren reine Rechenlast auf einer unsichtbaren Seite. Er ist gefahrlos, weil
# das Lambda keinen Zustand zurueckzusetzen hat - anders als beim Mikrofon, das
# darum ohne Guard bleibt.
interval:
  - interval: ${dot_step_time}
    then:
      - if:
          condition:
            lvgl.page.is_showing: page_main
          then:
            - lambda: |-
                if (id(voice_assistant_phase) != ${phase_thinking})
                  return;
                static uint8_t step = 0;
                static const int16_t X[3] = {-${dot_gap}, 0, ${dot_gap}};
                lv_obj_t *const dots[3] = {id(dot_1), id(dot_2), id(dot_3)};
                const uint8_t versatz = ${dot_cycle_steps} / 3;
                for (uint8_t i = 0; i < 3; i++) {
                  uint8_t p = (step + ${dot_cycle_steps} - versatz * i) % ${dot_cycle_steps};
                  float a = 0.5f * (1.0f + cosf(6.2831853f * p / ${dot_cycle_steps}));
                  int16_t groesse = ${dot_size} + (int16_t) (a * (${dot_size_max} - ${dot_size}));
                  lv_obj_set_size(dots[i], groesse, groesse);
                  // Nach jeder Groessenaenderung neu ausrichten, sonst waechst
                  // der Punkt nach rechts unten statt aus seiner Mitte heraus.
                  lv_obj_align(dots[i], LV_ALIGN_CENTER, X[i], -(int16_t) (a * ${dot_lift}));
                  lv_obj_set_style_bg_opa(
                      dots[i], (lv_opa_t) (${dot_opa_min} + a * (255 - ${dot_opa_min})),
                      LV_PART_MAIN);
                }
                step = (step + 1) % ${dot_cycle_steps};

  # -------------------------------------------------- Animation des Zuhoerens
  # Zuhoeren hat keinen Ring mehr, sondern nur das blaue Mikrofon-Icon in der
  # Mitte. Es atmet nach demselben Muster wie die Punkte der Verarbeitung:
  # angehobene Kosinuswelle ueber Deckkraft und eine kleine Hebung, geschrieben
  # direkt ueber die LVGL-C-API (`lvgl.widget.update` kennt keine Zeitachse).
  # Die Groesse bleibt fest: ein Fontwechsel waere ein sichtbarer Sprung, und
  # transform_scale liesse LVGL 9 das Label pro Frame in einen eigenen Layer
  # rendern - genau die Bandbreite, an der schon der Ring gescheitert ist.
  #
  # Die Deckkraft zu animieren war am Ring die Ruckelursache (vier konzentrische
  # Arcs ueber den vollen 466-px-Kranz per Alpha gegen Schwarz gemischt). Hier
  # ist es ein einzelnes 240x240-Label, also unkritisch.
  #
  # Anders als beim Ring muss der Endzustand hier zurueckgesetzt werden:
  # update_ui setzt zwar text_color, aber nicht text_opa und nicht die
  # Ausrichtung. Das erledigt der `aktiv`-Merker beim Verlassen der Phase.
  - interval: ${mic_step_time}
    then:
      - lambda: |-
          static bool aktiv = false;
          static uint8_t step = 0;
          // Dieselbe Animation traegt die Glocke eines abgelaufenen Timers -
          // beide Male ist es dasselbe Widget (lbl_icon) in derselben Groesse,
          // es braucht also keinen zweiten Takt.
          const bool pulst =
              id(voice_assistant_phase) == ${phase_listening} ||
              id(voice_assistant_phase) == ${phase_timer_ringing};
          if (!pulst) {
            if (aktiv) {
              aktiv = false;
              lv_obj_set_style_text_opa(id(lbl_icon), LV_OPA_COVER, LV_PART_MAIN);
              lv_obj_align(id(lbl_icon), LV_ALIGN_CENTER, 0, 0);
            }
            return;
          }
          if (!aktiv) {
            aktiv = true;
            step = 0;
          }
          float a = 0.5f * (1.0f - cosf(6.2831853f * step / ${mic_cycle_steps}));
          lv_obj_set_style_text_opa(
              id(lbl_icon), (lv_opa_t) (${mic_opa_min} + a * (255 - ${mic_opa_min})),
              LV_PART_MAIN);
          lv_obj_align(id(lbl_icon), LV_ALIGN_CENTER, 0,
                       -(int16_t) (a * ${mic_lift}));
          step = (step + 1) % ${mic_cycle_steps};

  # ------------------------------------------- Animation der Sprachausgabe
  # Sprachausgabe hat keinen Ring mehr, sondern fuenf Balken als Aequalizer.
  # Gleiches Muster wie bei den Punkten: angehobene Kosinuswelle, jeder Balken
  # ein Fuenftel Zyklus versetzt, geschrieben ueber die LVGL-C-API. Die
  # Amplitude ist pro Balken skaliert (aussen flacher als innen), damit die
  # Gruppe rund in das runde Display passt.
  #
  # `lv_obj_align` muss auch hier nach jedem `lv_obj_set_size` folgen, sonst
  # waechst der Balken nach unten statt aus seiner Mitte. Ein Ruecksetzen wie
  # beim Mikrofon braucht es nicht: die Balken sind ausserhalb der Phase
  # versteckt (update_ui) und der erste Takt schreibt alle Werte neu.
  #
  # Der `is_showing`-Guard hat denselben Grund wie bei den Punkten: im
  # Gesichtsmodus traegt page_face die Sprachausgabe, page_main liegt hinten.
  - interval: ${bar_step_time}
    then:
      - if:
          condition:
            lvgl.page.is_showing: page_main
          then:
            - lambda: |-
                static bool aktiv = false;
                static uint8_t step = 0;
                if (id(voice_assistant_phase) != ${phase_replying}) {
                  aktiv = false;
                  return;
                }
                if (!aktiv) {
                  aktiv = true;
                  step = 0;
                }
                static const int16_t X[5] = {-2 * ${bar_gap}, -${bar_gap}, 0,
                                             ${bar_gap}, 2 * ${bar_gap}};
                static const float SKALA[5] = {0.45f, 0.75f, 1.0f, 0.75f, 0.45f};
                lv_obj_t *const bars[5] = {id(bar_1), id(bar_2), id(bar_3),
                                           id(bar_4), id(bar_5)};
                const uint8_t versatz = ${bar_cycle_steps} / 5;
                for (uint8_t i = 0; i < 5; i++) {
                  uint8_t p = (step + ${bar_cycle_steps} - versatz * i) % ${bar_cycle_steps};
                  float a = 0.5f * (1.0f + cosf(6.2831853f * p / ${bar_cycle_steps}));
                  a *= SKALA[i];
                  int16_t hoehe = ${bar_size_min}
                                + (int16_t) (a * (${bar_size_max} - ${bar_size_min}));
                  lv_obj_set_size(bars[i], ${bar_width}, hoehe);
                  lv_obj_align(bars[i], LV_ALIGN_CENTER, X[i], 0);
                  lv_obj_set_style_bg_opa(
                      bars[i], (lv_opa_t) (${bar_opa_min} + a * (255 - ${bar_opa_min})),
                      LV_PART_MAIN);
                }
                step = (step + 1) % ${bar_cycle_steps};

  # ------------------------------------------------------ Takt des Gesichts
  # Ein einziger Takt fuer alle vier Zustaende des Mockups - und zwar bewusst
  # *einer*: Punkte, Balken und Mikrofon haben je einen eigenen, weil sie sich
  # gegenseitig nie sehen (jede Phase versteckt die anderen). Das Gesicht ist
  # umgekehrt in jeder Phase dasselbe Gesicht; nur seine Zielwerte wechseln.
  #
  # Genau daran haengt die Forderung nach einem fliessenden Uebergang. Jede
  # Groesse hat ein Ziel und einen laufenden Wert, und der laufende Wert
  # naehert sich dem Ziel je Takt um einen festen Bruchteil:
  #
  #     wert += (ziel - wert) * k
  #
  # Das ist ein exponentieller Einlauf, kein Abfahren einer Zeitachse. Er hat
  # keinen Anfang und kein Ende, die man treffen muesste - wechselt mitten in
  # der Bewegung die Phase, aendert sich nur das Ziel und die Augen biegen ab,
  # statt zu springen. Mit k = 0.14 bei 33 ms sind rund 0,45 s vergangen, bis
  # 90 % des Weges zurueckgelegt sind; das entspricht dem `transition:
  # transform .5s cubic-bezier(.4,0,.2,1)` des Mockups.
  #
  # Vier Dinge laufen absichtlich *nicht* eingeschliffen:
  #   - Das Blinzeln (eigenes k = 0.5). Ein Lidschlag ist ein Schnappen, kein
  #     Gleiten; im Mockup sind es 120 ms. Das Muede-Werden nimmt umgekehrt ein
  #     eigenes, langsameres k = 0.18 - und das Aufschrecken danach ist wieder
  #     das schnappende.
  #   - Der Sprung auf ein neues Mundziel beim Reden. Das Ziel selbst wechselt
  #     alle 140 ms zufaellig, der Weg dorthin bleibt eingeschliffen - so
  #     entsteht das Zappeln des Mundes, ohne dass er flackert.
  #   - Das Zittern. Sein Versatz kommt erst nach dem Einlauf dazu, sonst waere
  #     daraus ein Wackeln geworden.
  #   - Der Mundradius. Zwischen Pille und rundem "O" gibt es keine Form, die
  #     gemeint waere.
  #
  # Im Warten kommen zu Blick und Lidschlag die Marotten: dreizehn kleine
  # Mienen (Zunge, grosse Augen, offener Mund, Doppelblinzler, muede,
  # Augenrollen, doppelter Blick, Zwinkern, skeptisch, Staunen, Grinsen,
  # Zittern, Lachen). Gezogen werden sie nicht gewuerfelt, sondern aus einem
  # gemischten Beutel - Begruendung unten am Beutel selbst.
  #
  # Geschrieben wird nur, was sich in ganzen Pixeln geaendert hat. Das ist hier
  # kein Feinschliff, sondern der Grund, warum der Glow bezahlbar bleibt: im
  # Warten stehen die Augen die meiste Zeit still, und dann laeuft der Takt
  # ohne einen einzigen LVGL-Aufruf durch. Bewegt wird nur waehrend eines
  # Uebergangs, also in Schueben von einer knappen halben Sekunde - und
  # waehrend der beiden dauerbewegten Marotten Augenrollen und Zittern, die
  # deshalb auch die ersten Kandidaten sind, wenn es ruckelt.
  #
  # Der `is_showing`-Guard steht in YAML statt im Lambda, weil es die Bedingung
  # dafuer schon gibt - und er ersetzt zugleich die Pruefung auf den
  # Gesichtsmodus: page_face liegt nur vorne, wenn das Gesicht gewaehlt ist.
  - interval: ${face_step_time}
    then:
      - if:
          condition:
            lvgl.page.is_showing: page_face
          then:
            - lambda: |-
                // --- Die Marotten des Wartens ---
                // Die Nummern stehen unten im Zielblock und in QUIRK_DAUER -
                // wer eine einschiebt, muss beides mitziehen.
                enum : uint8_t {
                  Q_ZUNGE = 1, Q_AUGEN, Q_MUND, Q_DOPPELBLINK, Q_MUEDE,
                  Q_ROLLEN, Q_DOPPELBLICK, Q_ZWINKERN, Q_SKEPTISCH, Q_STAUNEN,
                  Q_GRINSEN, Q_ZITTERN, Q_LACHEN, Q_ANZAHL = Q_LACHEN
                };
                // Dauer je Marotte in Takten zu 33 ms. Index 0 bleibt leer,
                // damit die Nummer direkt als Index taugt. Ein Zwinkern ist
                // nach 260 ms vorbei, das Muede-Werden darf 1,2 s stehen; ein
                // herzhaftes Lachen bekommt mit 30 Takten (~1 s) etwas mehr
                // Zeit als das kurze Grinsen.
                static const uint8_t QUIRK_DAUER[Q_ANZAHL + 1] = {
                  0, 20, 16, 20, 20, 36, 24, 28, 8, 27, 24, 24, 30
                };

                // --- Zustand ueber die Takte hinweg ---
                static uint16_t t = 0;              // Takte, seit es laeuft
                static int last_phase = -1;
                static float ex = 0, ey = 0;        // Blickversatz, laufend
                static float tx = 0, ty = 0;        //                 Ziel
                static float esl = 1.0f, esr = 1.0f;  // Augenskalierung l/r
                static float mh = ${face_mouth_h};  // Mundhoehe, laufend
                static float mw = ${face_mouth_w};  // Mundbreite, laufend
                static float mdy = ${face_mouth_dy};  // Mundmitte, laufend
                static float talk_h = ${face_mouth_h};  // Mundziel beim Reden
                static float lidl = 1.0f, lidr = 1.0f;  // 1 offen, 0.08 zu
                static uint16_t look_at = 0, blink_at = 0, blink_bis = 0;
                static uint16_t blink_again = 0;    // zweiter Lidschlag
                static uint16_t quirk_at = 0, quirk_ab = 0, quirk_bis = 0;
                static uint16_t talk_at = 0;
                static uint8_t quirk = 0;   // 0 keine, sonst Q_*
                static int8_t seite = 1;    // Kopfneigung beim Denken
                static int8_t qseite = 1;   // Seite der seitigen Marotten
                static int8_t jx = 0, jy = 0;  // Versatz des Zitterns

                // Mischbeutel statt Wuerfeln bei jeder Marotte: alle Nummern
                // liegen einmal darin, werden gemischt und der Reihe nach
                // abgearbeitet. Damit kommt keine zweimal hintereinander, jede
                // gleich oft, und die Reihenfolge ist in jeder Runde eine
                // andere. Beim Nachfuellen wird zusaetzlich getauscht, falls
                // die erste der neuen Runde die letzte der alten waere - sonst
                // haette der Beutel doch eine Wiederholung an der Naht.
                static uint8_t beutel[Q_ANZAHL];
                static uint8_t beutel_i = Q_ANZAHL;  // leer, wird gefuellt
                static uint8_t zuletzt = 0;
                t++;

                // esphome::random_uint32() statt rand(): der Hardware-RNG des
                // ESP32 braucht keinen Startwert und liefert nach dem Booten
                // nicht bei jedem Geraet dieselbe Folge - sonst blinzelten alle
                // Satelliten im Gleichtakt.
                auto wuerfel = [](uint16_t n) -> uint16_t {
                  return (uint16_t) (esphome::random_uint32() % n);
                };

                const int phase = id(voice_assistant_phase);
                if (phase != last_phase) {
                  last_phase = phase;
                  // Marotten und Lidschlag gehoeren dem Warten. Wer angesprochen
                  // wird, streckt nicht die Zunge heraus.
                  quirk = 0;
                  blink_bis = 0;
                  blink_again = 0;
                  if (phase == ${phase_thinking})
                    seite = wuerfel(2) ? 1 : -1;
                  if (phase == ${phase_idle})
                    look_at = t;  // sofort einen neuen Blick werfen

                  // Augen und Mund tragen die Phase ueber ihre eigene Farbe -
                  // blau beim Zuhoeren, orange bei der Verarbeitung, gruen
                  // bei einer Bestaetigung, sonst die neutrale Gesichtsfarbe.
                  // Kein zusaetzliches Widget, kein Weichzeichner: nur ein
                  // Farbwechsel an ohnehin vorhandenen, schon leuchtenden
                  // Teilen (auch ihr vorhandener Glow, shadow_color, zieht mit
                  // um). Ersetzt einen Versuch mit einer separaten "Wolke"
                  // dahinter, der auf dem Geraet zu stockender Augenbewegung
                  // und einmal zu einem haengenden I2S-Bus fuehrte - reine
                  // Farbwechsel an kleinen, bereits vorhandenen Flaechen sind
                  // dagegen so billig wie jeder andere Style-Wechsel in
                  // diesem Takt.
                  //
                  // Der Bestaetigungs-Zweig braucht keine eigene Pruefung auf
                  // result_kind: page_face liegt waehrend phase_result
                  // ueberhaupt nur vorne, wenn wake_display zuvor
                  // result_kind == 2 festgestellt hat (ein Messwert bleibt
                  // auf page_main) - dieser Takt laeuft ja nur, solange
                  // page_face gezeigt wird (is_showing-Guard oben).
                  const int gesichtsfarbe =
                      (phase == ${phase_listening}) ? ${color_listening}
                      : (phase == ${phase_thinking}) ? ${color_thinking}
                      : (phase == ${phase_result}) ? ${color_result}
                      : ${color_face};
                  lv_obj_t *const teile[] = {
                      id(face_eye_l), id(face_eye_r), id(face_mouth),
                      id(face_tongue)};
                  for (lv_obj_t *w : teile) {
                    lv_obj_set_style_bg_color(
                        w, lv_color_hex((uint32_t) gesichtsfarbe),
                        LV_PART_MAIN);
                    lv_obj_set_style_shadow_color(
                        w, lv_color_hex((uint32_t) gesichtsfarbe),
                        LV_PART_MAIN);
                  }
                }

                // --- Ziele der laufenden Phase ---
                // Erst die Ruhewerte fuer alles, danach greift die Phase (und
                // im Warten die Marotte) nur noch heraus, was sie wirklich
                // veraendert. Ohne diese Vorbelegung muesste jeder Zweig
                // saemtliche Groessen zuruecksetzen, und eine vergessene
                // bliebe von der letzten Marotte stehen.
                float tsl = 1.0f, tsr = 1.0f;
                float tmh = ${face_mouth_h};
                float tmw = ${face_mouth_w};
                float tmdy = ${face_mouth_dy};
                float tlidl = 1.0f, tlidr = 1.0f;
                float lid_k = 0.5f;
                int32_t m_radius = ${face_mouth_radius};
                bool zunge = false;

                switch (phase) {
                  case ${phase_listening}:
                    // Aufmerksam: Blick geradeaus, Augen eine Spur groesser.
                    tx = 0; ty = 0; tsl = 1.06f; tsr = 1.06f;
                    break;

                  case ${phase_thinking}:
                    // Blick nach schraeg oben - die Richtung, in die Menschen
                    // sehen, wenn sie ueberlegen. Dazu das Fragezeichen.
                    tx = 34.0f * seite; ty = -26.0f;
                    break;

                  case ${phase_replying}:
                    tx = 0; ty = 0;
                    // Alle 140 ms (4 Takte) eine neue Mundhoehe. Der Weg
                    // dorthin bleibt eingeschliffen, deshalb zappelt der Mund,
                    // statt zu flackern.
                    if (t >= talk_at) {
                      talk_h = 8.0f + wuerfel(35);
                      talk_at = t + 4;
                    }
                    tmh = talk_h;
                    break;

                  default: {
                    // Warten. Drei unabhaengige Uhren laufen nebeneinander:
                    // der wandernde Blick (2,2 s), der Lidschlag (2,4-5,6 s)
                    // und die Marotten (3,2-6,2 s). Alle drei Zeiten stammen
                    // aus dem Mockup, in Takte zu 33 ms umgerechnet.
                    if (t >= look_at) {
                      const float a = wuerfel(628) / 100.0f;
                      tx = cosf(a) * (30 + wuerfel(56));
                      ty = sinf(a) * (16 + wuerfel(33));
                      look_at = t + 66;
                    }
                    if (t >= blink_at) {
                      blink_at = t + 72 + wuerfel(97);
                      blink_bis = t + 4;  // rund 120 ms geschlossen
                    }
                    if (blink_again != 0 && t >= blink_again) {
                      blink_again = 0;
                      blink_bis = t + 4;  // zweiter Schlag des Doppelblinzlers
                    }
                    if (t >= quirk_at) {
                      // Naechste Nummer aus dem Beutel; ist er leer, wird neu
                      // gemischt (Fisher-Yates).
                      if (beutel_i >= Q_ANZAHL) {
                        for (uint8_t i = 0; i < Q_ANZAHL; i++)
                          beutel[i] = i + 1;
                        for (uint8_t i = Q_ANZAHL - 1; i > 0; i--) {
                          const uint8_t j = (uint8_t) wuerfel(i + 1);
                          const uint8_t s = beutel[i];
                          beutel[i] = beutel[j];
                          beutel[j] = s;
                        }
                        if (beutel[0] == zuletzt) {
                          const uint8_t s = beutel[0];
                          beutel[0] = beutel[Q_ANZAHL - 1];
                          beutel[Q_ANZAHL - 1] = s;
                        }
                        beutel_i = 0;
                      }
                      quirk = beutel[beutel_i++];
                      zuletzt = quirk;
                      qseite = wuerfel(2) ? 1 : -1;
                      quirk_ab = t;
                      quirk_bis = t + QUIRK_DAUER[quirk];
                      quirk_at = t + 96 + wuerfel(91);
                      if (quirk == Q_DOPPELBLINK) {
                        blink_bis = t + 4;
                        blink_again = t + 9;  // rund 300 ms spaeter
                      }
                    }
                    if (quirk != 0 && t >= quirk_bis) {
                      quirk = 0;
                      // Marotten, die den Blick gefuehrt haben, lassen ein
                      // Ziel irgendwo am Rand stehen. Sofort einen frischen
                      // Blickpunkt ziehen, statt dort haengen zu bleiben.
                      look_at = t;
                    }

                    const uint16_t qt = t - quirk_ab;  // Takte seit Beginn
                    switch (quirk) {
                      case Q_ZUNGE:
                        zunge = true;
                        break;

                      case Q_AUGEN:
                        tsl = 1.16f; tsr = 1.16f;
                        break;

                      case Q_MUND:
                        tmh = ${face_mouth_h_max};
                        break;

                      case Q_MUEDE:
                        // Schwere Lider, und zwar langsam (eigenes lid_k).
                        // Das Aufschrecken am Ende braucht keinen eigenen
                        // Zweig: faellt die Marotte weg, gilt wieder der
                        // Ruhewert 1.0 mit dem schnappenden lid_k = 0.5.
                        tlidl = 0.55f; tlidr = 0.55f;
                        lid_k = 0.18f;
                        break;

                      case Q_ROLLEN: {
                        // Ein voller Umlauf in 24 Takten. Der Einlauf daempft
                        // eine Schwingung dieser Frequenz auf knapp die
                        // Haelfte, deshalb stehen hier groessere Radien als
                        // beim wandernden Blick - sichtbar bleiben rund
                        // 47 x 26 px.
                        const float a = 6.2831853f * qt / 24.0f;
                        tx = cosf(a) * 100.0f;
                        ty = sinf(a) * 56.0f;
                        break;
                      }

                      case Q_DOPPELBLICK:
                        // Ruck zur Seite, halten, Ruck auf die andere, zurueck.
                        tx = (qt < 9) ? -70.0f * qseite
                                      : ((qt < 20) ? 70.0f * qseite : 0.0f);
                        ty = 0;
                        break;

                      case Q_ZWINKERN:
                        // Nur ein Auge zu - dafuer ueberhaupt die Trennung in
                        // lidl und lidr.
                        if (qseite > 0) tlidr = 0.08f; else tlidl = 0.08f;
                        break;

                      case Q_SKEPTISCH:
                        // Ein Auge hoch, das andere zusammengekniffen, Blick
                        // leicht zur Seite.
                        if (qseite > 0) { tsl = 1.15f; tsr = 0.80f; }
                        else            { tsl = 0.80f; tsr = 1.15f; }
                        tx = 26.0f * qseite; ty = -8.0f;
                        break;

                      case Q_STAUNEN:
                        tmw = ${face_mouth_o_w};
                        tmh = ${face_mouth_o_h};
                        m_radius = ${face_mouth_o_radius};
                        tsl = 1.12f; tsr = 1.12f;
                        break;

                      case Q_GRINSEN:
                        tmw = ${face_mouth_w_grin};
                        tmh = ${face_mouth_h_grin};
                        tmdy = ${face_mouth_dy} - 6;
                        break;

                      case Q_ZITTERN:
                        // Alle zwei Takte ein neuer Versatz. Er laeuft
                        // absichtlich *nicht* durch den Einlauf - geglaettet
                        // waere aus dem Zittern ein Wackeln geworden.
                        if ((qt & 1) == 0) {
                          jx = (int8_t) wuerfel(9) - 4;
                          jy = (int8_t) wuerfel(9) - 4;
                        }
                        break;

                      case Q_LACHEN:
                        // Herzhaftes Lachen: Mund als breites, offenes Oval
                        // statt Grinsens duennem Strich, dazu zusammen-
                        // gekniffene Augen - anders als beim Blinzeln
                        // (tlidl/tlidr) ueber die Augengroesse selbst (tsl/
                        // tsr), das wirkt als "verschmitzt zusammengekniffen"
                        // statt als geschlossen.
                        tmw = ${face_mouth_w_lachen};
                        tmh = ${face_mouth_h_lachen};
                        m_radius = ${face_mouth_radius_lachen};
                        tmdy = ${face_mouth_dy} - 8;
                        tsl = 0.45f; tsr = 0.45f;
                        break;
                    }

                    // Der Lidschlag steht ueber jeder Marotte: er kann in eine
                    // hineinfallen, und dann sind die Augen zu.
                    if (t < blink_bis) {
                      tlidl = 0.08f; tlidr = 0.08f; lid_k = 0.5f;
                    }
                    break;
                  }
                }

                // --- Einlauf ---
                const float k = 0.14f;
                ex += (tx - ex) * k;
                ey += (ty - ey) * k;
                esl += (tsl - esl) * k;
                esr += (tsr - esr) * k;
                mh += (tmh - mh) * (phase == ${phase_replying} ? 0.45f : 0.20f);
                mw += (tmw - mw) * 0.20f;
                mdy += (tmdy - mdy) * 0.20f;
                lidl += (tlidl - lidl) * lid_k;
                lidr += (tlidr - lidr) * lid_k;

                // --- Schreiben, aber nur bei echter Aenderung ---
                // Ein `lv_obj_set_size` invalidiert die alte *und* die neue
                // Flaeche; mit Glow ist das je Auge rund 122x172 px. Ohne diese
                // Pruefung liefe das 30-mal je Sekunde auch dann, wenn sich
                // nichts bewegt.
                // Das Zittern kommt erst hier dazu, weil es den Einlauf
                // umgeht; es verschiebt Augen und Mund gemeinsam.
                const int32_t jitx = (quirk == Q_ZITTERN) ? jx : 0;
                const int32_t jity = (quirk == Q_ZITTERN) ? jy : 0;
                const int32_t px = (int32_t) lroundf(ex) + jitx;
                const int32_t py = (int32_t) lroundf(ey) + jity;

                int32_t awl = (int32_t) lroundf(${face_eye_w} * esl);
                int32_t ahl = (int32_t) lroundf(${face_eye_h} * esl * lidl);
                int32_t awr = (int32_t) lroundf(${face_eye_w} * esr);
                int32_t ahr = (int32_t) lroundf(${face_eye_h} * esr * lidr);
                // eine Box ohne Flaeche zeichnet LVGL nicht
                if (ahl < 2) ahl = 2;
                if (ahr < 2) ahr = 2;
                static int32_t a_awl = -1, a_ahl = -1, a_awr = -1, a_ahr = -1;
                static int32_t a_px = 0, a_py = 0;
                // Die Position gilt beiden Augen, die Groesse seit dem
                // Zwinkern jedem fuer sich - deshalb erst pruefen, dann beide
                // Zweige laufen lassen und den Positionsmerker zuletzt
                // nachziehen.
                const bool pos_neu = (px != a_px || py != a_py);
                if (pos_neu || awl != a_awl || ahl != a_ahl) {
                  a_awl = awl; a_ahl = ahl;
                  lv_obj_set_size(id(face_eye_l), awl, ahl);
                  // Nach jedem set_size neu ausrichten, sonst waechst das Auge
                  // aus seiner linken oberen Ecke statt aus seiner Mitte.
                  lv_obj_align(id(face_eye_l), LV_ALIGN_CENTER,
                               px - ${face_eye_dx}, py - ${face_eye_dy});
                }
                if (pos_neu || awr != a_awr || ahr != a_ahr) {
                  a_awr = awr; a_ahr = ahr;
                  lv_obj_set_size(id(face_eye_r), awr, ahr);
                  lv_obj_align(id(face_eye_r), LV_ALIGN_CENTER,
                               px + ${face_eye_dx}, py - ${face_eye_dy});
                }
                a_px = px; a_py = py;

                int32_t mundh = (int32_t) lroundf(mh);
                int32_t mundw = (int32_t) lroundf(mw);
                if (mundh < 2) mundh = 2;
                if (mundw < 2) mundw = 2;
                const int32_t mundy = (int32_t) lroundf(mdy) + jity;
                static int32_t a_mh = -1, a_mw = -1, a_my = 0, a_mx = 0;
                if (mundh != a_mh || mundw != a_mw || mundy != a_my
                    || jitx != a_mx) {
                  a_mh = mundh; a_mw = mundw; a_my = mundy; a_mx = jitx;
                  lv_obj_set_size(id(face_mouth), mundw, mundh);
                  lv_obj_align(id(face_mouth), LV_ALIGN_CENTER, jitx, mundy);
                }
                // Der Radius springt (nur das Staunen braucht das runde "O"),
                // eingeschliffen wird er nicht - dazwischen gaebe es keine
                // Form, die gemeint waere.
                static int32_t a_mr = -1;
                if (m_radius != a_mr) {
                  a_mr = m_radius;
                  lv_obj_set_style_radius(id(face_mouth), m_radius,
                                          LV_PART_MAIN);
                }

                static int8_t a_zunge = -1;
                if ((int8_t) zunge != a_zunge) {
                  a_zunge = (int8_t) zunge;
                  if (zunge)
                    lv_obj_remove_flag(id(face_tongue), LV_OBJ_FLAG_HIDDEN);
                  else
                    lv_obj_add_flag(id(face_tongue), LV_OBJ_FLAG_HIDDEN);
                }
