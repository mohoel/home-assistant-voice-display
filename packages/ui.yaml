    # ------------------------------------------------------ Bildschirm aus
    # Leere schwarze Seite - der Standby-Zustand des Geraets. Sie ist der
    # zweite Teil des Ausschaltens: die Helligkeit allein genuegt nicht, weil
    # das Dimm-Register des CO5300 bei 0 nur die kleinste Stufe meint und nicht
    # garantiert "aus" - eine helle Uhr koennte dabei noch schwach glimmen. Auf
    # AMOLED ist Schwarz dagegen echtes Pixel-aus, also zeigt sleep_display
    # beides zusammen: Helligkeit 0 *und* eine Seite ohne ein einziges Widget.
    #
    # Das ist zugleich der Ersatz fuer den frueheren Pixel-Shift: was nicht
    # leuchtet, brennt auch nicht ein.
    - id: page_off
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false

    # --------------------------------------------------------- Konfiguration
    # Erreichbar nur ueber Gedrueckthalten (${long_press_time}), siehe
    # detect_long_press. Jedes weitere Tippen fuehrt zurueck (on_screen_touch),
    # und nach ${standby_timeout} ohne Beruehrung faellt on_idle ohnehin in den
    # Standby.
    #
    # Die Y-Werte sind auf den runden Bildschirm abgestimmt: bei Radius 233
    # bleibt auf Hoehe der zweizeiligen Hinweiszeile (y bis ~167) noch eine
    # Sehne von rund 325 px - die 260 px breite Box passt also mit Rand.
    - id: page_config
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: lbl_config_title
            align: CENTER
            y: -150
            text: "Konfiguration"
            text_font: font_date
            text_color: ${color_text}
            text_align: CENTER

        # Inhalt setzt show_config_page zur Laufzeit - beim Bauen ist die
        # IP-Adresse noch unbekannt. Der Platzhalter erscheint nie, weil die
        # Seite nur ueber show_config_page sichtbar wird.
        - qrcode:
            id: qr_config
            align: CENTER
            y: -10
            size: ${qr_size}
            text: "http://"
            dark_color: 0x000000
            light_color: 0xFFFFFF

        - label:
            id: lbl_config_hint
            align: CENTER
            y: 140
            width: 260
            text: ""
            text_font: font_small
            text_color: ${color_text_dim}
            text_align: CENTER
            long_mode: WRAP

    # ------------------------------------------------------- PV-Uebersicht
    # Nicht Teil der Standby-Rotation, sondern erreichbar nur ueber den
    # Schalter sw_pv_overview (packages/web.yaml), der sie per Sprachbefehl
    # einblendet ("PV Uebersicht" einschalten). Antippen schaltet ihn wieder
    # aus (on_screen_touch); das eigentliche Ein-/Ausblenden inklusive
    # Standby-Rueckkehr macht dessen on_turn_on/on_turn_off.
    #
    # Umsetzung von "Leistungsfluss Display.dc.html" (Claude-Design-Projekt
    # "Leistungsfluss-Dashboard Design"): ein Ring aus bis zu drei Segmenten
    # (PV, Batterie, Netz - Flaeche proportional zu ihrem Leistungsanteil, mit
    # ${power_ring_gap_deg} Grad Luecke dazwischen wie im Mockup), dazu ein
    # Label je Segment auf Radius ${power_badge_radius}, und in der Mitte der
    # Hausverbrauch. Alle Winkel, Positionen und Texte setzt update_power_flow
    # zur Laufzeit - hier stehen nur die leeren Widgets.
    #
    # Drei separate Arcs statt eines CSS-Conic-Gradients (den LVGL nicht
    # kennt), nach demselben Rezept wie ring_timer im top_layer: value bleibt
    # immer auf dem Maximum, die Farbe steckt im indicator, und
    # ${power_ring_gap_deg} entsteht rein daraus, dass end_angle etwas vor dem
    # naechsten start_angle endet.
    #
    # Eine Quelle mit 0 W (oder deren Sensor gerade keinen gueltigen Wert
    # liefert) verschwindet ganz aus dem Ring statt eines Nullsegments -
    # siehe update_power_flow.
    - id: page_power
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        - arc:
            id: arc_pv
            align: CENTER
            width: ${power_ring_outer}
            height: ${power_ring_outer}
            min_value: 0
            max_value: 100
            value: 100
            start_angle: 270
            end_angle: 270
            arc_width: ${power_ring_width}
            arc_opa: TRANSP
            bg_opa: TRANSP
            pad_all: 0
            hidden: true
            indicator:
              arc_width: ${power_ring_width}
              arc_color: ${color_pv}
              arc_opa: COVER
        - arc:
            id: arc_batt
            align: CENTER
            width: ${power_ring_outer}
            height: ${power_ring_outer}
            min_value: 0
            max_value: 100
            value: 100
            start_angle: 270
            end_angle: 270
            arc_width: ${power_ring_width}
            arc_opa: TRANSP
            bg_opa: TRANSP
            pad_all: 0
            hidden: true
            indicator:
              arc_width: ${power_ring_width}
              arc_color: ${color_batt}
              arc_opa: COVER
        - arc:
            id: arc_netz
            align: CENTER
            width: ${power_ring_outer}
            height: ${power_ring_outer}
            min_value: 0
            max_value: 100
            value: 100
            start_angle: 270
            end_angle: 270
            arc_width: ${power_ring_width}
            arc_opa: TRANSP
            bg_opa: TRANSP
            pad_all: 0
            hidden: true
            indicator:
              arc_width: ${power_ring_width}
              arc_color: ${color_netz}
              arc_opa: COVER

        # --- Hausverbrauch in der Mitte ---
        - label:
            id: lbl_power_icon
            align: CENTER
            y: -37
            text: "\U0000E9B2" # home
            text_font: font_power_icon
            text_color: ${color_text}
            text_align: CENTER
        - label:
            id: lbl_power_value
            align: CENTER
            x: -18
            y: 12
            text: "0"
            text_font: font_power_value
            text_color: ${color_text}
            text_align: CENTER
        - label:
            id: lbl_power_unit
            align: CENTER
            x: 26
            y: 20
            text: "W"
            text_font: font_power_unit
            text_color: ${color_text_dim}
            text_align: CENTER
        - label:
            id: lbl_power_caption
            align: CENTER
            y: 49
            text: "Hausverbrauch"
            text_font: font_power_caption
            text_color: ${color_text_dim}
            text_align: CENTER

        # --- Segmentlabels: Text und Position setzt update_power_flow ---
        - label: {id: lbl_pv_val, align: CENTER, text: "", text_font: font_power_badge_value, text_color: "${color_pv}", text_align: CENTER, hidden: true}
        - label: {id: lbl_pv_name, align: CENTER, text: "PV", text_font: font_power_caption, text_color: "${color_text_dim}", text_align: CENTER, hidden: true}
        - label: {id: lbl_batt_val, align: CENTER, text: "", text_font: font_power_badge_value, text_color: "${color_batt}", text_align: CENTER, hidden: true}
        - label: {id: lbl_batt_name, align: CENTER, text: "Batterie", text_font: font_power_caption, text_color: "${color_text_dim}", text_align: CENTER, hidden: true}
        - label: {id: lbl_netz_val, align: CENTER, text: "", text_font: font_power_badge_value, text_color: "${color_netz}", text_align: CENTER, hidden: true}
        - label: {id: lbl_netz_name, align: CENTER, text: "Netz", text_font: font_power_caption, text_color: "${color_text_dim}", text_align: CENTER, hidden: true}

globals:
  # Ein Hinweis von aussen steht an (API-Aktion zeige_hinweis in
  # packages/core.yaml). Nur update_ui und show_hint fassen ihn an.
  - id: hint_active
    type: bool
    restore_value: false
    initial_value: "false"

script:
  # ---------------------------------------------------------- Hinweis zeigen
  # Gegenstueck zur optionalen API-Aktion zeige_hinweis. Fuer den normalen
  # Betrieb spielt das Skript keine Rolle - ohne einen Aufruf aus Home
  # Assistant laeuft es nie.
  #
  # Die eigentliche Anzeige macht update_ui; hier stehen nur Text, Merker und
  # Standzeit. Dadurch gewinnt ein Sprachvorgang automatisch: er setzt die
  # Phase und ruft update_ui, das den Hinweis dann zurueckstellt.
  - id: show_hint
    mode: restart
    parameters:
      icon: string
      nachricht: string
      sekunden: int
    then:
      - lambda: |-
          lv_label_set_text(id(lbl_hint_icon), icon.c_str());
          lv_label_set_text(id(lbl_hint_text), nachricht.c_str());
          id(hint_active) = true;
      - script.execute: update_ui
      # Ohne sinnvolle Angabe zehn Sekunden - lange genug zum Lesen, kurz genug,
      # dass ein vergessener Aufruf das Display nicht dauerhaft belegt.
      # Als Block, weil das " : " des Fragezeichenoperators in einer YAML-Zeile
      # als Zuordnung gelesen wuerde.
      - delay: !lambda |-
          return (sekunden > 0 ? sekunden : 10) * 1000;
      - lambda: id(hint_active) = false;
      - script.execute: update_ui

  # --------------------------------------------------- Statusanzeige updaten
  - id: update_ui
    mode: restart
    then:
      # Genau eine Gruppe in der Mitte je Phase: Verarbeitung -> drei Punkte,
      # Sprachausgabe -> fuenf Balken, Messwert -> Zahl und Einheit, alles
      # andere -> ein Statusicon. Erst alles aus, dann eine Gruppe an; das
      # laeuft synchron in einem Durchgang, also ohne Flackern.
      #
      # Das steht als ein Lambda statt als Kaskade aus lvgl.widget.show/hide:
      # mit sechs Faellen waere die YAML-Verschachtelung sechs Ebenen tief
      # gewesen. lv_obj_add_flag/lv_obj_remove_flag ist genau das, was der
      # Codegen aus lvgl.widget.hide/show ohnehin erzeugt
      # (lvgl/widgets/__init__.py:317).
      #
      # Text auf page_main gibt es seit dem Design-Handoff nicht mehr - der
      # Antworttext bleibt nur als text_sensor in HA verfuegbar. Zahl und
      # Einheit eines Messwerts sind die eine bewusste Ausnahme davon.
      - lambda: |-
          lv_obj_t *const alle[] = {
              id(lbl_icon), id(dot_1), id(dot_2), id(dot_3),
              id(bar_1), id(bar_2), id(bar_3), id(bar_4), id(bar_5),
              id(lbl_value), id(lbl_unit),
              id(lbl_hint_icon), id(lbl_hint_text)};
          for (lv_obj_t *w : alle)
            lv_obj_add_flag(w, LV_OBJ_FLAG_HIDDEN);

          // Ein Hinweis von aussen (API-Aktion zeige_hinweis) belegt die
          // Anzeige nur, solange nichts Wichtigeres los ist. Faengt ein
          // Sprachvorgang an, tritt er zurueck und kommt danach von selbst
          // wieder - sein Skript laeuft im Hintergrund weiter und raeumt am
          // Ende auf.
          if (id(hint_active) &&
              (id(voice_assistant_phase) == ${phase_idle} ||
               id(voice_assistant_phase) == ${phase_muted})) {
            lv_obj_remove_flag(id(lbl_hint_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(lbl_hint_text), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          // Glyph und Farbe des Statusicons. Seit dem Wegfall des Rings traegt
          // das Icon die Farbcodierung; Farben und Phasen sind beide feste
          // Substitutions aus assist-satellit.yaml.
          const char *glyph = nullptr;
          int farbe = ${color_text_dim};

          switch (id(voice_assistant_phase)) {
            case ${phase_thinking}:
              lv_obj_remove_flag(id(dot_1), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(dot_2), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(dot_3), LV_OBJ_FLAG_HIDDEN);
              break;

            case ${phase_replying}:
              lv_obj_remove_flag(id(bar_1), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(bar_2), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(bar_3), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(bar_4), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(bar_5), LV_OBJ_FLAG_HIDDEN);
              break;

            case ${phase_result}:
              if (id(result_kind) == 1) {
                lv_label_set_text(id(lbl_value), id(result_value).c_str());
                lv_label_set_text(id(lbl_unit), id(result_unit).c_str());
                lv_obj_remove_flag(id(lbl_value), LV_OBJ_FLAG_HIDDEN);
                lv_obj_remove_flag(id(lbl_unit), LV_OBJ_FLAG_HIDDEN);
              } else {
                glyph = "\U0000E668";  // check
                farbe = ${color_result};
              }
              break;

            case ${phase_timer_ringing}:
              glyph = "\U0000E7F7";  // notifications_active
              farbe = ${color_timer};
              break;

            case ${phase_listening}:
              // Ohne vorangegangenes Wake Word ist das die Antwort auf eine
              // Rueckfrage von Home Assistant - das Fragezeichen macht
              // sichtbar, dass das Geraet auf eine Antwort wartet und nicht
              // auf einen neuen Befehl. Beide Glyphen atmen (interval: am
              // Dateiende).
              glyph = id(is_followup) ? "\U0000EB8B" : "\U0000E31D";
              farbe = ${color_listening};
              break;

            case ${phase_error}:
              // Drei sehr verschiedene Lagen, die frueher alle gleich rot
              // aussahen: nicht verstanden, Home Assistant nicht erreichbar,
              // echter Fehler.
              if (id(error_kind) == 1) {
                glyph = "\U0000EB8B";  // question_mark
                farbe = ${color_thinking};
              } else if (id(error_kind) == 2) {
                glyph = "\U0000E648";  // wifi_off
                farbe = ${color_text_dim};
              } else {
                glyph = "\U0000F083";  // warning
                farbe = ${color_error};
              }
              break;

            case ${phase_muted}:
              glyph = "\U0000E02B";  // mic_off
              break;

            case ${phase_not_ready}:
              glyph = "\U0000E648";  // wifi_off
              break;

            default:
              // phase_idle: nichts in der Mitte, es geht ohnehin in den Standby
              break;
          }

          if (glyph != nullptr) {
            lv_label_set_text(id(lbl_icon), glyph);
            lv_obj_set_style_text_color(
                id(lbl_icon), lv_color_hex((uint32_t) farbe), LV_PART_MAIN);
            lv_obj_remove_flag(id(lbl_icon), LV_OBJ_FLAG_HIDDEN);
          }

          // Gegenstueck zur Logzeile in on_tts_start (packages/voice.yaml):
          // dort steht, was erkannt wurde, hier, was daraus auf dem Schirm
          // wurde. Erst beides zusammen trennt "falsch erkannt" von "nicht
          // angezeigt" - ohne das kostet die Unterscheidung eine Runde aus
          // Compile und OTA.
          ESP_LOGI("anzeige", "phase=%d art=%d wert_sichtbar=%d icon_sichtbar=%d",
                   id(voice_assistant_phase), id(result_kind),
                   !lv_obj_has_flag(id(lbl_value), LV_OBJ_FLAG_HIDDEN),
                   !lv_obj_has_flag(id(lbl_icon), LV_OBJ_FLAG_HIDDEN));

      # Im Leerlauf gibt es nichts anzuzeigen -> Standby.
      # Alles andere weckt das Display, ein anstehender Hinweis eingeschlossen -
      # sonst schoebe sleep_display die Standby-Seite darueber.
      - if:
          condition:
            lambda: |-
              return id(voice_assistant_phase) == ${phase_idle}
                  && !id(hint_active);
          then:
            - script.execute: sleep_display
          else:
            - script.execute: wake_display

  # Antippen hat je nach Zustand drei Bedeutungen:
  #
  # - Auf der Konfigurationsseite und der PV-Uebersicht fuehrt es zurueck.
  #   Bei der Konfigurationsseite direkt per update_ui; bei der PV-Uebersicht
  #   ueber switch.turn_off, damit der Schalter in Home Assistant denselben
  #   Zustand zeigt wie das Display (sonst bliebe er "an", obwohl die Seite
  #   schon weg ist, und ein erneutes Einschalten per Sprachbefehl bliebe ohne
  #   sichtbare Wirkung, weil sich der Zustand ja nicht aendert). Der eigentliche
  #   Seitenwechsel passiert dann in dessen on_turn_off. Beide Zweige laufen in
  #   die gleiche Fortsetzung unten: update_ui waehlt die richtige Seite
  #   (Standby oder Hauptseite); die Helligkeit setzt danach der passende
  #   Zweig unten - wer gerade tippt, will nicht ins Dunkle zurueck.
  # - Waehrend Zuhoeren, Verarbeitung oder Sprachausgabe bricht es den Vorgang
  #   ab (abort_session in packages/voice.yaml). Das Display ist in diesen
  #   Phasen ohnehin schon wach, ein wake_display waere ueberfluessig -
  #   abort_session endet selbst mit update_ui und damit im Standby-Zweig.
  # - Sonst weckt es nur das Display. Im Leerlauf/stumm ist der Bildschirm
  #   dabei in aller Regel aus (page_off), das Tippen holt also die
  #   Standby-Seite zurueck und schaltet auf ${active_brightness}. Einen
  #   eigenen Ruecksprung-Timer braucht das nicht: die Beruehrung hat LVGLs
  #   Untaetigkeitszaehler zurueckgesetzt, on_idle oben faellt nach
  #   ${standby_timeout} von selbst wieder in sleep_display.
  #
  # Fehler und "nicht bereit" sind bewusst nicht abbrechbar: da laeuft nichts,
  # was man abbrechen koennte, und clear_error raeumt von selbst auf.
  - id: on_screen_touch
    mode: restart
    then:
      - if:
          # Ein klingelnder Timer hat Vorrang vor allem anderen: wer den
          # Bildschirm anfasst, waehrend es klingelt, will genau eins. Das
          # Skript raeumt Ton, Phase und Anzeige selbst auf, deshalb endet der
          # Zweig hier.
          #
          # Home Assistant muss dafuer nichts tun - die Komponente loescht den
          # abgelaufenen Timer schon beim Ausloesen von on_timer_finished
          # (voice_assistant.cpp:1030), fuer HA ist er also erledigt. Es bleibt
          # nur der lokale Ton.
          condition:
            lambda: return id(timer_ringing);
          then:
            - script.execute: timer_stop_ringing
          else:
            - if:
                condition:
                  lvgl.page.is_showing: page_config
                then:
                  - script.execute: update_ui
            - if:
                condition:
                  lvgl.page.is_showing: page_power
                then:
                  - switch.turn_off: sw_pv_overview
            - if:
                condition:
                  lambda: |-
                    return id(voice_assistant_phase) == ${phase_listening}
                        || id(voice_assistant_phase) == ${phase_thinking}
                        || id(voice_assistant_phase) == ${phase_replying};
                then:
                  - script.execute: abort_session
                else:
                  - if:
                      condition:
                        lambda: |-
                          return id(voice_assistant_phase) == ${phase_idle}
                              || id(voice_assistant_phase) == ${phase_muted};
                      then:
                        # Wer tippt, will hinsehen: ein laufender Rueckfall aus
                        # Home Assistant faellt weg. Ab hier zaehlt wieder
                        # on_idle, das die Beruehrung gerade zurueckgesetzt hat
                        # - der Bildschirm geht also ${standby_timeout} nach
                        # dieser Beruehrung von selbst wieder aus.
                        - script.stop: standby_return
                        # War der Bildschirm schon aus, liegt page_off vorne
                        # und traegt nichts. Ein Tippen holt die Standby-Seite
                        # zurueck, statt nur das Nichts aufzuhellen.
                        - if:
                            condition:
                              lvgl.page.is_showing: page_off
                            then:
                              - script.execute: show_standby_page
                        - light.turn_on:
                            id: display_brightness
                            brightness: ${active_brightness}
                      else:
                        - script.execute: wake_display

  # --------------------------------------------------- Gedrueckthalten (3 s)
  # Gestartet vom on_touch des Touchscreens, gestoppt vom on_release
  # (packages/hardware.yaml). Wer frueher loslaesst, kommt nie beim
  # script.execute an - das ist die ganze Gestenerkennung.
  #
  # LVGL haette mit on_long_press ein eigenes Ereignis, das aber an einem
  # Widget haengt: es feuert nur, wenn der Finger auch wirklich ein Widget
  # trifft. Hier soll jede Stelle des Bildschirms zaehlen, deshalb der Weg
  # ueber den Touchscreen-Treiber.
  #
  # Bleibt ein on_release aus (verschluckte Meldung des Controllers), erscheint
  # die Seite ungewollt - ein Tippen fuehrt zurueck, und nach
  # ${standby_timeout} raeumt on_idle sie ohnehin weg.
  - id: detect_long_press
    mode: restart
    then:
      - delay: ${long_press_time}
      - script.execute: show_config_page

  # Konfigurationsseite mit IP-Adresse und QR-Code. Beides wird erst hier
  # gesetzt: beim Bauen ist die Adresse unbekannt, und sie kann sich nach einem
  # Reconnect aendern.
  #
  # Faellt die Adresse leer aus (noch kein DHCP-Lease), tritt der mDNS-Name an
  # ihre Stelle - der funktioniert im selben Netz genauso und ist besser als
  # eine leere Zeile.
  - id: show_config_page
    mode: restart
    then:
      - lambda: |-
          const std::string host = id(device_ip).state.empty()
              ? std::string("${name}.local")
              : id(device_ip).state;
          // Ohne Ruhezone stehen die QR-Module bis an den Rand der Kachel -
          // viele Scanner erkennen den Code dann nicht. LVGL rechnet die vier
          // Modul breite Zone in die Skalierung ein, sobald das Flag gesetzt
          // ist (lv_qrcode.c: get_satisfied_size).
          lv_qrcode_set_quiet_zone(id(qr_config), true);
          const std::string url = "http://" + host + "/";
          lv_qrcode_update(id(qr_config), url.c_str(), url.size());
          lv_label_set_text(
              id(lbl_config_hint),
              ("Im Browser " + host + " aufrufen oder den Code scannen").c_str());
      - script.stop: standby_return
      - lvgl.page.show: page_config
      - light.turn_on:
          id: display_brightness
          brightness: ${active_brightness}

  # ------------------------------------------------------- Display aufwecken
  - id: wake_display
    mode: restart
    then:
      - script.stop: standby_return
      - lvgl.page.show: page_main
      - light.turn_on:
          id: display_brightness
          brightness: ${active_brightness}

  # --------------------------------------------------- Bildschirm ausschalten
  # Standby heisst aus, nicht gedimmt: die frueheren Substitutions
  # standby_brightness und screen_off_delay gibt es nicht mehr, und mit ihnen
  # auch keine Zwischenstufe. Eine gedimmte Uhr ist auf einem AMOLED der
  # einzige dauerhaft leuchtende Inhalt im ganzen Entwurf - genau das soll im
  # Ruhezustand nicht mehr passieren.
  #
  # Beides zusammen ist noetig: das Dimm-Register des CO5300 meint bei 0 nur
  # die kleinste Stufe und nicht garantiert "aus", eine helle Uhr koennte also
  # noch schwach glimmen. Erst die Seite ohne ein einziges Widget macht den
  # Bildschirm wirklich schwarz.
  #
  # Erst dunkel, dann umschalten: so ist der Seitenwechsel nicht zu sehen.
  - id: sleep_display
    mode: restart
    then:
      - light.turn_off: display_brightness
      - lvgl.page.show: page_off

  # --------------------------------------- Rueckfall ohne Beruehrung
  # Nur fuer einen Weckweg noetig: das Einschalten der Lichtentity aus Home
  # Assistant (on_turn_on in packages/hardware.yaml). Alle anderen Wege gehen
  # ueber den Touchscreen, und der setzt LVGLs Untaetigkeitszaehler zurueck -
  # dort holt on_idle den Bildschirm nach ${standby_timeout} von selbst wieder
  # ab.
  #
  # Ein zweites on_idle waere der naheliegende Weg und ist falsch: der Trigger
  # misst reine Touch-Untaetigkeit und feuert je Untaetigkeitsphase genau
  # einmal (IdleTrigger::is_idle_ in lvgl_esphome.cpp:429). Ohne Beruehrung
  # steht der Zaehler laengst ueber der Schwelle, der Trigger kaeme also nie
  # wieder - der Bildschirm bliebe bis zur naechsten Beruehrung an.
  #
  # `mode: restart` ist Pflicht (delay in einem Skript), und jeder Weg, der das
  # Display absichtlich wach haelt, muss es stoppen - sonst faellt der
  # Bildschirm mitten im Hinschauen ins Dunkle. Das sind wake_display,
  # show_config_page und der Idle-Zweig von on_screen_touch.
  - id: standby_return
    mode: restart
    then:
      - delay: ${standby_timeout}
      - script.execute: sleep_display

  # Welche Standby-Seite gezeigt wird, entscheidet sel_standby_page aus
  # packages/web.yaml. Wer eine weitere hinzufuegt, muss drei Stellen
  # anfassen: eine Option in sel_standby_page, einen Zweig hier und die
  # is_showing-Bedingung des Minutentakts in packages/core.yaml.
  #
  # Der Inhalt wird jeweils *vor* dem Seitenwechsel aufgefrischt, damit keine
  # veraltete Uhrzeit aufblitzt.
  - id: show_standby_page
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(sel_standby_page).active_index().value_or(0) == 1;
          then:
            - script.execute: update_dial
            - lvgl.page.show: page_dial
          else:
            - script.execute: update_clock
            - lvgl.page.show: page_standby
      # Erst nach dem Seitenwechsel: update_timer_ui schreibt den Countdown nur,
      # wenn die Standby-Seite auch wirklich vorne liegt. Der Aufruf raeumt
      # ausserdem auf, wenn der letzte Timer ablief, waehrend eine andere Seite
      # sichtbar war - dann steht lbl_clock noch auf versteckt. Auf dem
      # Zifferblatt bleibt vom Timer nur der Ring im top_layer; einen Countdown
      # gibt es dort bewusst nicht, er wuerde mitten im Kranz stehen.
      - script.execute: update_timer_ui

  # ------------------------------------------------------------- Timer-Anzeige
  # Aufgerufen aus allen fuenf on_timer_*-Triggern (packages/voice.yaml), im
  # laufenden Betrieb also einmal pro Sekunde. Zwei Dinge haengen daran:
  #
  #   - der Ring im top_layer, sichtbar auf jeder Seite
  #   - der Countdown auf der Standby-Seite, der dort die Uhr ersetzt
  #
  # Bewusst *keine* Farbzuweisung und keine Deckkraftrechnung pro Durchlauf -
  # der Ring soll genau eine Sache pro Sekunde tun: seinen Wert aendern. Die
  # frueheren Ringe sind daran gescheitert, pro Frame den ganzen Kranz neu zu
  # mischen; hier ist es ein Bruchteil eines Grades pro Sekunde.
  - id: update_timer_ui
    mode: restart
    then:
      - lambda: |-
          const bool aktiv = id(timer_active) && id(timer_total) > 0;

          if (aktiv) {
            int32_t wert = (int32_t) (1000.0f * (float) id(timer_left) /
                                      (float) id(timer_total));
            if (wert < 0) wert = 0;
            if (wert > 1000) wert = 1000;
            lv_arc_set_value(id(ring_timer), wert);
            lv_obj_remove_flag(id(ring_timer), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(ring_timer), LV_OBJ_FLAG_HIDDEN);
          }

      # Der Countdown steht nur auf der Standby-Seite. Auf der Hauptseite
      # gehoert die Mitte der laufenden Phase, auf der Konfigurationsseite dem
      # QR-Code - dort waere er nur im Weg. Die Pruefung laeuft ueber die
      # LVGL-Bedingung statt ueber ein Lambda, weil Seiten hier echte Screens
      # sind (lv_screen_load_anim) und nicht ueber ein Hidden-Flag geschaltet
      # werden.
      - if:
          condition:
            lvgl.page.is_showing: page_standby
          then:
            - lambda: |-
                if (id(timer_active)) {
                  const int rest = id(timer_left);
                  const int stunden = rest / 3600;
                  const int minuten = (rest % 3600) / 60;
                  const int sekunden = rest % 60;
                  const std::string text =
                      stunden > 0
                          ? esphome::str_sprintf("%d:%02d:%02d", stunden, minuten, sekunden)
                          : esphome::str_sprintf("%02d:%02d", minuten, sekunden);
                  lv_label_set_text(id(lbl_timer), text.c_str());
                  lv_label_set_text(id(lbl_date), id(timer_name).empty()
                                                      ? "Timer"
                                                      : id(timer_name).c_str());
                  lv_obj_add_flag(id(lbl_clock), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_remove_flag(id(lbl_timer), LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_add_flag(id(lbl_timer), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_remove_flag(id(lbl_clock), LV_OBJ_FLAG_HIDDEN);
                }
      # Faellt der letzte Timer weg, brauchen Uhr und Datum wieder ihren
      # eigenen Text - lbl_date trug bis eben den Namen des Timers.
      - if:
          condition:
            lambda: return !id(timer_active);
          then:
            - script.execute: update_clock

  # ---------------------------------------------------------------- Uhrzeit
  # Steigt aus, solange ein Timer laeuft: dann gehoeren beide Labels dem
  # Countdown (lbl_date traegt dessen Namen), und der Minutentakt aus
  # packages/core.yaml wuerde sie sonst jede Minute kurz mit Uhrzeit und Datum
  # ueberschreiben, bis update_timer_ui eine Sekunde spaeter zurueckschreibt.
  - id: update_clock
    then:
      - if:
          condition:
            lambda: return !id(timer_active);
          then:
            - lvgl.label.update:
                id: lbl_clock
                text: !lambda |-
                  return id(ha_time).now().is_valid()
                       ? id(ha_time).now().strftime("%H:%M")
                       : std::string("--:--");
            # "Dienstag, 4. August" - strftime kennt nur die C-Locale, also
            # englische Namen. Deshalb von Hand.
            - lvgl.label.update:
                id: lbl_date
                text: !lambda |-
                  static const char *const WOCHENTAG[] = {
                    "Sonntag", "Montag", "Dienstag", "Mittwoch",
                    "Donnerstag", "Freitag", "Samstag"};
                  static const char *const MONAT[] = {
                    "Januar", "Februar", "März", "April", "Mai", "Juni", "Juli",
                    "August", "September", "Oktober", "November", "Dezember"};
                  auto t = id(ha_time).now();
                  if (!t.is_valid())
                    return std::string("");
                  return esphome::str_sprintf("%s, %d. %s",
                                              WOCHENTAG[t.day_of_week - 1],
                                              t.day_of_month,
                                              MONAT[t.month - 1]);

  # ------------------------------------------------------------ Zifferblatt
  # Gegenstueck zu update_clock fuer page_dial. Laeuft beim Betreten des
  # Standbys und danach im Minutentakt aus core.yaml.
  #
  # Es sind genau drei Dinge zu tun: die Minutenmarke auf den gueltigen Strich
  # legen, die Stundenziffer einfaerben und die vorige zuruecksetzen. Die 60
  # festen Striche werden nie angefasst - die laengere Marke deckt den Strich
  # darunter ab.
  #
  # Kein Guard auf die sichtbare Seite: die Aufrufer wissen, wann es sich
  # lohnt, und LVGL verwirft ein lv_obj_invalidate fuer Widgets, die nicht auf
  # dem aktiven Screen liegen, ohnehin.
  - id: update_dial
    mode: restart
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) {
            // Vor der ersten Zeit aus Home Assistant gibt es nichts
            // hervorzuheben. Der Kranz steht, Marke und Glow bleiben weg -
            // eine Marke auf der Zwoelf waere eine Falschaussage.
            lv_obj_add_flag(id(dial_active)->obj, LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(dial_glow_tick), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(dial_glow_num), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          static const float BOGEN = 3.14159265f / 180.0f;

          // --- Minutenmarke ---
          // Dieselbe Rechnung wie fuer die festen Striche (Kopfkommentar von
          // page_dial), nur mit Laenge ${dial_mark_len}. Das Punktearray muss
          // LVGL ueberdauern: lv_line_set_points uebernimmt den Zeiger, es
          // kopiert nicht - deshalb static und nicht auf dem Stapel.
          static lv_point_precise_t marke[2];
          const float am = t.minute * 6.0f * BOGEN;
          const float ux = sinf(am), uy = -cosf(am);
          const float hx = 0.5f * ${dial_mark_len} * ux;
          const float hy = 0.5f * ${dial_mark_len} * uy;
          const int32_t bw = (int32_t) lroundf(2.0f * fabsf(hx));
          const int32_t bh = (int32_t) lroundf(2.0f * fabsf(hy));
          marke[0].x = hx > 0 ? 0 : bw;
          marke[0].y = hy > 0 ? 0 : bh;
          marke[1].x = hx > 0 ? bw : 0;
          marke[1].y = hy > 0 ? bh : 0;
          lv_line_set_points(id(dial_active)->obj, marke, 2);
          // Nach set_points, sonst zieht die Inhaltsgroesse die Box wieder auf
          // die Punkte zusammen. Die Mindestgroesse 1 gilt den vier
          // achsparallelen Stellungen (0, 15, 30, 45): eine Box der Breite 0
          // hat eine leere Flaeche und wuerde beim Zeichnen uebersprungen.
          lv_obj_set_size(id(dial_active)->obj, bw > 0 ? bw : 1, bh > 0 ? bh : 1);

          const int32_t mx = (int32_t) lroundf(${dial_radius} * ux);
          const int32_t my = (int32_t) lroundf(${dial_radius} * uy);
          lv_obj_align(id(dial_active)->obj, LV_ALIGN_CENTER, mx, my);
          lv_obj_align(id(dial_glow_tick), LV_ALIGN_CENTER, mx, my);
          lv_obj_remove_flag(id(dial_active)->obj, LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(dial_glow_tick), LV_OBJ_FLAG_HIDDEN);

          // --- Stundenziffer ---
          int stunde = t.hour % 12;
          if (stunde == 0) stunde = 12;
          lv_obj_t *const zahlen[12] = {
              id(dial_n01), id(dial_n02), id(dial_n03), id(dial_n04),
              id(dial_n05), id(dial_n06), id(dial_n07), id(dial_n08),
              id(dial_n09), id(dial_n10), id(dial_n11), id(dial_n12)};

          // Die vorige Ziffer bekommt den Kranzstil zurueck. 204 ist das
          // text_opa: 80% aus dial_st_num.
          static int8_t vorige = -1;
          if (vorige >= 1 && vorige <= 12) {
            lv_obj_set_style_text_color(zahlen[vorige - 1],
                                        lv_color_hex(${color_text}), LV_PART_MAIN);
            lv_obj_set_style_text_opa(zahlen[vorige - 1], (lv_opa_t) 204,
                                      LV_PART_MAIN);
          }
          lv_obj_set_style_text_color(
              zahlen[stunde - 1], lv_color_hex(${color_dial}),
              LV_PART_MAIN);
          lv_obj_set_style_text_opa(zahlen[stunde - 1], LV_OPA_COVER,
                                    LV_PART_MAIN);
          vorige = (int8_t) stunde;

          const float az = stunde * 30.0f * BOGEN;
          lv_obj_align(id(dial_glow_num), LV_ALIGN_CENTER,
                       (int32_t) lroundf(${dial_num_radius} * sinf(az)),
                       (int32_t) lroundf(-${dial_num_radius} * cosf(az)));
          lv_obj_remove_flag(id(dial_glow_num), LV_OBJ_FLAG_HIDDEN);

  # Der minuetliche Takt fuer Uhr und Zifferblatt haengt am Zeitgeber in
  # core.yaml (`time: ha_time` -> on_time), weil ESPHome Plattform-Listen
  # ueber Package-Grenzen hinweg nicht per id zusammenfuehrt.

  # -------------------------------------------------------- PV-Uebersicht
  # Zeichnet page_power neu: Ring (drei Arcs) und die sieben Textlabels. Laeuft
  # bei jedem on_value der vier HA-Sensor-Importe (packages/core.yaml) und
  # einmal beim Einschalten von sw_pv_overview (packages/web.yaml) - unabhaengig
  # davon, ob die Seite gerade sichtbar ist. Das ist bewusst kein Guard auf
  # lvgl.page.is_showing wie beim Minutentakt oben: anders als der 40-ms-Takt
  # der Phasenanimationen feuert das hier ereignisgetrieben im Sekunden- bis
  # Minutentakt (Home-Assistant-Leistungssensoren), also unkritisch fuer die
  # Zeichenbandbreite.
  #
  # Winkelrechnung 1:1 aus buildRing()/ringMarkers() im Mockup-Skript
  # (support.js-Laufzeit von "Leistungsfluss Display.dc.html"): angle laeuft
  # kumulativ ueber die volle Segmentbreite (ohne die Luecke abzuziehen), erst
  # end_angle wird um ${power_ring_gap_deg} verkuerzt - dadurch bleibt die
  # Segmentmitte (fuer die Labelposition) unabhaengig von der Luecke. 0 Grad
  # ist zwoelf Uhr im Uhrzeigersinn wie im CSS-conic-gradient des Mockups;
  # LVGL zaehlt Winkel ab drei Uhr, deshalb + 270 wie bei ring_timer weiter
  # oben (Werte ueber 360 normalisiert LVGL selbst).
  - id: update_power_flow
    mode: restart
    then:
      - lambda: |-
          float pv   = id(ha_pv_power).state;
          float batt = id(ha_batt_power).state;
          float netz = id(ha_netz_power).state;
          float haus = id(ha_haus_power).state;

          // Sensor ohne gueltigen Wert (NaN, vor der ersten Meldung aus HA)
          // oder negativ (Batterie laedt, Netz speist ein) wie 0 behandeln -
          // ein Vergleich mit NaN ist immer false, das faengt beides in einem
          // Zug. Der Ring zeigt nur Quellen, die gerade wirklich zum Haus hin
          // fliessen.
          if (!(pv   > 0.0f)) pv   = 0.0f;
          if (!(batt > 0.0f)) batt = 0.0f;
          if (!(netz > 0.0f)) netz = 0.0f;
          if (!(haus > 0.0f)) haus = 0.0f;

          // Unter 1000 W in Watt ohne Nachkommastelle, ab 1000 W in kW mit
          // einer Nachkommastelle und Komma statt Punkt.
          auto format = [](float w) -> std::string {
            char buf[16];
            if (w < 1000.0f) {
              snprintf(buf, sizeof(buf), "%.0f", w);
            } else {
              snprintf(buf, sizeof(buf), "%.1f", w / 1000.0f);
              for (char *p = buf; *p; ++p)
                if (*p == '.') *p = ',';
            }
            return std::string(buf);
          };
          auto einheit = [](float w) -> const char* {
            return w < 1000.0f ? "W" : "kW";
          };

          lv_label_set_text(id(lbl_power_value), format(haus).c_str());
          lv_label_set_text(id(lbl_power_unit), einheit(haus));

          // Die Ringfarbe steckt fest im indicator: der jeweiligen Arc-Definition
          // (page_power), hier geht es nur um Anteil, Winkel und Textinhalt.
          struct Quelle {
            float w;
            lv_obj_t *arc, *lbl_val, *lbl_name;
          };
          Quelle quellen[3] = {
            {pv,   id(arc_pv),   id(lbl_pv_val),   id(lbl_pv_name)},
            {batt, id(arc_batt), id(lbl_batt_val), id(lbl_batt_name)},
            {netz, id(arc_netz), id(lbl_netz_val), id(lbl_netz_name)},
          };
          const float total = pv + batt + netz;
          static const float BOGEN = 3.14159265f / 180.0f;
          float angle = 0.0f; // zwoelf Uhr, wie buildRing() im Mockup

          for (uint8_t i = 0; i < 3; i++) {
            Quelle &q = quellen[i];
            if (total <= 0.0f || q.w <= 0.0f) {
              lv_obj_add_flag(q.arc, LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(q.lbl_val, LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(q.lbl_name, LV_OBJ_FLAG_HIDDEN);
              continue;
            }

            const float span = (q.w / total) * 360.0f;
            const float start = angle;
            const float end = angle + span - (i < 2 ? (float) ${power_ring_gap_deg} : 0.0f);
            const float mitte = angle + span / 2.0f;
            angle += span;

            lv_arc_set_start_angle(q.arc, (int32_t) lroundf(270.0f + start));
            lv_arc_set_end_angle(q.arc, (int32_t) lroundf(270.0f + end));
            lv_obj_remove_flag(q.arc, LV_OBJ_FLAG_HIDDEN);

            const float rad = mitte * BOGEN;
            const int32_t dx = (int32_t) lroundf(${power_badge_radius} * sinf(rad));
            const int32_t dy = (int32_t) lroundf(-${power_badge_radius} * cosf(rad));

            lv_label_set_text(q.lbl_val, (format(q.w) + " " + einheit(q.w)).c_str());
            lv_obj_align(q.lbl_val, LV_ALIGN_CENTER, dx, dy - 12);
            lv_obj_align(q.lbl_name, LV_ALIGN_CENTER, dx, dy + 10);
            lv_obj_remove_flag(q.lbl_val, LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(q.lbl_name, LV_OBJ_FLAG_HIDDEN);
          }

# --------------------------------------------- Animation der Verarbeitung
# ESPHome-LVGL hat kein Animations-Primitive fuer eigene Widget-Eigenschaften
# (`lvgl.widget.update` kennt keine Zeitachse), also laeuft die Welle als
# eigener Takt. Ein Schritt schreibt Groesse, Position und Deckkraft aller
# drei Punkte direkt ueber die LVGL-API - ein Lambda statt einer
# YAML-Fallunterscheidung pro Punkt und Schritt.
#
# Die Amplitude ist eine angehobene Kosinuswelle (0..1, Maximum bei p == 0),
# jeder Punkt liegt ein Drittel Zyklus hinter dem vorherigen. Dadurch wandert
# der Buckel von links nach rechts, statt dass die Punkte gemeinsam blinken.
#
# Der Takt laeuft immer, macht aber ausserhalb der Verarbeitung nichts - die
# Punkte sind dann ohnehin versteckt (update_ui).
interval:
  - interval: ${dot_step_time}
    then:
      - lambda: |-
          if (id(voice_assistant_phase) != ${phase_thinking})
            return;
          static uint8_t step = 0;
          static const int16_t X[3] = {-${dot_gap}, 0, ${dot_gap}};
          lv_obj_t *const dots[3] = {id(dot_1), id(dot_2), id(dot_3)};
          const uint8_t versatz = ${dot_cycle_steps} / 3;
          for (uint8_t i = 0; i < 3; i++) {
            uint8_t p = (step + ${dot_cycle_steps} - versatz * i) % ${dot_cycle_steps};
            float a = 0.5f * (1.0f + cosf(6.2831853f * p / ${dot_cycle_steps}));
            int16_t groesse = ${dot_size} + (int16_t) (a * (${dot_size_max} - ${dot_size}));
            lv_obj_set_size(dots[i], groesse, groesse);
            // Nach jeder Groessenaenderung neu ausrichten, sonst waechst der
            // Punkt nach rechts unten statt aus seiner Mitte heraus.
            lv_obj_align(dots[i], LV_ALIGN_CENTER, X[i], -(int16_t) (a * ${dot_lift}));
            lv_obj_set_style_bg_opa(
                dots[i], (lv_opa_t) (${dot_opa_min} + a * (255 - ${dot_opa_min})),
                LV_PART_MAIN);
          }
          step = (step + 1) % ${dot_cycle_steps};

  # -------------------------------------------------- Animation des Zuhoerens
  # Zuhoeren hat keinen Ring mehr, sondern nur das blaue Mikrofon-Icon in der
  # Mitte. Es atmet nach demselben Muster wie die Punkte der Verarbeitung:
  # angehobene Kosinuswelle ueber Deckkraft und eine kleine Hebung, geschrieben
  # direkt ueber die LVGL-C-API (`lvgl.widget.update` kennt keine Zeitachse).
  # Die Groesse bleibt fest: ein Fontwechsel waere ein sichtbarer Sprung, und
  # transform_scale liesse LVGL 9 das Label pro Frame in einen eigenen Layer
  # rendern - genau die Bandbreite, an der schon der Ring gescheitert ist.
  #
  # Die Deckkraft zu animieren war am Ring die Ruckelursache (vier konzentrische
  # Arcs ueber den vollen 466-px-Kranz per Alpha gegen Schwarz gemischt). Hier
  # ist es ein einzelnes 240x240-Label, also unkritisch.
  #
  # Anders als beim Ring muss der Endzustand hier zurueckgesetzt werden:
  # update_ui setzt zwar text_color, aber nicht text_opa und nicht die
  # Ausrichtung. Das erledigt der `aktiv`-Merker beim Verlassen der Phase.
  - interval: ${mic_step_time}
    then:
      - lambda: |-
          static bool aktiv = false;
          static uint8_t step = 0;
          if (id(voice_assistant_phase) != ${phase_listening}) {
            if (aktiv) {
              aktiv = false;
              lv_obj_set_style_text_opa(id(lbl_icon), LV_OPA_COVER, LV_PART_MAIN);
              lv_obj_align(id(lbl_icon), LV_ALIGN_CENTER, 0, 0);
            }
            return;
          }
          if (!aktiv) {
            aktiv = true;
            step = 0;
          }
          float a = 0.5f * (1.0f - cosf(6.2831853f * step / ${mic_cycle_steps}));
          lv_obj_set_style_text_opa(
              id(lbl_icon), (lv_opa_t) (${mic_opa_min} + a * (255 - ${mic_opa_min})),
              LV_PART_MAIN);
          lv_obj_align(id(lbl_icon), LV_ALIGN_CENTER, 0,
                       -(int16_t) (a * ${mic_lift}));
          step = (step + 1) % ${mic_cycle_steps};

  # ------------------------------------------- Animation der Sprachausgabe
  # Sprachausgabe hat keinen Ring mehr, sondern fuenf Balken als Aequalizer.
  # Gleiches Muster wie bei den Punkten: angehobene Kosinuswelle, jeder Balken
  # ein Fuenftel Zyklus versetzt, geschrieben ueber die LVGL-C-API. Die
  # Amplitude ist pro Balken skaliert (aussen flacher als innen), damit die
  # Gruppe rund in das runde Display passt.
  #
  # `lv_obj_align` muss auch hier nach jedem `lv_obj_set_size` folgen, sonst
  # waechst der Balken nach unten statt aus seiner Mitte. Ein Ruecksetzen wie
  # beim Mikrofon braucht es nicht: die Balken sind ausserhalb der Phase
  # versteckt (update_ui) und der erste Takt schreibt alle Werte neu.
  - interval: ${bar_step_time}
    then:
      - lambda: |-
          static bool aktiv = false;
          static uint8_t step = 0;
          if (id(voice_assistant_phase) != ${phase_replying}) {
            aktiv = false;
            return;
          }
          if (!aktiv) {
            aktiv = true;
            step = 0;
          }
          static const int16_t X[5] = {-2 * ${bar_gap}, -${bar_gap}, 0,
                                       ${bar_gap}, 2 * ${bar_gap}};
          static const float SKALA[5] = {0.45f, 0.75f, 1.0f, 0.75f, 0.45f};
          lv_obj_t *const bars[5] = {id(bar_1), id(bar_2), id(bar_3),
                                     id(bar_4), id(bar_5)};
          const uint8_t versatz = ${bar_cycle_steps} / 5;
          for (uint8_t i = 0; i < 5; i++) {
            uint8_t p = (step + ${bar_cycle_steps} - versatz * i) % ${bar_cycle_steps};
            float a = 0.5f * (1.0f + cosf(6.2831853f * p / ${bar_cycle_steps}));
            a *= SKALA[i];
            int16_t hoehe = ${bar_size_min}
                          + (int16_t) (a * (${bar_size_max} - ${bar_size_min}));
            lv_obj_set_size(bars[i], ${bar_width}, hoehe);
            lv_obj_align(bars[i], LV_ALIGN_CENTER, X[i], 0);
            lv_obj_set_style_bg_opa(
                bars[i], (lv_opa_t) (${bar_opa_min} + a * (255 - ${bar_opa_min})),
                LV_PART_MAIN);
          }
          step = (step + 1) % ${bar_cycle_steps};
