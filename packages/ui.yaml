    # --------------------------------------------------------------- Standby
    - id: page_standby
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: lbl_clock
            align: CENTER
            y: -20
            text: "--:--"
            text_font: font_clock
            text_color: ${color_text}
            text_align: CENTER
        # Tritt an die Stelle der Uhr, solange ein Timer laeuft. Der Countdown
        # ist dann die Information, die man im Vorbeigehen sehen will - die
        # Uhrzeit steht bis dahin auf jedem anderen Geraet im Raum.
        # Geschrieben von update_timer_ui, das der Sekundentakt aufruft.
        #
        # Drei Labels statt einem, damit der Doppelpunkt ruhig in der Mitte
        # steht: Figtrees Ziffern sind proportional (eine "1" ist schmaler als
        # eine "8"), ein einzelnes zentriertes Label wanderte deshalb mit jeder
        # Sekunde hin und her. Die Minuten sind rechtsbuendig an den
        # Doppelpunkt gesetzt, die Sekunden linksbuendig - beide wachsen also
        # von ihm weg statt die ganze Zeile zu verschieben.
        - label:
            id: lbl_timer_pre
            align: CENTER
            x: -${timer_part_offset}
            y: -15
            width: ${timer_part_width}
            text: ""
            text_font: font_timer
            text_color: ${color_text}
            text_align: RIGHT
            hidden: true
        - label:
            id: lbl_timer_colon
            align: CENTER
            x: 0
            y: -15
            width: ${timer_colon_width}
            text: ""
            text_font: font_timer
            text_color: ${color_text}
            text_align: CENTER
            hidden: true
        - label:
            id: lbl_timer_sec
            align: CENTER
            x: ${timer_part_offset}
            y: -15
            width: ${timer_part_width}
            text: ""
            text_font: font_timer
            text_color: ${color_text}
            text_align: LEFT
            hidden: true

        # Zweitzeile fuer beide Faelle: im Normalfall das Datum, waehrend eines
