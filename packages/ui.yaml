              # update_dial ueber den gerade gueltigen Minutenstrich legt -
              # sie deckt ihn mit ${dial_mark_len} px Laenge vollstaendig ab.
              # Ein eigenes Widget statt eines umgefaerbten Strichs, weil sich
              # mit der Farbe auch die Laenge aendert: die Punkte eines
              # `line:` liegen in einem Array, das die Komponente je Widget
              # haelt - eines davon jede Minute zu tauschen und beim naechsten
              # Mal wieder herzustellen waere derselbe Rechenweg zweimal.
              # Werte hier sind die Zwoelf-Uhr-Stellung; gesetzt wird sie beim
              # ersten update_dial.
              - line:
                  id: dial_active
                  align: CENTER
                  x: 0
                  y: -${dial_radius}
                  width: 1
                  height: ${dial_mark_len}
                  # In einer Flow-Sequenz muss die Substitution in
