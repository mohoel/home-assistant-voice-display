# WLAN-Package fuer den lokalen Build (assist-satellit.yaml + echtes
# secrets.yaml). Anders als packages/wifi-public.yaml ist hier eine SSID fest
# einkompiliert - fuers eigene Geraet soll `esphome run` sofort ohne
# Provisionierungsschritt ins bekannte Heimnetz gehen, kein Pairing noetig.
#
# Wer stattdessen auch das eigene Geraet ueber Improv/den Browser einrichten
# will (z. B. weil sich das WLAN mal aendert), kann trotzdem: captive_portal
# und improv_serial laufen hier genauso mit wie im oeffentlichen Build.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Default auf ESP32 ist LIGHT: der WLAN-Chip schlaeft zwischen Beacons und
  # verzoegert Pakete um bis zu ein DTIM-Intervall. Fuer den kontinuierlichen
  # Audio-Stream zum und vom Assistenten bedeutet das Jitter und Aussetzer.
  power_save_mode: none
  ap:
    password: !secret ap_password

captive_portal:

# Erlaubt, das WLAN direkt ueber die USB-Verbindung einzutragen - dieselbe,
# ueber die ESP Web Tools flasht (logger.hardware_uart: USB_SERIAL_JTAG in
# packages/core.yaml). esp-web-install-button erkennt Improv-faehige Firmware
# nach dem Flashen automatisch und zeigt einen zusaetzlichen
# "Wi-Fi verbinden"-Schritt direkt im Browser - ganz ohne den Umweg ueber
# Fallback-Hotspot und Captive Portal. Der Hotspot oben bleibt als
# Ruecksprungebene bestehen, falls jemand den Improv-Schritt in ESP Web Tools
# uebergeht oder die Seite vor dem Verbinden schliesst. Braucht kein eigenes
# uart:, sondern haengt sich an dieselbe Konsolen-Verbindung wie logger.
improv_serial:
