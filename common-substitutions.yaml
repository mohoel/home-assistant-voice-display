# Phasen-IDs, Farben und Timings der Firmware - ausgelagert aus lumi.yaml,
# damit die Geraetedatei kurz bleibt und alle einstellbaren Werte an einer
# Stelle stehen.
#
# name/friendly_name stehen bewusst NICHT hier, sondern in lumi.yaml (per
# YAML-Merge-Key, siehe dort): esphome.name ist zugleich mDNS-Hostname und
# Build-Ordner-Name. packages/core.yaml setzt zusaetzlich
# name_add_mac_suffix: true, damit mehrere aus derselben Firmware geflashte
# Geraete trotz gleichem kompiliertem Namen einen eindeutigen Hostnamen
# bekommen (Details und die Historie der frueheren Kollision siehe
# CLAUDE.md).
# Muss zu jedem Release-Tag passen - Home Assistants Update-Entity
# (packages/update.yaml) vergleicht diesen Wert als reinen String gegen
# ota-manifest.json.
# War lange nicht synchron gehalten (stand auf "0.1.0", obwohl der letzte Tag
# v0.4.1 war) - das faellt jetzt sofort auf, weil das Geraet sonst dauerhaft
# "Update verfuegbar" zeigt.
project_version: "0.5.7"

# Voice-Assistant-Phasen. Die IDs entsprechen dem offiziellen
# ESP32-S3-Box-3-Projekt, damit spaeter Code von dort uebernommen werden kann.
phase_idle: "1"
phase_listening: "2"
phase_thinking: "3"
phase_replying: "4"
# Ergebnisanzeige statt Balken: ein Messwert oder ein Haken. Welches von
# beidem, entscheidet result_kind (packages/voice.yaml) aus dem Antworttext.
phase_result: "5"
phase_not_ready: "10"
phase_error: "11"
phase_muted: "12"
# Ein abgelaufener Timer klingelt. Die 20 stammt aus der Phasentabelle in
# docs/plan.md und laesst Platz fuer weitere Zwischenzustaende.
phase_timer_ringing: "20"

# Phasenfarben (0xRRGGBB). Es gibt keinen Ring mehr - jede Phase traegt sich
# ueber ein Widget in der Bildschirmmitte: color_listening faerbt das
# atmende Mikrofon-Icon, color_thinking die drei Punkte, color_replying die
# fuenf Balken der Sprachausgabe, color_error das Warnicon.
color_listening: "0x03A9F4"
color_thinking: "0xFFC107"
color_replying: "0x4CAF50"
color_error: "0xF44336"
# Timer-Ring am Bildschirmrand und die Glocke beim Klingeln.
color_timer: "0xFF9800"
# Ergebnisfarbe - an drei Stellen: der Haken nach einem Befehl ohne
# Rueckmeldung ("Eingeschaltet") auf page_main, die Trennlinie und die
# Einheit der Messwertanzeige (siehe result_* unten), und das Gesicht auf
# page_face, wenn dort statt des Hakens eine Bestaetigung faellig ist (siehe
# color_face weiter unten).
color_result: "0x4CAF50"

# Texte
color_text: "0xFFFFFF"
color_text_dim: "0x707070"

# Zuhoeren: kein Ring, sondern nur das blaue Mikrofon-Icon in der Mitte, das
# atmet - dieselbe angehobene Kosinuswelle wie bei den Punkten der
# Verarbeitung, nur mit einem einzigen Widget und ohne Versatz. Es wandert
# zwischen mic_opa_min und voller Deckkraft und hebt sich dabei um mic_lift.
# Ein Zyklus dauert mic_step_time * mic_cycle_steps = 40ms * 22 = 880ms.
#
# Die Deckkraft darf hier animiert werden, obwohl genau das am Ring geruckelt
# hat: dort mussten vier konzentrische Arcs ueber den kompletten 466-px-Kranz
# per Alpha gegen Schwarz gemischt werden, hier ist es ein 240x240-Label.
mic_opa_min: "60" # 0..255
mic_lift: "18"
mic_step_time: 40ms
mic_cycle_steps: "22"

# Verarbeitung: drei Punkte statt Ring. Eine Welle laeuft von links nach
# rechts durch, jeder Punkt schwillt dabei von dot_size auf dot_size_max an,
# hebt sich um dot_lift und geht von dot_opa_min auf volle Deckkraft.
# Der Takt ist dot_step_time * dot_cycle_steps = ein kompletter Durchlauf.
#
# Die Gruppe ist genau so breit wie das Mikrofon-Icon hoch ist (216 px, siehe
# font_icon in packages/ui.yaml): 2 * dot_gap + dot_size_max = 158 + 58 = 216.
# Wer font_icon aendert, muss dot_gap mitziehen.
dot_size: "42"
dot_size_max: "58"
dot_gap: "79"
dot_lift: "18"
dot_opa_min: "70" # 0..255
dot_step_time: 60ms
dot_cycle_steps: "12"

# Sprachausgabe: fuenf Balken als Aequalizer statt Ring. Jeder Balken ist
# bar_width breit, die Gruppe ist wieder genau so breit wie das Mikrofon-Icon
# hoch ist (216 px): 4 * bar_gap + bar_width = 192 + 24 = 216.
#
# Die Hoehe laeuft als angehobene Kosinuswelle zwischen bar_size_min und
# bar_size_max, jeder Balken ein Fuenftel Zyklus versetzt; die Amplitude ist
# zur Mitte hin am groessten (Skala im Lambda in packages/ui.yaml), damit die
# Gruppe rund im Display sitzt. Ein Zyklus dauert
# bar_step_time * bar_cycle_steps = 40ms * 20 = 800ms.
bar_width: "24"
bar_gap: "48"
bar_size_min: "28"
bar_size_max: "216"
bar_opa_min: "90" # 0..255
bar_step_time: 40ms
bar_cycle_steps: "20"

# Wie lange ein Ergebnis (Messwert oder Haken) nach dem Ende der
# Sprachausgabe stehen bleibt. Die fuenf Balken der Sprachausgabe bekommen
# diese Nachlaufzeit bewusst *nicht*: sie sind die Visualisierung des Tons
# und enden mit ihm - siehe end_session in packages/voice.yaml.
result_hold_time: 3s

# Messwertanzeige (page_main, phase_result, result_kind == 1): Zahl oben,
# duenne Trennlinie, Einheit klein und in Grossbuchstaben darunter - Design
# "Rundes Display Konzepte" (Claude-Design-Projekt "Rundes Display
# Masseinheiten-Design", Konzept 1a).
#
# Ersetzt die fruehere Reihen-Anordnung mit einem Icon *ueber* der Zahl, das
# aus der Einheit erschlossen wurde (Thermometer, Blitz, ...). Dieses Design
# braucht kein Icon mehr - deshalb muss keine Einheit mehr vorab auf ein Icon
# festgelegt werden, jede von der Erkennung in packages/voice.yaml gelieferte
# Einheit laesst sich einfach als Text anzeigen.
result_divider_width: "47"
result_divider_height: "2"
# Abstand zwischen Zahl, Trennlinie und Einheit - gilt fuer beide Luecken
# gleichermassen (LVGL pad_row auf dem Flex-Container).
result_gap: "18"
result_unit_letter_space: "5"
# Eigene, groessere Schrift statt der Wiederverwendung von font_timer (110 px,
# fuer den siebenstelligen Timer-Countdown "1:23:45" austariert) - auf dem
# Geraet wirkte der Messwert damit deutlich kleiner und nicht mittig, als das
# Mockup vorgab. 150 px ist bewusst NICHT fuer den kuerzesten Fall gewaehlt
# (eine runde Zahl wie "22"), sondern fuer den Regelfall mit einer
# Nachkommastelle ("22,4"), da on_tts_start (packages/voice.yaml) den Wert
# immer auf eine Nachkommastelle rundet und anzeigt - "22" allein kommt gar
# nicht mehr vor. Nach den echten Zeichenbreiten aus der Figtree-Bold-Datei
# (kein Tabellensatz, "0" ist breiter als "1") passt selbst der breiteste
# realistische Fall, ein Luftdruckwert wie "1013,2", mit rund 433 px noch in
# die 440 px breite Box unten.
result_value_font_size: "150"

# Timer. Home Assistant schickt Timer-Ereignisse von sich aus an den
# Satelliten (on_timer_* in packages/voice.yaml) - dafuer braucht es keine
# Automation in HA. Waehrend ein Timer laeuft, liegt ein Ring am
# Bildschirmrand, der sich im Sekundentakt leert; er haengt im top_layer von
# LVGL und ist deshalb auf jeder Seite sichtbar, auch im Standby.
#
# Der Ring ist bewusst genau eine Schicht ohne Glow und ohne
# Deckkraftanimation. Die frueheren Ringe sind an der Zeichenbandbreite
# gescheitert, weil vier konzentrische Arcs 25-mal je Sekunde ueber den
# vollen Kranz gemischt wurden; dieser hier aendert sich einmal pro Sekunde
# um einen Bruchteil eines Grades.
#
# 462 statt 466: aussen bleiben zwei Pixel Rand. Die Luecke von einem Grad am
# Zwoelf-Uhr-Punkt (start 270, end 269) ist der uebliche LVGL-Weg zu einem
# Vollkreis - start == end waere entartet und ergaebe gar keinen Bogen.
timer_ring_size: "462"
timer_ring_width: "18"
# Groesse der Countdown-Ziffern in der Bildschirmmitte. 110 px statt der
# 140 px der Standby-Uhr, damit auch "1:23:45" (sieben Zeichen) in den runden
# Bildschirm passt.
timer_font_size: "110"
# Der Countdown steht in drei Labels, damit der Doppelpunkt genau in der
# Bildschirmmitte sitzt und die Ziffern nicht mit jeder Sekunde wandern:
# Figtrees Ziffern sind proportional, eine "1" ist schmaler als eine "8" -
# bei einem einzigen zentrierten Label verschiebt sich dadurch der ganze
# Countdown. Minuten sind rechtsbuendig an den Doppelpunkt gesetzt, Sekunden
# linksbuendig; beide Boxen sind timer_part_width breit, der Doppelpunkt
# sitzt in einer timer_colon_width breiten Box mittig.
#
# Die x-Versaetze der Seitenboxen ergeben sich daraus:
#   timer_part_width / 2 + timer_colon_width / 2 = 125 + 16 = 141
timer_part_width: "250"
timer_colon_width: "32"
timer_part_offset: "141"
# Mit Stunden ("1:23:45") waere die linke Box zu breit fuer den runden
# Bildschirm, wenn der Doppelpunkt in der Mitte bliebe. Dann wandert die
# ganze Gruppe um diesen Betrag nach rechts - die Ziffern stehen weiterhin
# ruhig, nur der Ankerpunkt ist ein anderer.
timer_hour_shift: "48"
# Ab zehn Stunden ("12:34:56") kommt links eine Ziffer dazu und der
# Countdown steht nicht mehr sauber in der Mitte. Ein zweiter Versatz war der
# naheliegende Versuch und hat es auf dem Geraet schlimmer gemacht - die
# Gruppe rutschte sichtbar heraus. Es bleibt bei einem Versatz; Timer ueber
# zehn Stunden sind der dokumentierte Grenzfall (README).
# Ausblenden des Rings, wenn ein Timer abgebrochen wird oder ablaeuft. Er
# laeuft dabei auf null und wird transparent; Dauer = Schritte * Schrittzeit.
ring_fade_steps: "14"
ring_fade_step_time: 25ms
# Klingeln: Laenge der Tondatei (2,73 s) plus eine kurze Pause. Nach
# timer_ring_timeout gibt das Geraet von selbst Ruhe, falls niemand da ist.
timer_sound_repeat: 3.2s
timer_ring_timeout: 2min

# Standby heisst aus: ohne Beruehrung schaltet sleep_display
# (packages/ui.yaml) das Display nach einer einstellbaren Zeit komplett ab -
# leere Seite page_off *und* Helligkeit 0. Eine gedimmte Zwischenstufe gibt es
# bewusst nicht mehr; auf AMOLED waere eine dauerhaft gedimmte Uhr der einzige
# staendig leuchtende Inhalt.
#
# Diese Zeit stand frueher hier als Substitution standby_timeout (nur per
# Neubau aenderbar) und ist jetzt die HA-Entity num_standby_timeout
# (packages/settings.yaml) - so lange ist die Uhr bzw. das Zifferblatt nach
# einem Tippen zu sehen, zur Laufzeit einstellbar.
#
# Zwei Stufen, wenn der Bildschirm an ist, beide als HA-Entity in
# packages/settings.yaml und nicht mehr hier als Substitution: der echte
# Standby (Uhr, Zifferblatt, wartendes Gesicht) laeuft auf
# num_standby_brightness, alles andere Sichtbare (Zuhoeren, Verarbeitung,
# Antwort, Fehler, Hinweis, klingelnder Timer) auf num_display_brightness
# ("Displayhelligkeit"). Frueher lag die zweite Stufe fest bei 100 % und galt
# nur waehrend des Zuhoerens (Substitution active_brightness); alle anderen
# wachen Phasen fielen mangels eigener Einstellung auf die Standby-Helligkeit
# zurueck - sichtbar als Abdunkeln beim Denken. Das ist keine Rueckkehr der
# frueheren gedimmten Zwischenstufe im Standby: Standby heisst weiterhin aus,
# hier geht es nur um die Helligkeit eines *sichtbaren* Bildschirms.

# Zifferblatt: zweite Standby-Seite nach dem Design "Runde Zeitanzeige".
# Es hat bewusst *keine* Zeiger - die Stunde ist die hervorgehobene Ziffer,
# die Minute der hervorgehobene Strich im Kranz. Ausgewaehlt wird die Seite
# ueber sel_standby_page auf der Web-Bedienseite.
#
# dial_radius, dial_mark_len und dial_num_radius beschreiben die Marken, die
# update_dial (packages/ui.yaml) zur Laufzeit setzt. Die 60 festen Striche
# und die zwoelf Ziffern sind mit denselben Werten erzeugt worden und stehen
# als Literale im YAML - wer hier dreht, muss sie neu erzeugen. Die Formel
# dafuer steht im Kopfkommentar von page_dial.
dial_radius: "218"
dial_mark_len: "20"
dial_num_radius: "168"
# Akzentfarbe des Zifferblatts. Der Wert stammt aus dem Design-Mockup.
color_dial: "0xFF9F4D"

# Gesicht: dritte Standby-Seite nach dem Design "Animierter Charakter rundes
# Display" (Device Face.dc.html). Anders als Uhr und Zifferblatt ist sie nicht
# nur eine Standby-Seite: wird sie gewaehlt, traegt dasselbe Gesicht auch
# Zuhoeren, Verarbeitung und Sprachausgabe - genau die drei Phasen, die sonst
# Mikrofon-Icon, Punkte und Balken zeigen. Alle uebrigen Zustaende (Messwert,
# Fehler, stumm, nicht bereit, Timer, Hinweis) bleiben bei page_main, weil sie
# Information tragen und keine Animation sind.
#
# Die Geometrie stammt 1:1 aus dem Mockup, das schon auf 466x466 gezeichnet
# ist; umgerechnet ist nur der Bezugspunkt (dort linke obere Ecke, hier die
# Bildschirmmitte). Alle Versaetze sind positiv notiert und im YAML bzw. im
# Lambda vorzeichenrichtig eingesetzt - "-${face_eye_dy}" statt einer
# negativen Substitution, sonst stuende irgendwo "--71".
color_face: "0xCFEEFF"
# Augen: 82x132 mit Radius 20, Mitte je 61 px neben und 71 px ueber der
# Bildschirmmitte (Mockup: left 131/253, top 96).
face_eye_w: "82"
face_eye_h: "132"
face_eye_radius: "20"
face_eye_dx: "61"
face_eye_dy: "71"
# Mund: 132 breit, im Ruhezustand 18 hoch, 104 px unter der Mitte. Radius 9
# ist genau die halbe Ruhehoehe - der Mund ist also eine Pille, solange er
# schmal ist, und wird zum abgerundeten Rechteck, wenn er aufgeht. LVGL
# klemmt den Radius auf die halbe Kantenlaenge, das gilt in beide Richtungen.
face_mouth_w: "132"
face_mouth_h: "18"
face_mouth_h_max: "46"
face_mouth_radius: "9"
face_mouth_dy: "104"
# Zwei Mundformen, die nur als Marotte im Warten vorkommen: das Staunen ist
# ein rundes "O" (Radius genau die halbe Kantenlaenge), das Grinsen ein
# breiterer, flacherer Strich. Der Radius wird dafuer zur Laufzeit gesetzt -
# ein dauerhaft grosser Radius machte auch den offenen Mund zur Pille und
# naehme ihm die Form, die face_mouth_h_max meint.
face_mouth_o_w: "46"
face_mouth_o_h: "46"
face_mouth_o_radius: "23"
face_mouth_w_grin: "170"
face_mouth_h_grin: "14"
# Lachen: drittes Marotten-Mundmaul, ein offenes Oval statt Grinsens duennem
# Strich oder Staunens rundem "O" - breiter als Staunen, flacher als hoch,
# damit es als geoeffneter Lachmund und nicht als zweites Staunen wirkt.
# Radius = halbe Hoehe (Kapsel-/Oval-Form, wie face_mouth_o_radius bei
# Staunen). Augen und Kopfversatz dazu sind Literale im Lambda, wie bei
# den anderen Marotten auch.
face_mouth_w_lachen: "130"
face_mouth_h_lachen: "52"
face_mouth_radius_lachen: "26"
# Zunge (nur als Marotte im Warten). Sie liegt *unter* dem Mund in der
# Z-Ordnung und ragt 6 px in ihn hinein, damit ihre oberen Ecken verdeckt
# sind - LVGL kann Radien nur fuer alle vier Ecken zugleich.
face_tongue_w: "44"
face_tongue_h: "34"
face_tongue_dy: "124"
# Zuhoeren (blau) und Verarbeitung (orange) faerben Augen, Mund und Zunge
# direkt ein (siehe die Farbwahl im `if (phase != last_phase)`-Zweig,
# packages/ui.yaml) - Ersatz fuer das fruehere Fragezeichen beim Denken, das
# als zu unruhig empfunden wurde. Sonst gilt wieder color_face.
#
# Eine separate farbige "Wolke" hinter dem Gesicht (eigenes Objekt, nur
# shadow_* sichtbar) wurde zweimal versucht und wieder verworfen: selbst
# gedrosselt (fester shadow_width, nur Deckkraft animiert, 300-ms-Takt) blieb
# der Weichzeichner teuer genug fuer sichtbar stockende Augenbewegung beim
# Phasenwechsel, und eine fruehere, staerker animierte Fassung (shadow_width
# bis 210, alle 130 ms) liess den I2S-Bus einmal mit "Parent bus is busy"
# rund 20 Sekunden haengen, waehrend die Sprachausgabe stumm blieb - derselbe
# eng bemessene Zeitrahmen, den schon die Mikrofon/Lautsprecher-Bus-Handoffs
# an anderer Stelle in diesem Dokument brauchen. Das Einfaerben der ohnehin
# vorhandenen Widgets kostet dagegen nichts zusaetzlich: kein neues Objekt,
# kein Weichzeichner, nur ein Style-Wechsel an kleinen Flaechen, der genauso
# billig ist wie jede andere Aenderung in diesem Takt.
# Glow. Das ist der einzige teure Teil des Gesichts: LVGL zeichnet einen
# echten Weichzeichner, und die Augen bewegen sich beim Phasenwechsel ueber
# rund eine halbe Sekunde jeden Takt. Bei Ruckeln ist das die erste
# Stellschraube - face_glow auf 0 nimmt den Weichzeichner ganz heraus.
face_glow: "20"
face_glow_opa: 55%
# Ein Takt fuer alle vier Zustaende, rund 30 Bilder je Sekunde. Er laeuft nur,
# solange page_face vorne liegt.
face_step_time: 33ms

# Wartezeit nach einem Tipp, bevor detect_tap (packages/ui.yaml) ihn als
# "single_press" an Home Assistant meldet statt auf einen zweiten Tipp zu
# warten. Bekannt aus mobilen Betriebssystemen als Doppeltipp-Fenster.
double_tap_window: 350ms

# Firmware-Update ueber Home Assistant (packages/update.yaml). Kein
# Bedienelement am Geraet - Anzeige und
# "Installieren"-Knopf laufen ausschliesslich ueber HAs eigenes
# Update-Dashboard. Keine CNAME im Repo -> die Standard-GitHub-Pages-Adresse.
update_manifest_url: "https://mohoel.github.io/home-assistant-voice-lumi/ota-manifest.json"
# Default von update: http_request waere ohnehin 6h - hier trotzdem explizit
# als Erweiterungspunkt, falls das mal haeufiger geprueft werden soll.
update_check_interval: 6h

