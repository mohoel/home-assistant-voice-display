blueprint:
  name: "Lumi: Musik abspielen (Music Assistant)"
  description: >-
    Leitet einen Musikwunsch direkt an einen Music-Assistant-Player weiter,
    ganz ohne Firmware-Änderung — das Zielgerät steckt im Sprachbefehl
    selbst, nicht in Lumis eigener Audio-Pipeline. Braucht die eingebaute
    lokale Intent-Erkennung als Konversationsagent, funktioniert aber genauso
    mit einem LLM wie Claude, weil der Satzauslöser der Assist-Pipeline
    vorgeschaltet ist. Für frei formulierte Musikwünsche ("Spiel mal was
    Entspanntes") reicht das nicht — dafür bräuchte es ein eigenes
    LLM-Werkzeug-Skript nach demselben Muster wie „Freie Wetterfragen".

    Angelehnt an das offizielle Music-Assistant-Blueprint
    ["Lokale Sprachsteuerung"](https://github.com/music-assistant/voice-support),
    aber auf sechs feste Medientypen verkürzt (deren `media_type`-Werte direkt
    aus `music_assistant.play_media`) und um Podcasts ergänzt.

    Alle Sätze beginnen mit „Spiele"/„Höre"/„Spiel", gefolgt vom Medientyp
    (Künstler/Band/Gruppe, Lied/Titel/Song, Album/Platte, Playlist/
    Wiedergabeliste, Podcast, Radiosender/Radio/Sender) und dem Namen.
    Optional folgt bei Lied und Album zusätzlich "vom Künstler …" (wörtlich
    mit dem Wort „Künstler"/„Band"/„Gruppe" — ohne dieses Wort landet der
    Künstlername als Teil des Titels/Albumnamens, was Music Assistant meist
    trotzdem findet, nur weniger präzise), und immer optional ein Zielraum
    oder -gerät ("in der Küche", "auf dem Wohnzimmer-Lautsprecher") — fehlt
    er, spielt der unten gewählte Standard-Player.

    Beispiele:

    ```

    Spiele den Künstler Herbert Grönemeyer im Wohnzimmer

    Höre das Album Mensch vom Künstler Herbert Grönemeyer in der Küche

    Spiele den Titel Bochum im Schlafzimmer

    Höre die Playlist Fokus Musik auf dem Sonos

    Spiele den Podcast Fest und Flauschig

    Höre das Radio Deutschlandfunk in der Küche

    ```

    Die Zielsuche prüft in dieser Reihenfolge: ein Player- oder
    Bereichsname im Satz, dann der Bereich des ansprechenden Assist-Geräts,
    zuletzt der Standard-Player unten.

    Bevor etwas abgespielt wird, sucht das Blueprint selbst mit
    `music_assistant.search` (25 Kandidaten statt der 8, die `play_media`
    intern für seine eigene Namenssuche verwendet) nach einer eindeutigen
    URI und bevorzugt darunter einen exakten Namenstreffer — das umgeht
    Music Assistants eingebaute Namensauflösung, die bei mehrdeutigen oder
    unsauber katalogisierten Einträgen (typisch bei Radiosendern über
    Radio-Browser) nicht zuverlässig den richtigen ersten Treffer liefert.
    Schlägt die Suche fehl oder findet nichts, greift ersatzweise wieder der
    rohe, gesprochene Name wie zuvor — nichts wird dadurch unzuverlässiger
    als ohne diesen Schritt, nur ein klein wenig langsamer.

    **Cover auf Lumis Display (optional):** Lumi selbst spielt bei diesem
    Blueprint nichts — der Ton kommt aus dem oben ermittelten Zielgerät, nicht
    aus Lumis eigenem Lautsprecher. Trotzdem lässt sich das Cover des
    Zielgeräts auf Lumis Display zeigen, solange dort etwas läuft: dafür unten
    optional die eigene `zeige_musik`-Aktion des Geräts eintragen (Servicename
    hängt vom kompilierten Gerätenamen ab, z. B.
    `esphome.lumi_a0d0a8_zeige_musik`) und darin folgende drei Vorlagen:

    ```

    titel: {{ titel }}

    untertitel: {{ untertitel }}

    cover_url: {{ cover_url }}

    ```

    sowie optional die zugehörige `verstecke_musik`-Aktion, die das Blueprint
    von selbst aufruft, sobald das Zielgerät nicht mehr spielt — ohne
    Vorlagen, keine Parameter. Ist eine der beiden Aktionen leer, passiert an
    dieser Stelle nichts Zusätzliches, der Sprachbefehl selbst funktioniert
    trotzdem unverändert. Für den umgekehrten Fall — Lumi selbst ist das
    Music-Assistant-Ziel, der Ton kommt also tatsächlich aus Lumi — gibt es
    stattdessen das eigenständige Blueprint "Lumi: Musik-Cover anzeigen".
  domain: automation
  source_url: https://github.com/mohoel/home-assistant-voice-lumi/blob/main/blueprints/automation/lumi/musik_abspielen.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    standard_player:
      name: Standard-Media-Player
      description: >-
        Der Music-Assistant-Player, der spielt, wenn der Satz weder einen
        passenden Bereich noch ein passendes Gerät nennt.
      selector:
        entity:
          filter:
            integration: music_assistant
            domain: media_player
    zeige_musik_aktion:
      name: Cover-Aktion (optional)
      description: >-
        Die Lumi-Aktion `zeige_musik` — zeigt das Cover des Zielgeräts auf
        Lumis Display, siehe Beschreibung oben.
      default: []
      selector:
        action: {}
    verstecke_musik_aktion:
      name: Cover-Ausblenden-Aktion (optional)
      description: >-
        Die Lumi-Aktion `verstecke_musik` — wird automatisch aufgerufen,
        sobald das Zielgerät nicht mehr spielt. Nur relevant, wenn oben eine
        Cover-Aktion gewählt ist.
      default: []
      selector:
        action: {}
    basis_url:
      name: Basis-Adresse von Home Assistant (optional)
      description: >-
        Nur für die Cover-Anzeige: wird vor eine relative
        `entity_picture`-Adresse gesetzt, falls das Zielgerät keine
        vollständige Bild-URL liefert. Z. B.
        `http://homeassistant.local:8123`. Leer lassen, wenn keine
        Cover-Aktion gewählt ist oder das Zielgerät ohnehin vollständige
        URLs liefert (z. B. Music Assistant selbst, siehe Beschreibung oben).
      default: ""
      selector:
        text: {}

mode: restart

triggers:
  - trigger: conversation
    command:
      - "(spiele|höre|spiel) [(den|die) ](künstler|band|gruppe) {medium} [(im|in|auf|über) [(dem|der) ]{ziel}]"
    id: artist
  - trigger: conversation
    command:
      - "(spiele|höre|spiel) [(das|den) ](lied|titel|song) {medium} [(von [(dem|der) ]|vom )(künstler|band|gruppe) {kuenstler}] [(im|in|auf|über) [(dem|der) ]{ziel}]"
    id: track
  - trigger: conversation
    command:
      - "(spiele|höre|spiel) [(das|die) ](album|platte) {medium} [(von [(dem|der) ]|vom )(künstler|band|gruppe) {kuenstler}] [(im|in|auf|über) [(dem|der) ]{ziel}]"
    id: album
  - trigger: conversation
    command:
      - "(spiele|höre|spiel) [die ](playlist|wiedergabeliste) {medium} [(im|in|auf|über) [(dem|der) ]{ziel}]"
    id: playlist
  - trigger: conversation
    command:
      - "(spiele|höre|spiel) [den ]podcast {medium} [(im|in|auf|über) [(dem|der) ]{ziel}]"
    id: podcast
  - trigger: conversation
    command:
      - "(spiele|höre|spiel) [(den|das) ](radiosender|radio|sender) {medium} [(im|in|auf|über) [(dem|der) ]{ziel}]"
    id: radio

conditions: []

actions:
  - variables:
      standard_player: !input standard_player
      basis_url: !input basis_url
      medientyp: "{{ trigger.id }}"
      assist_geraet_id: "{{ trigger.device_id }}"
      medium: "{{ trigger.slots.medium }}"
      kuenstler: "{{ trigger.slots.kuenstler | default }}"
      ziel_name: "{{ trigger.slots.ziel | default }}"
      mass_config_entry_id: "{{ config_entry_id(standard_player) }}"
      mass_ergebnisfeld: >-
        {{ {"artist": "artists", "track": "tracks", "album": "albums",
            "playlist": "playlists", "podcast": "podcasts",
            "radio": "radio"}[trigger.id] }}
      spieler_nach_playername: >-
        {{ integration_entities('music_assistant') | expand
           | selectattr('name', 'match', ziel_name ~ '$', ignorecase=true)
           | map(attribute='entity_id') | list }}
      spieler_nach_bereichsname: >-
        {{ areas() | map('area_name')
           | select('match', ziel_name ~ '$', ignorecase=true)
           | map('area_entities') | sum(start=[])
           | select('in', integration_entities('music_assistant')) | list }}
      spieler_nach_geraetebereich: >-
        {{ area_entities(area_id(assist_geraet_id))
           | select('in', integration_entities('music_assistant')) | list }}
      media_player_ziel: |
        {{ spieler_nach_playername or spieler_nach_bereichsname
           or spieler_nach_geraetebereich or [standard_player] }}
      media_player_name: "{{ media_player_ziel | map('state_attr', 'friendly_name') | join(', ') }}"
  - alias: >-
      Eindeutige URI für den Medienwunsch suchen, statt play_media raten zu
      lassen
    action: music_assistant.search
    continue_on_error: true
    response_variable: mass_suche
    data: >-
      {{ dict({"config_entry_id": mass_config_entry_id, "name": medium,
               "artist": kuenstler, "media_type": [medientyp],
               "limit": 25}.items() | selectattr('1')) }}
  - variables:
      mass_alle_uris: >-
        {{ (mass_suche[mass_ergebnisfeld]
            if mass_suche is defined and mass_suche is mapping else [])
           | map(attribute='uri') | list }}
      mass_exakte_uris: >-
        {{ (mass_suche[mass_ergebnisfeld]
            if mass_suche is defined and mass_suche is mapping else [])
           | selectattr('name', 'match', '^' ~ medium ~ '$', ignorecase=true)
           | map(attribute='uri') | list }}
      spieldaten:
        media_id: "{{ (mass_exakte_uris or mass_alle_uris) | first | default(medium) }}"
        media_type: "{{ medientyp }}"
        artist: "{{ kuenstler }}"
  - alias: Medium an den ermittelten Music-Assistant-Player schicken
    action: music_assistant.play_media
    target:
      entity_id: "{{ media_player_ziel }}"
    data: "{{ dict(spieldaten.items() | selectattr('1')) }}"
  - set_conversation_response: "{{ medium }} wird auf {{ media_player_name }} abgespielt"

  # ---------------------------------------------- Cover auf Lumis Display
  # Optional, siehe Beschreibung oben. Lumi spielt hier nichts selbst -
  # media_player_ziel ist ein fremdes Geraet, dessen Wiedergabeende dem
  # Geraet ohne diesen Block nie mitgeteilt wuerde (media_out bleibt die
  # ganze Zeit im Leerlauf). Deshalb ruft dieser Block verstecke_musik
  # selbst auf, statt sich wie beim Blueprint "Lumi: Musik-Cover anzeigen"
  # auf die lokale on_idle-Erkennung des Geraets zu verlassen.
  #
  # mode: restart oben ist Voraussetzung dafuer: ein neuer Sprachbefehl
  # waehrend eine fruehere Wiedergabe noch verfolgt wird, bricht die
  # wartenden Schritte unten ab und uebernimmt sofort die Anzeige - ohne
  # restart wuerde ein zweiter Befehl mangels freier Automations-Instanz
  # schlicht verworfen (Standardmodus single).
  #
  # Nur der erste Eintrag von media_player_ziel traegt das Cover - Lumi hat
  # nur ein Display, eine Gruppenwiedergabe auf mehreren Geraeten zeigt also
  # nur das erste.
  - if:
      - condition: template
        value_template: "{{ zeige_musik_aktion != [] }}"
    then:
      - variables:
          cover_ziel: "{{ media_player_ziel[0] }}"
      # Absichtlich delay/repeat statt wait_for_trigger: ein Trigger prueft
      # sein entity_id-Feld beim Erzeugen der Automation aus dem Blueprint
      # als woertlichen Wert (cv.entity_id), nicht als Vorlage - cover_ziel
      # steht aber erst zur Laufzeit fest, nicht beim Uebersetzen des
      # Blueprints. `entity_id: "{{ cover_ziel }}"` scheiterte deshalb schon
      # beim Anlegen der Automation ("Entity {{ cover_ziel }} ist weder eine
      # gueltige Entity-ID noch eine UUID") - nicht erst beim Ausfuehren,
      # die Automation existierte in dem Zustand ueberhaupt nicht.
      #
      # Bis zu 20 s abwarten, bis das Zielgeraet wirklich zu spielen beginnt
      # - Music Assistant braucht je nach Quelle/Netzwerk einen Moment zum
      # Puffern. Startet es in der Zeit nicht, bleibt die Cover-Anzeige fuer
      # diesen Aufruf einfach aus.
      - repeat:
          while:
            - condition: template
              value_template: >-
                {{ repeat.index <= 20
                   and not (is_state(cover_ziel, 'playing')
                            or is_state(cover_ziel, 'paused')) }}
          sequence:
            - delay: "00:00:01"
      - if:
          - condition: template
            value_template: >-
              {{ is_state(cover_ziel, 'playing') or is_state(cover_ziel, 'paused') }}
        then:
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ is_state(cover_ziel, 'playing')
                       or is_state(cover_ziel, 'paused') }}
              sequence:
                - variables:
                    roh_cover: "{{ state_attr(cover_ziel, 'entity_picture') | default('', true) }}"
                    cover_url: >-
                      {{ roh_cover if roh_cover.startswith('http')
                         else (basis_url ~ roh_cover if roh_cover else '') }}
                    titel: "{{ state_attr(cover_ziel, 'media_title') | default('', true) }}"
                    untertitel: >-
                      {{ state_attr(cover_ziel, 'media_artist')
                         or (state_attr(cover_ziel, 'media_content_type') | default('', true) | title) }}
                - if: []
                  then: !input zeige_musik_aktion
                # Alle 5 s erneut pruefen (Titelwechsel, Pause, Stopp) -
                # Polling statt eines Events, aus demselben Grund wie oben.
                # Kein unnoetiger Download am Geraet: stage_music
                # (packages/ui.yaml) ueberspringt das Neuladen der
                # Cover-Bilder, wenn sich Titel/Untertitel/Cover-URL
                # gegenueber dem letzten Aufruf nicht geaendert haben -
                # sonst luede ein stundenlang laufendes Wortradio sein
                # eigenes Cover alle 5 s neu herunter.
                - delay: "00:00:05"
          - if: []
            then: !input verstecke_musik_aktion
