# Home Assistant Voice Satellite
# Waveshare ESP32-S3-Touch-AMOLED-1.75 (rundes AMOLED 466x466, CO5300 + CST9217)
#
# Bauen und flashen:            esphome run assist-satellit.yaml
# Nur Konfiguration pruefen:    esphome config assist-satellit.yaml

substitutions:
  name: assist-satellit
  friendly_name: Assist Satellit
  project_version: "0.1.0"

  # Voice-Assistant-Phasen. Die IDs entsprechen dem offiziellen
  # ESP32-S3-Box-3-Projekt, damit spaeter Code von dort uebernommen werden kann.
  phase_idle: "1"
  phase_listening: "2"
  phase_thinking: "3"
  phase_replying: "4"
  phase_not_ready: "10"
  phase_error: "11"
  phase_muted: "12"

  # Ring-Farben je Phase (0xRRGGBB)
  color_listening: "0x03A9F4"
  color_thinking: "0xFFC107"
  color_replying: "0x4CAF50"
  color_error: "0xF44336"
  color_muted: "0x4A4A4A"
  color_not_ready: "0x78909C"

  # Texte
  color_text: "0xFFFFFF"
  color_text_dim: "0x707070"

  # Ring-Geometrie und -Tempo. Der Glow besteht aus drei immer breiteren,
  # immer transparenteren Kopien hinter dem scharfen Ring (aussen nach innen
  # gestapelt). Eine einzige Schicht ergab eine sichtbare Kante; die drei
  # Schichten addieren sich per Alpha zu ~11% / 32% / 63% / 100% und lesen
  # sich dadurch als weicher Verlauf.
  #
  # Damit alle Ringe konzentrisch liegen, gilt fuer jede Schicht
  # size = ring_size + (width - ring_width). Aussenkante der breitesten
  # Schicht: 460 px, also 3 px Rand zum 466-px-Display.
  ring_size: "430"
  ring_width: "14"
  ring_glow1_size: "438"
  ring_glow1_width: "22"
  ring_glow1_opa: "45%"
  ring_glow2_size: "448"
  ring_glow2_width: "32"
  ring_glow2_opa: "24%"
  ring_glow3_size: "460"
  ring_glow3_width: "44"
  ring_glow3_opa: "11%"
  spin_time_listening: 1400ms
  spin_time_thinking: 800ms

  # Standby
  standby_timeout: 30s
  standby_brightness: "50%"
  active_brightness: "100%"

packages:
  core: !include packages/core.yaml
  hardware: !include packages/hardware.yaml
  voice: !include packages/voice.yaml
  ui: !include packages/ui.yaml
