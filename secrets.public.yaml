# Platzhalter-Secrets für den Release-Build (siehe
# .github/workflows/release.yml und docs/index.html). Diese Datei enthält
# bewusst KEINE echten Zugangsdaten und wird ganz normal committet.
#
# wifi_ssid/wifi_password gibt es hier bewusst NICHT: die Firmware
# kompiliert gar keine WLAN-Zugangsdaten ein, siehe packages/wifi.yaml für
# die Begründung. Ein Platzhalter-Netz hätte das Gerät nur in eine
# Endlosschleife gegen ein nie existierendes Netz laufen lassen, statt die
# Browser-WLAN-Auswahl direkt nach dem Flashen zu zeigen.
#
# api_encryption_key ist ein fester, hier offen stehender Platzhalter — er
# schützt nichts, sondern ist nur nötig, damit Home Assistant sich beim
# Hinzufügen überhaupt verbindet. Wer einen eigenen, privaten Schlüssel will,
# ersetzt ihn hier und baut die Firmware selbst.
