# Platzhalter-Secrets für den öffentlichen Release-Build (siehe
# .github/workflows/release.yml und docs/index.html). Diese Datei enthält
# bewusst KEINE echten Zugangsdaten und wird ganz normal committet — anders
# als secrets.yaml, das für den eigenen Build mit echtem WLAN/API-Key gilt
# und nie ins Repo darf (siehe .gitignore).
#
# wifi_ssid/wifi_password gibt es hier bewusst NICHT: der öffentliche Build
# (assist-satellit-public.yaml) kompiliert gar keine WLAN-Zugangsdaten ein,
# siehe packages/wifi-public.yaml für die Begründung. Ein Platzhalter-Netz
# hätte das Gerät nur in eine Endlosschleife gegen ein nie existierendes
# Netz laufen lassen, statt die Browser-WLAN-Auswahl direkt nach dem Flashen
# zu zeigen.
#
# api_encryption_key ist ein fester, hier offen stehender Platzhalter — er
# schützt nichts, sondern ist nur nötig, damit Home Assistant sich beim
# Hinzufügen überhaupt verbindet. Für einen dauerhaften, sicheren Betrieb
# gehört danach ein lokaler Reflash mit eigenem secrets.yaml (siehe
# README, Abschnitt "Einrichtung") — der ersetzt Key, WLAN und OTA-Passwort
# durch echte, private Werte.
